window.dcExecute=function(key){
  var ids=Array.from(document.querySelectorAll('.dc-chk:checked')).map(function(c){return c.value});
  if(ids.length===0){alert('請先勾選要刪除的項目');return}
  if(!confirm('⚠️ 確定要刪除 '+ids.length+' 筆嗎?\n\n此操作無法復原!\n\n建議先匯出 CSV 備份'))return;
  if(!window._dcDeleteFn)return;
  window._dcDeleteFn(ids);
  saveState();
  closeModal();
  toast('✅ 已刪除 '+ids.length+' 筆,記得備份雲端');
  setTimeout(function(){showDataCleaning()},500);
};

window.dcExportCSV=function(key){
  var data;
  if(key==='ings')data=window.findUnusedIngs().map(function(i){return [i.id,i.name,i.cat,i.unit,i.price,i.stock]});
  else if(key==='custs')data=window.findUnusedCustomers().map(function(c){return [c.id,c.code,c.name,c.contact,c.phone,c.status]});
  else if(key==='orders')data=window.findOldOrders(90).map(function(o){return [o.id,o.custName,(o.orderDate||'').substring(0,10),o.status,o.total]});
  else if(key==='pos')data=window.findOldPOs().map(function(p){return [p.id,p.date,p.itemName,p.qty,p.unit,p.totalAmt]});
  else if(key==='batches')data=window.findOldBatches().map(function(b){return [b.id,b.batchNo,b.itemName,b.expiryDate,b.status]});
  if(!data||data.length===0)return;
  
  var headers=key==='ings'?['ID','名稱','類別','單位','進價','庫存']:
              key==='custs'?['ID','代碼','名稱','聯絡人','電話','狀態']:
              key==='orders'?['訂單號','客戶','下單日','狀態','金額']:
              key==='pos'?['採購單號','日期','品項','數量','單位','金額']:
              ['批次ID','批次號','品項','到期日','狀態'];
  
  var csv='\uFEFF'+headers.join(',')+'\n';
  data.forEach(function(row){
    csv+=row.map(function(v){return '"'+(v||'').toString().replace(/"/g,'""')+'"'}).join(',')+'\n';
  });
  
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='清理備份_'+key+'_'+toDay()+'.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ 備份已匯出');
};

// 🆕 IME-safe + debounce 搜尋輔助 (修中文輸入法注音卡頓問題)
// 用法: oninput="window._safeSearch(this,'ing')" + oncompositionstart/end
// ══════════════════════════════════════════════════════
window._searchTimers={};
window._searchHandlers={
  ing:function(){if(typeof window.ingFilter==='function')window.ingFilter()},
  prod:function(){if(typeof window.prodFilter==='function')window.prodFilter()},
  si:function(){if(typeof window.renderSITable==='function')window.renderSITable()},
  inv:function(el){if(typeof window._filterInvoices==='function'&&el)window._filterInvoices(el.value)}
};

window._safeSearch=function(el,type,delayMs){
  // 若正在 IME 注音/拼音輸入中,完全不觸發
  if(el&&el._imeComposing)return;
  
  var delay=delayMs||250;
  if(window._searchTimers[type])clearTimeout(window._searchTimers[type]);
  
  window._searchTimers[type]=setTimeout(function(){
    var handler=window._searchHandlers[type];
    if(handler)handler(el);
  },delay);
};

// IME 開始 (中文輸入法開始拼字)
window._imeStart=function(el){
  if(el)el._imeComposing=true;
};

// IME 結束 (使用者選完字或取消)
window._imeEnd=function(el,type){
  if(el)el._imeComposing=false;
  // 結束後立刻執行一次搜尋(不要等 debounce)
  if(type){
    if(window._searchTimers[type])clearTimeout(window._searchTimers[type]);
    var handler=window._searchHandlers[type];
    if(handler)setTimeout(function(){handler(el)},0);
  }
};

window.ingFilter=function(){
  var q=document.getElementById('ing-search-q')?.value||'';
  var cat=document.getElementById('ing-search-cat')?.value||'';
  var status=document.getElementById('ing-search-status')?.value||'all';
  state._ingSearch={q:q,cat:cat,status:status};
  renderPage();
  // 重新獲取焦點到搜尋框
  setTimeout(function(){var el=document.getElementById('ing-search-q');if(el&&q){el.focus();el.setSelectionRange(q.length,q.length)}},20);
};

window.ingFilterReset=function(){
  state._ingSearch={q:'',cat:'',status:'all'};
  renderPage();
};

ing:4px 6px;background:#fff;border-radius:4px"><input type="checkbox" name="fi-allergen" value="'+a+'"'+(checked?' checked':'')+'>'+a+'</label>'}).join('')}</div><div style="font-size:0.74rem;color:#9A6210;margin-top:6px">💡 依照「食品過敏原標示規定」設定,菜單會自動帶入過敏原警示</div></div><div style="background:#F0F9FF;border:1px solid #7dd3fc;border-radius:8px;padding:12px;margin-top:4px"><div style="font-size:0.85rem;font-weight:600;margin-bottom:8px;color:#0369a1">📋 ERP 進階資訊 (採購/庫存管控)</div><div class="form-row c4"><div class="fg"><label style="font-size:0.78rem">條碼/SKU</label><input id="fi-barcode" type="text" value="${esc(ing.barcode||'')}" placeholder="如 4710..."></div><div class="fg"><label style="font-size:0.78rem">品牌</label><input id="fi-brand" type="text" value="${esc(ing.brand||'')}" placeholder="如 義美"></div><div class="fg"><label style="font-size:0.78rem">規格</label><input id="fi-spec" type="text" value="${esc(ing.spec||'')}" placeholder="如 500g x 24"></div><div class="fg"><label style="font-size:0.78rem">儲存位置</label><input id="fi-location" type="text" value="${esc(ing.location||'')}" placeholder="如 冷藏A1"></div></div><div class="form-row c4" style="margin-top:8px"><div class="fg"><label style="font-size:0.78rem">最低訂購量(MOQ)</label><input id="fi-moq" type="number" min="0" step="1" value="${ing.minOrderQty||0}" placeholder="0"></div><div class="fg"><label style="font-size:0.78rem">前置時間(天)</label><input id="fi-leadtime" type="number" min="0" step="1" value="${ing.leadTime||0}" placeholder="0"></div><div class="fg"><label style="font-size:0.78rem">最高庫存量</label><input id="fi-maxstock" type="number" min="0" step="0.01" value="${ing.maxStock||0}" placeholder="0"></div><div class="fg"><label style="font-size:0.78rem">儲存溫度</label>${window.buildSearchSelect({id:'fi-storage',options:['冷藏(0~7°C)','冷凍(-18°C↓)','常溫','陰涼乾燥處','避光保存'],value:ing.storageTemp||'',placeholder:'選擇儲存條件...',sortField:'storageTemp'})}</div></div><div class="form-row c3" style="margin-top:8px"><div class="fg"><label style="f // 🆕 包裝層級 UI 操作函式
window.enablePackageLevels=function(){
  var unit=document.getElementById('fi-unit')?.value||'箱';
  // 預設給 2 層 (主單位 + 基本單位)
  window._editingPkgLevels=[
    {unit:'張',factor:1},
    {unit:unit,factor:100}
  ];
  renderPackageLevelsBox();
};

window.disablePackageLevels=function(){
  if(!confirm('停用包裝層級換算?\n\n設定會清空'))return;
  window._editingPkgLevels=null;
  renderPackageLevelsBox();
};

window.addPackageLevel=function(){
  if(!window._editingPkgLevels)window._editingPkgLevels=[{unit:'張',factor:1}];
  var maxFactor=Math.max.apply(Math,window._editingPkgLevels.map(function(l){return l.factor}));
  window._editingPkgLevels.push({unit:'',factor:maxFactor*10});
  renderPackageLevels();
};

window.removePackageLevel=function(idx){
  if(!window._editingPkgLevels)return;
  if(window._editingPkgLevels.length<=2){alert('至少要保留 2 層');return}
  window._editingPkgLevels.splice(idx,1);
  renderPackageLevels();
};

window.updatePackageLevel=function(idx,field,value){
  if(!window._editingPkgLevels)return;
  if(field==='factor')value=+value||1;
  window._editingPkgLevels[idx][field]=value;
  renderPackageLevels();
};

// 渲染包裝層級清單 (只重畫 list 部分,避免閃爍)
window.renderPackageLevels=function(){
  var listEl=document.getElementById('fi-pkg-levels-list');
  if(!listEl)return;
  
  var lvls=window._editingPkgLevels;
  if(!lvls||lvls.length===0){listEl.innerHTML='';return}
  
  var price=+document.getElementById('fi-price')?.value||0;
  var mainUnit=document.getElementById('fi-unit')?.value||'';
  var mainLvl=lvls.find(function(l){return l.unit===mainUnit})||lvls[lvls.length-1];
  var mainFactor=mainLvl?mainLvl.factor:1;
  
  // 排序由小到大 (factor)
  var sorted=lvls.slice().sort(function(a,b){return a.factor-b.factor});
  
  var html='<table style="width:100%;font-size:0.82rem"><thead><tr style="color:#9A6210"><th style="text-align:left;padding:4px">層級單位</th><th style="text-align:right;padding:4px">內含 (基本單位數)</th><th style="text-align:right;padding:4px">單價</th><th style="width:40px"></th></tr></thead><tbody>';
  
  sorted.forEach(function(l,i){
    var origIdx=lvls.indexOf(l);
    var unitPrice=mainFactor>0?price*(l.factor/mainFactor):0;
    var isMain=l.unit===mainUnit;
    var isBase=l.factor===1;
    html+='<tr style="border-bottom:1px solid #f5d8b7">'+
      '<td style="padding:4px"><input type="text" value="'+esc(l.unit)+'" '+(isBase?'placeholder="基本單位 如:張/個"':'')+' onchange="updatePackageLevel('+origIdx+',\'unit\',this.value)" style="width:90px;padding:2px 6px;font-size:0.78rem">'+(isMain?' <span style="background:#0A5A46;color:#fff;font-size:0.66rem;padding:1px 5px;border-radius:3px;margin-left:3px">主</span>':'')+(isBase?' <span style="background:#1455A0;color:#fff;font-size:0.66rem;padding:1px 5px;border-radius:3px;margin-left:3px">基本</span>':'')+'</td>'+
      '<td style="text-align:right;padding:4px"><input type="number" min="1" step="1" value="'+l.factor+'" '+(isBase?'disabled style="background:#eee;':'style="')+'width:80px;padding:2px 6px;font-size:0.78rem;text-align:right" onchange="updatePackageLevel('+origIdx+',\'factor\',this.value)"></td>'+
      '<td style="text-align:right;padding:4px;color:#0A5A46;font-weight:700">'+CUR()+unitPrice.toFixed(unitPrice<1?3:0)+'</td>'+
      '<td style="text-align:center"><button type="button" class="btn btn-sm btn-danger" onclick="removePackageLevel('+origIdx+')" style="padding:1px 6px;font-size:0.7rem">×</button></td>'+
      '</tr>';
  });
  
  html+='</tbody></table>';
  html+='<div style="font-size:0.72rem;color:#9A6210;margin-top:4px">💡 主單位 = 採購單位,基本單位 (factor=1) = 配方最常用的最小單位</div>';
  
  listEl.innerHTML=html;
};

  if(!lvls||lvls.length===0){
    box.style.background='#F0F9FF';

  }else{

// 進價對照工具:依單位類別自動顯示對應換算 (升級版,支援所有單位)
window.updatePriceConv=function(){
  var unitEl=$('fi-unit'),priceEl=$('fi-price'),convEl=$('fi-price-conv');
  if(!unitEl||!priceEl||!convEl)return;
  var unit=unitEl.value,price=+priceEl.value||0;
  if(price<=0){convEl.innerHTML='';return}
  var u=window.UNIT_DB?window.UNIT_DB[unit]:null;
  if(!u||u.type==='count'){convEl.innerHTML='';return}
  
  if(u.type==='weight'){
    // 以「每公斤」為基準,加上「每台斤、每磅」做對照
    var perKg=price/u.toG*1000;
    var perJin=price/u.toG*600;
    var perLb=price/u.toG*453.59237;
    var lines=[];
    if(unit!=='公斤'&&unit!=='kg')lines.push('<b style="color:#0A5A46">'+perKg.toFixed(2)+' 元/公斤</b>');
    if(unit!=='台斤'&&unit!=='斤')lines.push(perJin.toFixed(2)+' 元/台斤');
    if(unit!=='磅'&&unit!=='lb')lines.push(perLb.toFixed(2)+' 元/磅');
    convEl.innerHTML='💡 換算: '+lines.slice(0,2).join(' ｜ ');
    convEl.style.color='#444';
  }else if(u.type==='volume'){
    var perL=price/u.toMl*1000;
    var perGal=price/u.toMl*3785.41;
    var lines=[];
    if(unit!=='公升'&&unit!=='L')lines.push('<b style="color:#0A5A46">'+perL.toFixed(2)+' 元/公升</b>');
    if(unit!=='加侖')lines.push(perGal.toFixed(2)+' 元/加侖');
    convEl.innerHTML='💡 換算: '+lines.slice(0,2).join(' ｜ ');
    convEl.style.color='#444';
  }
};

// 🆕 包裝採購試算 (買 1 包 2公斤 NT$440 → 自動算 NT$220/公斤)
window.updatePkgPrice=function(){
  var count=+$('fi-pkg-count')?.value||0;
  var content=+$('fi-pkg-content')?.value||0;
  var pkgUnit=$('fi-pkg-unit')?.value||'';
  var total=+$('fi-pkg-total')?.value||0;
  var unit=$('fi-unit')?.value||'';  // 食材主單位
  // 🆕 含稅/未稅切換
  var inclEl=document.querySelector('input[name="fi-pkg-incl"]:checked');
  var isIncl=inclEl?inclEl.value==='incl':false;
  var taxRate=+$('fi-pkg-tax-rate')?.value||0;
  var resultEl=$('fi-pkg-result');
  if(!resultEl)return;
  
  if(!count||!content||!total){
    resultEl.innerHTML='💡 填入上方數值,自動計算「未稅進價/單位」';
    resultEl.style.color='#999';
    return;
  }
  
  // 🆕 計算未稅總價
  var totalNet=isIncl?total/(1+taxRate):total;
  var totalGross=isIncl?total:total*(1+taxRate);
  var taxAmt=totalGross-totalNet;
  
  var totalContent=count*content;  // 總內容量
  var pricePerPkgUnitNet=totalNet/totalContent;  // 未稅單價
  
  // 如果食材主單位 ≠ 包裝單位 → 還要換算
  var pricePerMainUnitNet=pricePerPkgUnitNet;
  var convNote='';
  if(unit&&unit!==pkgUnit&&typeof window.convertUnit==='function'){
    var mainToPkg=window.convertUnit(1,unit,pkgUnit);
    if(mainToPkg!=null&&mainToPkg!==1){
      pricePerMainUnitNet=pricePerPkgUnitNet*mainToPkg;
      convNote=' (1 '+unit+' = '+mainToPkg.toFixed(3)+' '+pkgUnit+')';
    }
  }
  
  var html='✅ 計算結果:<br>';
  html+='&nbsp;&nbsp;&nbsp;&nbsp;<b style="color:#9A6210">輸入: '+(isIncl?'含稅':'未稅')+' NT$'+total.toFixed(2)+' (稅率 '+(taxRate*100)+'%)</b><br>';
  if(taxRate>0){
    html+='&nbsp;&nbsp;&nbsp;&nbsp;<span style="color:#666">→ 拆出: 未稅 NT$'+totalNet.toFixed(2)+' + 稅 NT$'+taxAmt.toFixed(2)+' = 含稅 NT$'+totalGross.toFixed(2)+'</span><br>';
  }
  html+='&nbsp;&nbsp;&nbsp;&nbsp;<b style="color:#0A5A46">每 '+pkgUnit+' (未稅) = NT$ '+pricePerPkgUnitNet.toFixed(2)+'</b><br>';
  if(unit&&unit!==pkgUnit){
    html+='&nbsp;&nbsp;&nbsp;&nbsp;<b style="color:#B82525">每 '+unit+' (未稅) = NT$ '+pricePerMainUnitNet.toFixed(2)+'</b>'+convNote+'<br>';
  }
  html+='&nbsp;&nbsp;&nbsp;&nbsp;<span style="color:#666">總購買量: '+totalContent+' '+pkgUnit+'</span>';
  resultEl.innerHTML=html;
  resultEl.style.color='#0A5A46';
};

window.applyPkgPrice=function(){

  // 🆕 計算未稅總價

window.updateYieldPreview=function(){
  var yieldEl=$('fi-yield'),priceEl=$('fi-price'),unitEl=$('fi-unit');
  var realEl=$('fi-real-cost'),lossEl=$('fi-yield-loss');
  if(!yieldEl||!priceEl||!realEl)return;
  var yp=+yieldEl.value;
  if(yp<1||yp>100||isNaN(yp)){realEl.value='—';if(lossEl)lossEl.value='—';return}
  var rate=yp/100;
  var price=+priceEl.value||0;
  var unit=unitEl?unitEl.value:'公斤';
  if(price<=0){realEl.value='—';if(lossEl)lossEl.value='—';return}
  var realCost=price/rate;
  realEl.value=CUR()+realCost.toFixed(2)+'/'+unit;
  if(lossEl){
    var lossQty=(1-rate);
    lossEl.value=lossQty>0?'損耗 '+(lossQty*100).toFixed(0)+'%/單位 ('+CUR()+(price*lossQty).toFixed(2)+')':'無';
  }
  // 顏色提示
  if(rate<0.7)realEl.style.color='#B82525';
  else if(rate<0.9)realEl.style.color='#9A6210';
  else realEl.style.color='#0A5A46';
};

// 🆕 從叫貨單匯入包材到食材庫
// 從 SHEETS 變數中找包材類叫貨單,自動建立食材
// ══════════════════════════════════════════════════════
window.importPackagingFromSheets=function(){
  // 找包材類叫貨單 (id 含 'pack' 或 title 含「包材」)
  var packSheets=(typeof SHEETS!=='undefined'?SHEETS:[]).filter(function(s){
    return s.id.indexOf('pack')>=0||(s.title||'').indexOf('包材')>=0;
  });
  
  if(packSheets.length===0){
    alert('找不到包材類叫貨單');
    return;
  }
  
  // 收集所有包材項目 (去重)
  var allItems=[];
  var seenNames={};
  packSheets.forEach(function(sheet){
    (sheet.items||[]).forEach(function(item){
      if(seenNames[item.name])return;  // 去重
      seenNames[item.name]=true;
      allItems.push({
        sheet:sheet.title,
        name:item.name,
        unit:item.unit,
        price:item.price
      });
    });
  });
  
  // 檢查食材庫已有哪些
  var existing=new Set((state.ings||[]).map(function(i){return i.name}));
  var newItems=allItems.filter(function(i){return !existing.has(i.name)});
  var dupItems=allItems.filter(function(i){return existing.has(i.name)});
  
  if(newItems.length===0){
    alert('所有 '+allItems.length+' 項包材都已存在於食材庫,無需匯入');
    return;
  }
  
  // 預覽 modal
  var rows=newItems.map(function(it,idx){
    return '<tr><td><input type="checkbox" class="pkg-chk" value="'+idx+'" checked></td><td style="text-align:center;color:#706E68">'+(idx+1)+'</td><td style="font-weight:600">'+esc(it.name)+'</td><td>'+esc(it.unit)+'</td><td style="text-align:right">'+CUR()+it.price+'</td><td style="font-size:0.78rem;color:#999">'+esc(it.sheet)+'</td></tr>';
  }).join('');
  
  // 找包材類供應商 (沒有就用第一個)
  var packSup=(state.sups||[]).find(function(s){return (s.types||[]).indexOf('包材')>=0||(s.name||'').indexOf('包材')>=0});
  var defSupId=packSup?packSup.id:(state.sups[0]?state.sups[0].id:'S001');
  
  // 暫存到 window 供 confirm 取用
  window._pendingPackImport=newItems;
  window._pendingPackSupId=defSupId;
  
  modal(mH('📦 匯入包材到食材庫')+
    '<div style="background:#FFF8ED;border:1px solid #f5c98a;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:0.86rem;color:#9A6210;line-height:1.6">📊 從叫貨單偵測到 <b>'+allItems.length+'</b> 項包材<br>✅ 可新增: <b>'+newItems.length+'</b> 項<br>'+(dupItems.length>0?'⏭️ 已存在(略過): <b>'+dupItems.length+'</b> 項<br>':'')+'💡 預設類別「包材」｜ 預設供應商: <b>'+esc(packSup?packSup.name:(state.sups[0]?state.sups[0].name:'未設定'))+'</b><br>💡 可取消勾選不要的項目</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn btn-sm btn-outline" onclick="document.querySelectorAll(\'.pkg-chk\').forEach(function(c){c.checked=true})">全選</button><button class="btn btn-sm btn-outline" onclick="document.querySelectorAll(\'.pkg-chk\').forEach(function(c){c.checked=false})">取消全選</button></div>'+
    '<div style="overflow-x:auto;max-height:50vh;overflow-y:auto;border:1px solid #e0e0e0;border-radius:6px"><table class="tbl"><thead><tr><th></th><th>序</th><th>包材名稱</th><th>單位</th><th>進價</th><th>來源</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="executePackagingImport()">📥 確認匯入已勾選</button></div>',
  true);
};

window.importMissingIngs=function(){
  if(typeof window.analyzeMissingIngs!=='function'){
    alert('缺料分析功能未載入');
    return;
  }
  var missing=window.analyzeMissingIngs();
  if(missing.length===0){
    alert('✅ 所有配方食材都已登錄,無缺料');
    return;
  }
  
  // 重要性分級
  var rows=missing.map(function(m,idx){
    var importance=m.count>=10?'🔥 高':m.count>=5?'⚠️ 中':'• 低';
    var importanceColor=m.count>=10?'#B82525':m.count>=5?'#9A6210':'#0A5A46';
    // 智慧推測類別 (從名稱判斷)
    var guessCat='其他';
    var name=m.name||'';
    if(/包材|袋|杯|盒|盤|碗|蓋|貼紙|標籤/.test(name))guessCat='包材';
    else if(/鹽|糖|醬|油|醋|酒|味|粉|椒|香|蒜|桂|椿/.test(name))guessCat='調味料';
    else if(/雞|豬|牛|羊|肉|腿|胸|排/.test(name))guessCat='肉類';
    else if(/魚|蝦|蟹|貝|蛤|花枝/.test(name))guessCat='海鮮';
    else if(/菜|蔬|蕃茄|番茄|蘿蔔|洋蔥|高麗菜/.test(name))guessCat='蔬菜';
    else if(/奶|乳|起司|優格|酪/.test(name))guessCat='乳製品';
    else if(/蛋/.test(name))guessCat='蛋類';

window.getPackagingItems=function(){
  // 1. 食材庫中 cat='包材' 的
  var fromIngs=(state.ings||[]).filter(function(i){return i.cat==='包材'});
  
  // 2. 🆕 轉售品項中「名稱含包材關鍵字」的 (Tim 把真空袋放在轉售品項)
  var packKeywords=['袋','盒','箱','瓶','罐','標籤','貼紙','紙箱','包裝','膜','蓋','杯','吸管','餐具','蓋子','封口','膠帶','打包'];
  var fromInternal=(state.internalProducts||[]).filter(function(p){
    var n=p.name||'';
    return packKeywords.some(function(k){return n.indexOf(k)>=0});
  }).map(function(p){
    return {
      id:'IP_'+(p.id||p.name),
      name:p.name,
      unit:p.unit||'個',
      price:+p.cost||+p.sellPrice||0,
      cat:'包材',
      _fromInternal:true
    };
  });
  
  // 3. 合併去重 (食材庫優先,同名不重複加)
  var seen={};
  var result=[];
  fromIngs.forEach(function(p){seen[p.name]=true;result.push(p)});
  fromInternal.forEach(function(p){if(!seen[p.name])result.push(p)});
  
  return result;
};

// 建立配方 modal 的「包材組合」區塊 HTML
// 🆕 智慧解析包裝名稱 (依「主單位」推算內含層級)
// 例: 名稱「真空袋200*300mm100張/20包/箱」
//   - 主單位「包」→ 1 包 = 100 張 (只算「包」之前的層級)
//   - 主單位「箱」→ 1 箱 = 100×20 = 2000 張 (「箱」之前的所有層級)
//   - 主單位「個」(無此單位在名稱中) → 不自動填 (避免猜錯)
window.parsePackageName=function(name,unit){
  if(!name||!unit)return null;
  
  // 把名稱按「/」切割成層級
  var parts=name.split('/');
  
  // 找主單位在哪一層 (層級從 0 開始)
  var unitIdx=-1;
  for(var i=0;i<parts.length;i++){
    if(parts[i].indexOf(unit)>=0){unitIdx=i;break;}
  }
  
  // 主單位不在名稱中 → 不亂猜
  if(unitIdx<0)return null;
  // 主單位在第一層 → 它本身就是基本單位,沒子單位
  if(unitIdx===0)return null;
  
  // 「主單位之前」的所有層級相乘
  var subUnit=null;
  var totalInner=1;
  var subUnitChars=['張','片','入','顆','粒','只','支','條','根','塊'];
  var subUnitRe=/(\d+)\s*([張片入顆粒只支條根塊])/g;
  
  for(var j=0;j<unitIdx;j++){
    var p=parts[j];
    // 優先抓「數字+子單位」配對 (例:100張)
    var ms=p.match(subUnitRe);
    if(ms&&ms.length>0){
      var lastM=ms[ms.length-1].match(/(\d+)\s*([張片入顆粒只支條根塊])/);
      if(lastM){
        totalInner*=+lastM[1];
        if(!subUnit)subUnit=lastM[2];
      }
    }else{
      // 沒子單位 → 抓純數字 (例:「20包」抓 20)
      var nm=p.match(/(\d+)/);
      if(nm)totalInner*=+nm[1];
    }
  }
  
  if(totalInner<=1)return null;
  return {innerQty:totalInner,innerUnit:subUnit||'張'};
};

// 🍳 餐點靈感工坊 v1.0
// 三大子功能:
//   1. 🎲 智能推薦 (從選取食材推薦相似配方)
//   2. 🔍 反向搜尋 (從食材找用到的配方)

// 計算配方與「選取食材集合」的相似度 (Jaccard)
window.calcRecipeSimilarity=function(recipe,selectedIngs){
  if(!recipe.ings||recipe.ings.length===0)return 0;
  var recipeIngs=new Set((recipe.ings||[]).filter(function(i){
    // 排除包材,只看食材
    var inv=(state.ings||[]).find(function(x){return x.name===i.name});
    return !inv||inv.cat!=='包材';
  }).map(function(i){return i.name}));
  var selectedSet=new Set(selectedIngs);
  var intersection=0;
  selectedSet.forEach(function(n){if(recipeIngs.has(n))intersection++});
  var union=recipeIngs.size+selectedSet.size-intersection;
  return union>0?intersection/union:0;
};

// 找用到某食材的所有配方
window.findRecipesUsingIng=function(ingName){
  var results=[];
  (state.recipes||[]).forEach(function(r){
    var ing=(r.ings||[]).find(function(i){return i.name===ingName});
    if(ing){
      var rc=calcCost(r);
      results.push({
        recipe:r,
        ing:ing,
        cost:rc.per,
        total:rc.total,
        missingCount:rc.missingCount
      });
    }
  });
  return results.sort(function(a,b){return a.cost-b.cost});  // 成本低的優先
};

// 找閒置食材 (不在任何配方/菜單中)
window.findIdleIngs=function(){
  var usedNames=new Set();
  (state.recipes||[]).forEach(function(r){
    (r.ings||[]).forEach(function(i){usedNames.add(i.name)});
  });
  (state.menu||[]).forEach(function(m){(m.components||[]).forEach(function(c){if(c.sourceType==='ing'&&c.name)usedNames.add(c.name)});if(m.ing1)usedNames.add(m.ing1)});
  return (state.ings||[]).filter(function(i){
    return !usedNames.has(i.name)&&i.cat!=='包材';
  });
};

// 食材組合熱度分析 (找常一起用的食材對)
window.findIngCombos=function(){
  var combos={};  // "A+B": count
  (state.recipes||[]).forEach(function(r){
    var ings=(r.ings||[]).filter(function(i){
      var inv=(state.ings||[]).find(function(x){return x.name===i.name});
      return !inv||inv.cat!=='包材';
    }).map(function(i){return i.name});
    // 兩兩配對
    for(var i=0;i<ings.length;i++){
      for(var j=i+1;j<ings.length;j++){
        var pair=[ings[i],ings[j]].sort().join(' + ');
        combos[pair]=(combos[pair]||0)+1;
      }
    }
  });
  return Object.entries(combos)
    .filter(function(e){return e[1]>=2})  // 至少出現 2 次
    .sort(function(a,b){return b[1]-a[1]})
    .slice(0,30);
};

// 📊 包材階段 3 — 包材使用報表 + ABC 分析
// ══════════════════════════════════════════════════════
window.showPackagingReport=function(){
  var packs=window.getPackagingItems();
  if(packs.length===0){
    alert('食材庫尚無「包材」類別食材,請先匯入');
    return;
  }
  
  // 計算每個包材的使用統計
  var stats=packs.map(function(p){
    var usage=[];  // 哪些配方用、總用量、總金額
    var totalQty=0;
    (state.recipes||[]).forEach(function(r){
      var ing=(r.ings||[]).find(function(i){return i.name===p.name});
      if(ing){
        var qty=(ing.qty||0)*(r.multiplier||1);
        var cost=calcIngCost(p,(ing.qty||0)*(r.multiplier||1),ing.unit);
        usage.push({recipe:r,qty:qty,cost:cost});
        totalQty+=qty;
      }
    });
    return {
      pack:p,
      usage:usage,
      recipeCount:usage.length,
      totalQty:totalQty,
      totalValue:totalQty*(p.price||0)
    };
  }).sort(function(a,b){return b.totalValue-a.totalValue});
  
  // ABC 分類:累計 80% = A, 80~95% = B, 95~100% = C
  var totalValueAll=stats.reduce(function(s,x){return s+x.totalValue},0);
  var cumulative=0;
  stats.forEach(function(s){
    cumulative+=s.totalValue;
    var pct=totalValueAll>0?(cumulative/totalValueAll):0;
    s.abc=pct<=0.8?'A':pct<=0.95?'B':'C';
  });
  
  var unused=stats.filter(function(s){return s.recipeCount===0});
  var rows=stats.map(function(s,idx){
    var abcColor=s.abc==='A'?'#B82525':s.abc==='B'?'#9A6210':'#999';
    var usageList=s.usage.slice(0,3).map(function(u){return u.recipe.code}).join(', ')+(s.usage.length>3?' +'+(s.usage.length-3):'');
    var statusBadge=s.recipeCount===0?'<span style="background:#FCE8E8;color:#B82525;padding:2px 6px;border-radius:4px;font-size:0.72rem">😴 閒置</span>':'';
    return '<tr><td style="text-align:center;color:#706E68">'+(idx+1)+'</td><td><span style="background:'+abcColor+';color:#fff;padding:2px 8px;border-radius:4px;font-weight:700;font-size:0.78rem">'+s.abc+'</span></td><td style="font-weight:600">'+esc(s.pack.name)+' '+statusBadge+'</td><td style="text-align:right">'+CUR()+(s.pack.price||0)+'/'+esc(s.pack.unit)+'</td><td style="text-align:center"><b>'+s.recipeCount+'</b> 個</td><td style="text-align:right">'+fmt(s.totalQty,1)+' '+esc(s.pack.unit)+'</td><td style="text-align:right;color:#0A5A46;font-weight:700">'+CUR()+fmt(s.totalValue,0)+'</td><td style="font-size:0.78rem;color:#706E68">'+usageList+'</td></tr>';
  }).join('');
  
  var aCount=stats.filter(function(s){return s.abc==='A'}).length;
  var bCount=stats.filter(function(s){return s.abc==='B'}).length;
  var cCount=stats.filter(function(s){return s.abc==='C'}).length;
  
  modal(mH('📊 包材使用報表 + ABC 分析')+
    '<div style="background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="text-align:center"><div style="font-size:0.78rem;color:#666">包材總數</div><div style="font-size:1.4rem;font-weight:700;color:#0A5A46">'+packs.length+'</div></div><div style="text-align:center;border-left:1px solid #eee"><div style="font-size:0.78rem;color:#666">A 級 (關鍵 80%)</div><div style="font-size:1.4rem;font-weight:700;color:#B82525">'+aCount+'</div></div><div style="text-align:center;border-left:1px solid #eee"><div style="font-size:0.78rem;color:#666">B+C 級 (次要)</div><div style="font-size:1.4rem;font-weight:700;color:#9A6210">'+(bCount+cCount)+'</div></div><div style="text-align:center;border-left:1px solid #eee"><div style="font-size:0.78rem;color:#666">閒置包材</div><div style="font-size:1.4rem;font-weight:700;color:#999">'+unused.length+'</div></div></div>'+
    '<div style="background:#FCEFE5;border:1px solid #E8C098;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:0.82rem;color:#9A6210;line-height:1.6">💡 ABC 分析:依「使用價值」排序,A 級 (前 80% 金額) 是關鍵包材,缺貨會立即影響營運;B 級 (80~95%) 次要;C 級 (95~100%) 可酌情管理</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn btn-sm btn-outline" onclick="exportPackagingReportCSV()">📤 匯出 CSV</button></div>'+
    '<div style="overflow-x:auto;max-height:55vh;overflow-y:auto;border:1px solid #e0e0e0;border-radius:6px"><table class="tbl"><thead><tr><th>序</th><th>ABC</th><th>包材名稱</th><th>進價</th><th>使用配方數</th><th>總用量</th><th>總價值</th><th>用於</th></tr></thead><tbody>'+rows+'</tbody></table></div>',
  true);
  
  window._packReportData=stats;
};

window.exportPackagingReportCSV=function(){
  var stats=window._packReportData||[];
  if(stats.length===0)return;
  var csv='\uFEFF'+'序號,ABC,包材名稱,進價,單位,使用配方數,總用量,總價值,用於配方\n';
  stats.forEach(function(s,idx){
    var recipes=s.usage.map(function(u){return u.recipe.code+' '+u.recipe.name}).join('; ');
    csv+=(idx+1)+',"'+s.abc+'","'+s.pack.name+'",'+(s.pack.price||0)+',"'+s.pack.unit+'",'+s.recipeCount+','+s.totalQty.toFixed(1)+','+s.totalValue.toFixed(0)+',"'+recipes+'"\n';
  });
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='包材使用報表_'+toDay()+'.csv';a.click();
  URL.revokeObjectURL(url);
  toast('✅ 包材報表已匯出');
};

// 🔄 生管 → 財會橋接
// 進貨時 (saveBuy / receivePO) 自動推送到財會「流水帳」
// 用 Firebase 跨系統同步
// ══════════════════════════════════════════════════════
window.pushBuyToFinance=function(buyRec){
  // 把 buyLog 一筆紀錄轉成「流水帳」格式
  var im=imap();
  var inv=im[buyRec.itemName];
  var category='食材';
  if(inv&&inv.cat==='包材')category='包材';
  else if(inv&&inv.cat==='飲品材料')category='飲品';
  
  // 推測門市 (預設總公司/中央廚房)
  var store='總公司';
  
  var ledgerEntry={
    id:'lg'+Date.now(),
    date:buyRec.date||toDay(),
    store:store,
    category:'進貨支出 - '+category,
    item:buyRec.itemName,
    qty:buyRec.qty||0,
    unit:buyRec.unit||'',
    unitPrice:buyRec.unitPrice||0,
    amount:-(buyRec.totalAmt||0),  // 支出為負
    source:'erp_buyLog',
    sourceId:buyRec.id,
    note:'從生管系統自動推送',
    createdAt:new Date().toISOString()
  };
  
  // 寫到 Firebase 跨系統共用路徑
  if(typeof firebase!=='undefined'&&firebase.firestore){
    try{
      var db=firebase.firestore();
      db.collection('prod_finance').doc('ledger').get().then(function(doc){
        var data=doc.exists?doc.data().entries||[]:[];
        // 避免重複 (同 sourceId 不再寫)
        if(data.find(function(e){return e.sourceId===buyRec.id}))return;
        data.push(ledgerEntry);
        db.collection('prod_finance').doc('ledger').set({entries:data}).then(function(){
          console.log('[ERP→財會] 已推送進貨',buyRec.itemName);
        }).catch(function(e){
          console.warn('[ERP→財會] 推送失敗',e.message);
        });
      }).catch(function(e){
        console.warn('[ERP→財會] 連線失敗',e.message);
      });
    }catch(e){
      console.warn('[ERP→財會] Firebase 不可用',e.message);
    }
  }
  // 也存本地暫存 (即使沒 Firebase 也有紀錄)
  try{
    var local=JSON.parse(localStorage.getItem('hm_pending_finance')||'[]');
    local.push(ledgerEntry);
    if(local.length>500)local=local.slice(-500);  // 上限
    localStorage.setItem('hm_pending_finance',JSON.stringify(local));
  }catch(e){}
};

    store:store,
    category:category,
    item:wasteRec.name||'',

    createdAt:new Date().toISOString()
  };
  
  // 寫到 Firebase 跨系統共用路徑
  if(typeof firebase!=='undefined'&&firebase.firestore){

        var data=doc.exists?doc.data().entries||[]:[];

        data.push(ledgerEntry);

          console.log('[ERP→財會] 已推送損耗',wasteRec.name);

          console.warn('[ERP→財會] 推送失敗',e.message);

      });

    }
  }

  try{
    var local=JSON.parse(localStorage.getItem('hm_pending_finance')||'[]');
    local.push(ledgerEntry);
    if(local.length>500)local=local.slice(-500);
    localStorage.setItem('hm_pending_finance',JSON.stringify(local));
  }catch(e){}

// ══════════════════════════════════════════════════════
// 🆕 計算歷史平均損耗率 (給配方/食材參考)
// 過去 90 天內某食材的損耗 ÷ 進貨
// ══════════════════════════════════════════════════════
window.calcHistoricalLossRate=function(ingName){
  if(!ingName)return 0;
  var now=new Date();
  var cutoff=new Date(now.getTime()-90*24*60*60*1000);
  var cutoffStr=cutoff.toISOString().substring(0,10);
  
  // 過去 90 天的進貨總量 (公克單位)
  var totalBuyG=0;
  (state.buyLog||[]).forEach(function(b){
    if(b.ingName!==ingName||b.date<cutoffStr)return;
    var inv=(state.ings||[]).find(function(x){return x.name===ingName});
    if(!inv)return;
    var g=unitToG(b.qty||0,b.unit||inv.unit);
    if(!isNaN(g))totalBuyG+=g;
  });
  
  // 過去 90 天的損耗總量
  var totalLossG=0;
  (state.waste||[]).forEach(function(w){
    if(w.name!==ingName||w.date<cutoffStr)return;
    var g=unitToG(w.lossQty||0,w.unit||'');
    if(!isNaN(g))totalLossG+=g;
  });
  
  if(totalBuyG<=0)return 0;
  var rate=totalLossG/totalBuyG;
  // 上限 50% 防止極端值
  return Math.min(rate,0.5);
};

// 計算本月損耗統計 (儀表板用)
window.calcMonthlyWasteStats=function(){
  var now=new Date();
  var monthStart=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01';
  
  var stats={total:0,normal:0,abnormal:0,staff:0,vendor_return:0,count:0,buyTotal:0,wasteRate:0};
  
  (state.waste||[]).forEach(function(w){
    if(w.date<monthStart)return;
    var amt=+w.costAmt||0;
    stats.total+=amt;
    stats.count++;
    if(w.type)stats[w.type]=(stats[w.type]||0)+amt;
  });
  
  // 算進貨總額作分母
  (state.buyLog||[]).forEach(function(b){
    if(b.date<monthStart)return;
    stats.buyTotal+=+b.total||0;
  });
  
  if(stats.buyTotal>0)stats.wasteRate=stats.total/stats.buyTotal;
  return stats;
};

// 🆕 菜品成本計算引擎:每個成分依類型查單價,套損耗率
window.calcMenuItemCost=function(menuItem){
  if(!menuItem||!menuItem.components||!menuItem.components.length)return 0;
  var total=0;
  menuItem.components.forEach(function(c){
    if(!c||!c.qty)return;
    var unitCost=0;
    if(c.sourceType==='recipe'){
      // 自製配方:取 perFull (每包成本,含人事水電) 或 per (純食材)
      var rec=(state.recipes||[]).find(function(r){return r.id===c.sourceId||r.name===c.name});
      if(rec){var rc=calcCost(rec);unitCost=rc.perFull||rc.per||0}
      // 配方單位通常是「包」,如果用 g/份 等,要視為「全包成本」攤分
    }else if(c.sourceType==='ing'){
      var inv=(state.ings||[]).find(function(x){return x.id===c.sourceId||x.name===c.name});
      if(inv)unitCost=calcIngCost(inv,c.qty,c.unit||inv.unit,{skipYield:true})/Math.max(1,c.qty);  // 取每單位成本 (skipYield 避免重複可食率)
      // 上面除以 qty 抽出單位成本,等下會再乘 qty,但這做法繞;簡化:直接 calcIngCost 算總成本
      var totalIng=inv?calcIngCost(inv,c.qty,c.unit||inv.unit,{skipYield:true}):0;
      // 套損耗率: 總成本 / (1-lossRate)
      var lr=+c.lossRate||0;if(lr<0)lr=0;if(lr>=1)lr=0.99;
      total+=totalIng/(1-lr);
      return;  // 食材已直接加,跳過後面
    }else if(c.sourceType==='internal'){
      var ip=(state.internalProducts||[]).find(function(x){return x.id===c.sourceId||x.name===c.name});
      if(ip)unitCost=+ip.cost||0;
    }
    var lr=+c.lossRate||0;if(lr<0)lr=0;if(lr>=1)lr=0.99;
    var raw=unitCost*(+c.qty||0);
    total+=raw/(1-lr);
  });
  return total;
};

    components:window._editMn.components||[],
    status:'active'
  };
  if(!state.menu)state.menu=[];
  if(eid)state.menu=state.menu.map(function(x){return x.id===eid?obj:x});
  else state.menu.push(obj);
  window._lastEditMenuId=obj.id;
  addAudit(eid?'編輯菜品':'新增菜品',name+' ('+obj.storeId+'/'+obj.version+')');
  saveState();closeModal();renderPage();
  if(window._scrollToEdited)window._scrollToEdited('menu-row-',obj.id);
  toast('✅ '+name+' 已儲存');
};

window.delMenu=function(id){
  if(!confirm('確定刪除此菜品？'))return;
  state.menu=(state.menu||[]).filter(function(m){return m.id!==id});
  addAudit('刪除菜品',id);
  saveState();renderPage();

};

// 🆕 菜單版本管理 ─────────────────────────────────
// 取得門市的所有版本 (含 archived)
window.getMenuVersions=function(storeId,includeArchived){
  var vers={};
  (state.menu||[]).forEach(function(m){
    if(m.storeId!==storeId)return;
    if(!includeArchived&&m.status==='archived')return;
    var v=m.version||'v1';
    if(!vers[v])vers[v]={version:v,count:0,active:0,archived:0};
    vers[v].count++;
    if(m.status==='archived')vers[v].archived++;else vers[v].active++;
  });
  return Object.values(vers).sort(function(a,b){return a.version.localeCompare(b.version)});
};

// 新建版本 (從現有版本複製所有菜品)
window.createMenuVersion=function(storeId,fromVersion,toVersion){
  if(!storeId||!toVersion){alert('參數錯誤');return false}
  // 檢查目標版本是否已存在
  var existing=(state.menu||[]).some(function(m){return m.storeId===storeId&&(m.version||'v1')===toVersion});
  if(existing){alert('版本「'+toVersion+'」已存在,請換個版本號');return false}
  // 複製來源版本所有 active 菜品
  var source=(state.menu||[]).filter(function(m){return m.storeId===storeId&&(m.version||'v1')===fromVersion&&m.status!=='archived'});
  if(!source.length){alert('來源版本「'+fromVersion+'」無菜品可複製');return false}
  var copies=source.map(function(m){return Object.assign({},JSON.parse(JSON.stringify(m)),{id:'M'+Date.now()+'_'+Math.random().toString(36).slice(2,6),version:toVersion,status:'active'})});
  state.menu=state.menu.concat(copies);
  addAudit('新建菜單版本',storeId+' '+fromVersion+'→'+toVersion+' ('+copies.length+'項)');
  saveState();
  toast('✅ 已建立版本 '+toVersion+' (複製 '+copies.length+' 項菜品)');
  return true;
};

// 封存版本 (該版本所有菜品 status='archived')
window.archiveMenuVersion=function(storeId,version){
  var items=(state.menu||[]).filter(function(m){return m.storeId===storeId&&(m.version||'v1')===version&&m.status!=='archived'});
  if(!items.length){alert('此版本無作用中菜品');return}
  if(!confirm('確定封存「'+(state.stores.find(function(s){return s.id===storeId})||{}).name+'」的版本 '+version+'？\n\n將封存 '+items.length+' 項菜品 (不會刪除,日後可還原)'))return;
  items.forEach(function(m){m.status='archived'});
  addAudit('封存菜單版本',storeId+' '+version+' ('+items.length+'項)');
  saveState();renderPage();
  toast('✅ 版本 '+version+' 已封存');
};

// 還原封存版本
window.restoreMenuVersion=function(storeId,version){
  var items=(state.menu||[]).filter(function(m){return m.storeId===storeId&&(m.version||'v1')===version&&m.status==='archived'});
  if(!items.length){alert('無封存菜品可還原');return}
  items.forEach(function(m){m.status='active'});
  addAudit('還原菜單版本',storeId+' '+version+' ('+items.length+'項)');
  saveState();renderPage();
  toast('✅ 版本 '+version+' 已還原');
};

// 跨門市複製
window.copyMenuToStore=function(fromStoreId,fromVersion,toStoreId,toVersion){
  if(fromStoreId===toStoreId&&fromVersion===toVersion){alert('來源與目標相同');return false}
  var existing=(state.menu||[]).some(function(m){return m.storeId===toStoreId&&(m.version||'v1')===toVersion});
  if(existing){if(!confirm('目標「'+toStoreId+' '+toVersion+'」已有菜品,複製過去會新增(不覆蓋)。繼續?'))return false}
  var source=(state.menu||[]).filter(function(m){return m.storeId===fromStoreId&&(m.version||'v1')===fromVersion&&m.status!=='archived'});
  if(!source.length){alert('來源無菜品');return false}
  var copies=source.map(function(m){return Object.assign({},JSON.parse(JSON.stringify(m)),{id:'M'+Date.now()+'_'+Math.random().toString(36).slice(2,6),storeId:toStoreId,version:toVersion,status:'active'})});
  state.menu=state.menu.concat(copies);
  addAudit('跨門市複製菜單',fromStoreId+'/'+fromVersion+' → '+toStoreId+'/'+toVersion+' ('+copies.length+'項)');
  saveState();
  toast('✅ 已複製 '+copies.length+' 項菜品到 '+toStoreId+' '+toVersion);
  return true;
};

// 比較兩版本差異
window.compareMenuVersions=function(storeId,verA,verB){
  var listA=(state.menu||[]).filter(function(m){return m.storeId===storeId&&(m.version||'v1')===verA&&m.status!=='archived'});
  var listB=(state.menu||[]).filter(function(m){return m.storeId===storeId&&(m.version||'v1')===verB&&m.status!=='archived'});
  var mapB={};listB.forEach(function(m){mapB[m.name]=m});
  var mapA={};listA.forEach(function(m){mapA[m.name]=m});
  var added=[],removed=[],priceChanged=[],compChanged=[];
  listA.forEach(function(a){
    var b=mapB[a.name];
    if(!b){removed.push(a)}
    else{
      if((a.price||0)!==(b.price||0))priceChanged.push({name:a.name,fromPrice:a.price,toPrice:b.price});
      var aComp=JSON.stringify((a.components||[]).map(function(c){return c.name+':'+c.qty+c.unit}));
      var bComp=JSON.stringify((b.components||[]).map(function(c){return c.name+':'+c.qty+c.unit}));
      if(aComp!==bComp)compChanged.push({name:a.name,a:a.components,b:b.components});
    }
  });
  listB.forEach(function(b){if(!mapA[b.name])added.push(b)});
  return {added:added,removed:removed,priceChanged:priceChanged,compChanged:compChanged};
};

window.promptNewMenuVersion=function(storeId){
  var versions=window.getMenuVersions(storeId,true);
  var existing=versions.map(function(v){return v.version});
  var nums=existing.map(function(v){return parseInt((v||'').replace(/\D/g,''))||0});
  var nextNum=Math.max(0,...nums)+1;
  var defaultVer='v'+nextNum;
  var fromVer=prompt('從哪個版本複製? (現有版本: '+existing.join(', ')+')',existing[existing.length-1]||'v1');
  if(!fromVer)return;
  var toVer=prompt('新版本名稱:',defaultVer);
  if(!toVer)return;
  if(window.createMenuVersion(storeId,fromVer,toVer)){
    state._menuVersionFilter=toVer;closeModal();renderPage();
  }
};
window.promptCopyMenuToStore=function(fromStoreId){
  var stores=(state.stores||[]).filter(function(s){return s.id!==fromStoreId});
  if(!stores.length){alert('沒有其他門市可複製');return}
  var versions=window.getMenuVersions(fromStoreId,false);
  if(!versions.length){alert('當前門市沒有作用中版本');return}
  var fromVer=prompt('來源版本: (現有: '+versions.map(function(v){return v.version}).join(', ')+')',versions[0].version);
  if(!fromVer)return;
  var storeList=stores.map(function(s,i){return (i+1)+'. '+s.name+' ('+s.id+')'}).join('\n');
  var toIdx=prompt('複製到哪個門市?\n'+storeList+'\n\n輸入編號:','1');
  if(!toIdx)return;
  var toStore=stores[+toIdx-1];if(!toStore){alert('編號錯誤');return}
  var toVer=prompt('目標門市的版本名稱:',fromVer);
  if(!toVer)return;
  if(window.copyMenuToStore(fromStoreId,fromVer,toStore.id,toVer)){closeModal();renderPage()}
};
window.promptCompareMenu=function(storeId){
  var versions=window.getMenuVersions(storeId,false);
  if(versions.length<2){alert('需要至少 2 個作用中版本才能比較');return}
  var verList=versions.map(function(v){return v.version}).join(', ');
  var verA=prompt('比較版本 A: ('+verList+')',versions[0].version);
  if(!verA)return;
  var verB=prompt('比較版本 B:',versions[versions.length-1].version);
  if(!verB||verA===verB){alert('需要兩個不同版本');return}
  var diff=window.compareMenuVersions(storeId,verA,verB);
  var html='<div style="font-size:1.05rem;font-weight:700;margin-bottom:10px">📊 版本比較: '+verA+' vs '+verB+'</div>';
  if(diff.added.length){html+='<div style="margin-bottom:8px"><div style="font-weight:600;color:#0A5A46;margin-bottom:4px">➕ 新增 ('+diff.added.length+' 項,在 '+verB+' 才有)</div><ul style="font-size:0.84rem;padding-left:20px">'+diff.added.map(function(m){return '<li>'+esc(m.name)+' ($'+m.price+')</li>'}).join('')+'</ul></div>'}
  if(diff.removed.length){html+='<div style="margin-bottom:8px"><div style="font-weight:600;color:#B82525;margin-bottom:4px">➖ 移除 ('+diff.removed.length+' 項,在 '+verA+' 才有)</div><ul style="font-size:0.84rem;padding-left:20px">'+diff.removed.map(function(m){return '<li>'+esc(m.name)+' ($'+m.price+')</li>'}).join('')+'</ul></div>'}
  if(diff.priceChanged.length){html+='<div style="margin-bottom:8px"><div style="font-weight:600;color:#9A6210;margin-bottom:4px">💰 售價變動 ('+diff.priceChanged.length+' 項)</div><ul style="font-size:0.84rem;padding-left:20px">'+diff.priceChanged.map(function(p){var diff=p.toPrice-p.fromPrice;return '<li>'+esc(p.name)+': $'+p.fromPrice+' → $'+p.toPrice+' <b style="color:'+(diff>0?'#B82525':'#0A5A46')+'">('+(diff>0?'+':'')+diff+')</b></li>'}).join('')+'</ul></div>'}
  if(diff.compChanged.length){html+='<div style="margin-bottom:8px"><div style="font-weight:600;color:#1455A0;margin-bottom:4px">📝 成分變動 ('+diff.compChanged.length+' 項)</div><ul style="font-size:0.84rem;padding-left:20px">'+diff.compChanged.map(function(c){return '<li>'+esc(c.name)+'</li>'}).join('')+'</ul></div>'}
  if(!diff.added.length&&!diff.removed.length&&!diff.priceChanged.length&&!diff.compChanged.length){html+='<div style="text-align:center;padding:20px;color:#0A5A46">✅ 兩版本完全相同</div>'}
  html+='<div class="save-btns"><button class="btn btn-outline" onclick="closeModal()">關閉</button></div>';
  modal(html,true);
};

// ── WASTE ───
function renderWaste(){
  const pg=dv({});
  const sw=sopBox('waste');if(sw)pg.appendChild(sw);
  const im=imap();
  const wCost=w=>im[w.name]?calcIngCost(im[w.name],w.lossQty||0,w.unit||im[w.name].unit):0;
  const total=state.waste.reduce((s,w)=>s+wCost(w),0);
  const thisMon=state.waste.filter(w=>w.date.startsWith(toMon()));
  const thisMonCost=thisMon.reduce((s,w)=>s+wCost(w),0);
  
  // 按類型分組
  var byType={normal:0,abnormal:0,staff:0,vendor_return:0};
  thisMon.forEach(function(w){
    var t=w.type||'normal';
    if(byType[t]===undefined)t='normal';
    byType[t]+=wCost(w);
  });
  
  pg.appendChild(dv({style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px'},
    dv({cls:'page-title',style:'margin:0'},'♻️ 損耗管理'),
    dv({style:'display:flex;gap:8px'},
      btn('btn btn-outline btn-sm','📈 損耗趨勢',showWasteTrend),
      btn('btn btn-primary','＋ 新增損耗',openWasteModal))));
  
  // 統計卡 (按類型) - B 升級
  pg.appendChild(dv({cls:'grid4',style:'margin-bottom:12px'},
    metCard('正常損耗 (本月)',CUR()+fmt(byType.normal,0),'備料/烹調 — 算入產品成本',byType.normal>0?'#0A5A46':'#999'),
    metCard('異常報廢 (本月)',CUR()+fmt(byType.abnormal,0),'過期/變質 — 需追究',byType.abnormal>0?'#B82525':'#0A5A46'),
    metCard('員工餐 (本月)',CUR()+fmt(byType.staff,0),'員工福利支出',byType.staff>0?'#9A6210':'#999'),
    metCard('廠商退貨 (本月)',CUR()+fmt(byType.vendor_return,0),'抵扣應付帳款',byType.vendor_return>0?'#1455A0':'#999')));
  
  // 第二行統計 - 累計指標
  pg.appendChild(dv({cls:'grid3',style:'margin-bottom:12px'},
    metCard('累積損耗筆數',state.waste.length+' 筆',''),
    metCard('累積損耗金額',CUR()+fmt(total),'',total>0?'#B82525':'#0A5A46'),
    metCard('本月損耗總額',CUR()+fmt(thisMonCost),thisMon.length+' 筆','#9A6210')));
  
  // 警示卡 - 異常報廢比例過高
  if(byType.abnormal>0&&thisMonCost>0){
    var abnormalPct=byType.abnormal/thisMonCost;
    if(abnormalPct>0.5){
      pg.appendChild(dv({cls:'card',style:'background:#FCE8E8;border:1px solid #B82525;margin-bottom:12px',html:'<div style="font-size:0.9rem;color:#B82525"><b>⚠️ 異常報廢警示</b><br>本月異常報廢佔總損耗 '+pct(abnormalPct)+',建議檢查進貨量與保存方式</div>'}));
    }
  }
  
  if(!state.waste.length){
    pg.appendChild(dv({cls:'card',style:'text-align:center;padding:40px;color:#706E68'},'尚無損耗記錄'));
    return pg;
  }
  
  // 損耗類型 filter (B 升級)
  var curFilter=state._wasteFilter||'all';
  var filterBar=dv({style:'display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap'});
  var filterOpts=[['all','全部'],['normal','✅ 正常'],['abnormal','⚠️ 異常'],['staff','🍱 員工餐'],['vendor_return','↩️ 廠商退貨']];
  filterOpts.forEach(function(opt){
    var b=document.createElement('button');
    b.className='btn btn-sm '+(curFilter===opt[0]?'btn-primary':'btn-outline');
    b.textContent=opt[1];
    b.onclick=function(){state._wasteFilter=opt[0];renderPage()};
    filterBar.appendChild(b);
  });
  pg.appendChild(filterBar);
  
  var filtered=curFilter==='all'?state.waste:state.waste.filter(function(w){return (w.type||'normal')===curFilter});
  
  pg.appendChild(dv({cls:'card',style:'padding:0;overflow:hidden',html:'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>日期</th><th>類型</th><th>食材</th><th>進貨量</th><th>損耗量</th><th>損耗率</th><th>成本</th><th>原因</th><th>處理</th></tr></thead><tbody>'+[...filtered].reverse().map(function(w){
    const r=w.incoming>0?w.lossQty/w.incoming:0;
    const c=wCost(w);
    var t=w.type||'normal';
    var typeInfo=window.WASTE_TYPES[t]||window.WASTE_TYPES.normal;
    return '<tr><td style="font-size:0.78rem;color:#706E68">'+esc(w.date)+'</td>'+
      '<td><span class="badge" style="background:'+typeInfo.bg+';color:'+typeInfo.color+'">'+typeInfo.label+'</span></td>'+
      '<td style="font-weight:600">'+esc(w.name)+'</td>'+
      '<td>'+w.incoming+' '+esc(w.unit)+'</td>'+
      '<td style="color:#e74c3c">'+w.lossQty+'</td>'+
      '<td><span class="badge '+(r>0.08?'badge-red':'badge-green')+'">'+pct(r)+'</span></td>'+
      '<td style="font-weight:600;color:#B82525">'+CUR()+fmt(c,0)+'</td>'+
      '<td><span class="badge badge-warn">'+esc(w.reason)+'</span></td>'+
      '<td><span class="badge badge-gray">'+esc(w.handle)+'</span></td></tr>';
  }).join('')+'</tbody></table></div>'}));
  return pg;
}

// 推測損耗類型 (依原因)
window.guessWasteType=function(reason){
  if(['備料損耗','烹調損耗','切除','蒸發'].indexOf(reason)>=0)return 'normal';
  if(['過期','腐爛','變質','撞傷','滴落','受潮','發芽','碎裂'].indexOf(reason)>=0)return 'abnormal';
  return 'normal';
};

  setTimeout(function(){updateWasteTypeHint();updateWasteCostPreview()},50);

// 食材選擇後顯示現有庫存提示
window.updateWasteIngHint=function(){
  var sel=$('w-name');if(!sel)return;
  var hint=$('w-ing-hint');if(!hint)return;
  var op=sel.options[sel.selectedIndex];
  if(!op||!op.value){hint.textContent='';return}
  var stock=op.getAttribute('data-stock');
  var unit=op.getAttribute('data-unit');
  hint.innerHTML='現有庫存: <b style="color:#0A5A46">'+stock+' '+unit+'</b>';
  // 自動帶入單位
  var unitSel=$('w-unit');
  if(unitSel&&unit){
    for(var i=0;i<unitSel.options.length;i++){if(unitSel.options[i].value===unit){unitSel.selectedIndex=i;break}}
  }
  updateWasteCostPreview();
};

// 損耗類型提示
window.updateWasteTypeHint=function(){
  var sel=$('w-type');if(!sel)return;
  var hint=$('w-type-hint');if(!hint)return;
  var t=window.WASTE_TYPES[sel.value];
  if(!t){hint.textContent='';return}
  hint.style.color=t.color;
  hint.textContent=t.desc;
};

// 原因選擇後自動推測類型
window.autoPickWasteType=function(){
  var reason=$('w-reason')?.value;if(!reason)return;
  var typeSel=$('w-type');if(!typeSel)return;
  var guessed=window.guessWasteType(reason);
  // 只在還是預設值時自動切換
  if(typeSel.value==='normal'||typeSel.value===''){
    typeSel.value=guessed;
    updateWasteTypeHint();
  }
};

// 損耗成本即時預覽
window.updateWasteCostPreview=function(){
  var name=$('w-name')?.value;
  var loss=+$('w-loss')?.value||0;
  var unit=$('w-unit')?.value||'公斤';
  var preview=$('w-cost-preview');
  if(!preview)return;
  if(!name||loss<=0){
    preview.innerHTML='📊 損耗成本: 請先填損耗量';
    return;
  }
  var ing=state.ings.find(function(i){return i.name===name});
  if(!ing){preview.innerHTML='📊 損耗成本: 找不到食材';return}
  var cost=calcIngCost(ing,loss,unit);
  var typeKey=$('w-type')?.value||'normal';
  var type=window.WASTE_TYPES[typeKey];
  preview.innerHTML='📊 損耗成本: <b style="color:'+(type?type.color:'#B82525')+';font-size:1rem">'+CUR()+fmt(cost,2)+'</b> ('+(type?type.label:'')+')<br><span style="font-size:0.76rem;color:#706E68">單位換算: '+ing.price+' '+CUR()+'/'+ing.unit+' × '+loss+' '+unit+' = 上述金額</span>';
};

window.saveWaste=function(){
  const nm=$('w-name')?.value;
  if(!nm){alert('請選擇食材');return}
  const loss=+$('w-loss')?.value||0;
  if(loss<=0){alert('請填入損耗量');return}
  const unit=$('w-unit')?.value||'公斤';
  const type=$('w-type')?.value||'normal';
  
  // 找對應食材
  const ing=state.ings.find(function(i){return i.name===nm});
  if(!ing){alert('找不到食材「'+nm+'」');return}
  
  // 換算成食材庫存單位
  var deductInStockUnit=loss;
  if(unit!==ing.unit){
    var weightUnits=['公斤','台斤','公升','公克','毫升','g','ml','kg','L'];
    if(weightUnits.indexOf(unit)>=0&&weightUnits.indexOf(ing.unit)>=0){
      // 重量類可換算
      var lossInG=unitToG(loss,unit);
      var oneStockUnitInG=unitToG(1,ing.unit);
      deductInStockUnit=lossInG/oneStockUnitInG;
    }else{
      // 不能換算 - 警告
      if(!confirm('⚠️ 損耗單位「'+unit+'」與食材庫存單位「'+ing.unit+'」不同,且無法精確換算\n\n仍要繼續記錄嗎? (將直接以損耗量扣庫存,可能不準確)'))return;
    }
  }
  
  // 檢查庫存夠不夠
  var currentStock=+ing.stock||0;
  if(deductInStockUnit>currentStock){
    if(!confirm('⚠️ 損耗量 ('+fmt(deductInStockUnit,2)+' '+ing.unit+') 超過現有庫存 ('+fmt(currentStock,2)+' '+ing.unit+')\n\n仍要記錄嗎?\n(庫存會變成 0,請事後盤點修正)'))return;
  }
  
  // 計算損耗金額
  var costAmt=calcIngCost(ing,loss,unit);
  
  // 推入損耗記錄
  state.waste.push({
    id:'W'+Date.now(),
    name:nm,
    ingId:ing.id,
    date:$('w-date')?.value||toDay(),
    incoming:+$('w-in')?.value||0,
    lossQty:loss,
    unit:unit,
    type:type,
    reason:$('w-reason')?.value||'',
    handle:$('w-handle')?.value||'',
    notes:$('w-notes')?.value||'',
    costAmt:costAmt,
    deductedQty:deductInStockUnit,
    deductedUnit:ing.unit
  });
  
  // 🔴 A 修補:扣食材庫存
  ing.stock=Math.max(0,currentStock-deductInStockUnit);
  ing.updatedAt=toDay();
  
  // 廠商退貨類型 - 自動建應收(抵扣應付)
  if(type==='vendor_return'&&ing.sup){
    if(!state.apList)state.apList=[];
    var sup=(state.sups||[]).find(function(s){return s.id===ing.sup||s.name===ing.sup});
    var supName=sup?sup.name:ing.sup;
    // 找最近一筆未付的 AP 做抵扣
    var ap=(state.apList||[]).find(function(a){return (a.supplier===supName)&&['未付款','部分付款'].indexOf(a.status)>=0});
    if(ap){
      ap.amount=Math.max(0,ap.amount-costAmt);
      ap.note=(ap.note||'')+' [廠商退貨抵扣 '+CUR()+fmt(costAmt,0)+' ('+nm+')]';
      if(ap.amount===0)ap.status='已付款';
    }
  }
  
  addAudit('記錄損耗('+window.WASTE_TYPES[type].label+')',nm+' '+loss+unit+' 扣庫存 '+fmt(deductInStockUnit,2)+ing.unit+' 損耗成本 '+CUR()+fmt(costAmt,0));
  saveState();closeModal();renderPage();
  toast('✅ 損耗已記錄並扣減庫存\n'+nm+' -'+fmt(deductInStockUnit,2)+ing.unit);
  // 🆕 自動推送到財會
  var lastWaste=state.waste[state.waste.length-1];
  if(typeof pushWasteToFinance==='function'&&lastWaste){
    try{pushWasteToFinance(lastWaste)}catch(e){console.warn('損耗→財會推送失敗',e)}
  }
};

// 更新叫貨數量 (暫存)
window.updateOrderQty=function(sheetId,seq,val){
  if(!state._orderDraft)state._orderDraft={};
  if(!state._orderDraft[sheetId])state._orderDraft[sheetId]={};
  var qty=+val||0;
  if(qty>0)state._orderDraft[sheetId][seq]=qty;
  else delete state._orderDraft[sheetId][seq];
  // 重算小計但不整頁刷新 (太重)
  var draft=state._orderDraft[sheetId]||{};
  var sheet=SHEETS.find(function(s){return s.id===sheetId});
  if(!sheet)return;
  var filledCount=0,subtotal=0;
  (sheet.items||[]).forEach(function(it){
    var q=+draft[it.seq]||0;
    if(q>0){filledCount++;subtotal+=q*(it.price||0)}
  });
  // 更新統計卡 (找特定 metric-val)
  var cards=document.querySelectorAll('.metric-val');
  if(cards.length>=3){
    cards[1].textContent=filledCount+' / '+(sheet.items||[]).length+' 項';
    cards[2].textContent=CUR()+fmt(subtotal,0);
    cards[2].style.color=subtotal>0?'#0A5A46':'#999';
  }
  // 高亮該行
  var tr=document.querySelector('input[data-seq="'+seq+'"]')?.closest('tr');
  if(tr){
    tr.style.background=qty>0?'#F5FBF8':'';
    var totalCell=tr.querySelector('td:last-child');
    if(totalCell){
      var t=qty*(sheet.items.find(function(x){return x.seq===seq})?.price||0);
      totalCell.innerHTML=t>0?CUR()+fmt(t,0):'—';
      totalCell.style.color=t>0?'#0A5A46':'#ccc';
      totalCell.style.fontWeight=t>0?'700':'400';
    }
  }
};

// 儲存叫貨單
window.saveOrderLog=function(){
  var sheetId=state._orderTab;
  var sheet=SHEETS.find(function(s){return s.id===sheetId});
  if(!sheet){alert('未選擇叫貨表');return}
  var draft=state._orderDraft[sheetId]||{};
  var items=[];
  var totalAmt=0;
  (sheet.items||[]).forEach(function(it){
    var qty=+draft[it.seq]||0;
    if(qty>0){
      var subtotal=qty*(it.price||0);
      items.push({seq:it.seq,name:it.name,unit:it.unit,qty:qty,price:it.price||0,subtotal:subtotal});
      totalAmt+=subtotal;
    }
  });
  if(items.length===0){alert('請至少填一個項目的數量');return}
  if(!confirm('確認儲存叫貨單?\n\n表單:'+sheet.title+'\n項目:'+items.length+' 項\n合計:'+CUR()+fmt(totalAmt,0)))return;
  
  if(!state.orderLog)state.orderLog=[];
  var rec={
    id:'O'+Date.now(),
    sheetId:sheetId,
    sheetTitle:sheet.title,
    date:toDay(),
    items:items,
    totalAmt:totalAmt,
    status:'草稿',
    createdAt:new Date().toISOString()
  };
  state.orderLog.push(rec);
  // 清空 draft
  delete state._orderDraft[sheetId];
  addAudit('儲存叫貨單',sheet.title+' '+items.length+'項 '+CUR()+fmt(totalAmt,0));
  saveState();
  toast('✅ 叫貨單已儲存 ('+items.length+' 項,'+CUR()+fmt(totalAmt,0)+')');
  renderPage();
};

  state.kitchenCosts[month]={personnel:p,rent:r,utilities:u,misc:m,note:note,updatedAt:new Date().toISOString()};
  addAudit('編輯廚房成本',month+' 總計 '+CUR()+(p+r+u+m).toLocaleString());
  saveState();
  closeModal();
  renderPage();
  toast('✅ '+month+' 成本已儲存');
};

// Tab 1: 配方毛利
function buildRecipeProfitTab(){
  var div=dv({});
  var recipes=state.recipes||[];
  
  // 計算每個配方的全成本毛利
  var rows=recipes.map(function(r){
    var fc=window.calcFullCostV2(r);
    return {recipe:r,fc:fc};
  });
  
  // 排序篩選 state
  if(!state._profitFilter)state._profitFilter={sort:'margin_asc',hideNoPrice:false};
  
  // 篩選
  var filtered=rows.slice();
  if(state._profitFilter.hideNoPrice){
    filtered=filtered.filter(function(x){return x.fc.sellPrice>0});
  }
  
  // 排序
  if(state._profitFilter.sort==='margin_asc'){
    filtered.sort(function(a,b){
      if(a.fc.sellPrice===0&&b.fc.sellPrice===0)return 0;
      if(a.fc.sellPrice===0)return 1;
      if(b.fc.sellPrice===0)return -1;
      return a.fc.netMargin-b.fc.netMargin;
    });
  }else if(state._profitFilter.sort==='margin_desc'){
    filtered.sort(function(a,b){return b.fc.netMargin-a.fc.netMargin});
  }else if(state._profitFilter.sort==='profit_desc'){
    filtered.sort(function(a,b){return b.fc.profit-a.fc.profit});
  }else if(state._profitFilter.sort==='cost_desc'){
    filtered.sort(function(a,b){return b.fc.perTotalCost-a.fc.perTotalCost});
  }
  
  // 統計卡
  var setSell=rows.filter(function(x){return x.fc.sellPrice>0});
  var lossRecipes=setSell.filter(function(x){return x.fc.isLoss});
  var lowMargin=setSell.filter(function(x){return !x.fc.isLoss&&x.fc.netMargin<0.2});
  var goodMargin=setSell.filter(function(x){return x.fc.netMargin>=0.4});
  
  div.appendChild(dv({cls:'grid4',style:'margin-bottom:14px'},
    metCard('已設售價',setSell.length+' / '+rows.length+' 個',''),

    '<select id="pf-sort" onchange="updateProfitFilter()" style="padding:6px 10px;border:1px solid #ccc;border-radius:6px">'+
      '<option value="margin_asc"'+(state._profitFilter.sort==='margin_asc'?' selected':'')+'>淨利率 ↑ (虧錢的最前)</option>'+
      '<option value="margin_desc"'+(state._profitFilter.sort==='margin_desc'?' selected':'')+'>淨利率 ↓ (賺錢的最前)</option>'+
      '<option value="profit_desc"'+(state._profitFilter.sort==='profit_desc'?' selected':'')+'>單位淨利 ↓</option>'+
      '<option value="cost_desc"'+(state._profitFilter.sort==='cost_desc'?' selected':'')+'>全成本 ↓</option>'+
    '</select>'+
    '<label style="display:flex;align-items:center;gap:4px;font-size:0.86rem;cursor:pointer">'+
      '<input type="checkbox" id="pf-hideprice" onchange="updateProfitFilter()"'+(state._profitFilter.hideNoPrice?' checked':'')+'>'+
      '只看已設售價'+
    '</label>'+
  '</div>';
  div.appendChild(filterCard);
  
  // 表格
  if(filtered.length===0){
    div.appendChild(dv({cls:'card',style:'text-align:center;padding:30px;color:#999'},'尚無配方'));
    return div;
  }
  
  var tblHtml='<div style="overflow-x:auto"><table class="tbl"><thead><tr>'+
    '<th>代碼</th><th>配方</th><th style="text-align:right">食材</th>'+
    '<th style="text-align:right">人事</th><th style="text-align:right">店租</th>'+
    '<th style="text-align:right">水電</th><th style="text-align:right">雜支</th>'+
    '<th style="text-align:right;background:#FCE8E8">全成本</th>'+
    '<th style="text-align:right;background:#E8F4EE">售價</th>'+
    '<th style="text-align:right">毛利%</th>'+
    '<th style="text-align:right;background:#FFF8ED">淨利%</th>'+
    '<th>狀態</th><th>操作</th></tr></thead><tbody>';
  
  filtered.forEach(function(x){
    var r=x.recipe;
    var fc=x.fc;
    var stColor='';
    var stLabel='';
    if(fc.sellPrice===0){
      stColor='#999';stLabel='⚪ 未設售價';
    }else if(fc.isLoss){
      stColor='#B82525';stLabel='🔴 虧錢';
    }else if(fc.netMargin<0.2){
      stColor='#9A6210';stLabel='🟡 低毛利';

      stColor='#0A5A46';stLabel='🟢 高毛利';

      '<td style="font-weight:700">'+esc(r.name)+'</td>'+

      '<td><button class="btn btn-sm btn-outline" onclick="openRecipeModal(\''+r.id+'\')">編輯</button></td>'+

  });
  
  tblHtml+='</tbody></table></div>';
  
  div.appendChild(dv({cls:'card',style:'padding:0;overflow:hidden',html:tblHtml}));

// Tab 2: 客戶毛利
function buildCustomerProfitTab(){
  var div=dv({});
  
  // 從訂單計算每個客戶的毛利
  // 訂單來源:custOrders + internalOrders
  var orders=[].concat(state.custOrders||[]).concat(state.internalOrders||[]);
  // 只算本月或近 30 天
  var thirty=new Date();thirty.setDate(thirty.getDate()-30);
  var thirtyStr=thirty.toISOString().substring(0,10);
  
  var customerStats={};
  orders.forEach(function(o){
    if(!o.date||o.date<thirtyStr)return;
    var custName=o.custName||o.customerName||o.store||'未知客戶';
    if(!customerStats[custName]){
      customerStats[custName]={
        name:custName,orderCount:0,revenue:0,foodCost:0,fullCost:0,
        items:[]
      };
    }
    customerStats[custName].orderCount++;
    
    // 計算這筆訂單的成本
    (o.items||[]).forEach(function(item){
      var qty=+item.qty||0;
      var price=+item.price||0;
      var subtotal=qty*price;
      customerStats[custName].revenue+=subtotal;
      
      // 找對應配方算成本
      var rec=(state.recipes||[]).find(function(r){return r.name===item.name||r.id===item.recipeId});
      if(rec){
        var fc=window.calcFullCostV2(rec);
        customerStats[custName].foodCost+=fc.perFood*qty;
        customerStats[custName].fullCost+=fc.perTotalCost*qty;
        customerStats[custName].items.push({name:item.name,qty:qty,subtotal:subtotal,foodCost:fc.perFood*qty,fullCost:fc.perTotalCost*qty});
      }else{
        // 沒對應配方,保守估計成本 = 售價 60% (餐飲業平均)
        customerStats[custName].foodCost+=subtotal*0.35;
        customerStats[custName].fullCost+=subtotal*0.6;
        customerStats[custName].items.push({name:item.name,qty:qty,subtotal:subtotal,foodCost:subtotal*0.35,fullCost:subtotal*0.6,estimated:true});
      }
    });
  });
  
  var rows=Object.values(customerStats).map(function(c){
    return {
      name:c.name,
      orderCount:c.orderCount,
      revenue:c.revenue,
      foodCost:c.foodCost,
      fullCost:c.fullCost,
      grossProfit:c.revenue-c.foodCost,
      grossMargin:c.revenue>0?(c.revenue-c.foodCost)/c.revenue:0,
      netProfit:c.revenue-c.fullCost,
      netMargin:c.revenue>0?(c.revenue-c.fullCost)/c.revenue:0,
      items:c.items
    };
  });
  
  rows.sort(function(a,b){return b.netMargin-a.netMargin});
  
  if(rows.length===0){
    div.appendChild(dv({cls:'card',style:'text-align:center;padding:30px;color:#999'},
      '<div style="font-size:1.1rem;margin-bottom:8px">📊 近 30 天無客戶訂單</div>'+
      '<div style="font-size:0.86rem">需要在「🛒 客戶訂單」「🏭→🏪 轉售」有訂單記錄</div>'
    ));
    return div;
  }
  
  // 統計
  var totalRev=rows.reduce(function(s,r){return s+r.revenue},0);
  var totalNetProfit=rows.reduce(function(s,r){return s+r.netProfit},0);
  var lossCust=rows.filter(function(r){return r.netProfit<0});
  var goodCust=rows.filter(function(r){return r.netMargin>=0.3});
  
  div.appendChild(dv({cls:'grid4',style:'margin-bottom:14px'},
    metCard('近 30 天總營收',CUR()+fmt(totalRev,0),''),
    metCard('🟢 高利客戶 (≥30%)',goodCust.length+' 家',''),
    metCard('🔴 虧錢客戶',lossCust.length+' 家',''),
    metCard('總淨利',CUR()+fmt(totalNetProfit,0),'')
  ));
  
  // 表格
  var tblHtml='<div style="overflow-x:auto"><table class="tbl"><thead><tr>'+
    '<th>排名</th><th>客戶</th><th style="text-align:right">訂單數</th>'+
    '<th style="text-align:right">營收</th><th style="text-align:right">食材成本</th>'+
    '<th style="text-align:right">全成本</th><th style="text-align:right">毛利</th>'+
    '<th style="text-align:right">淨利</th><th style="text-align:right">淨利%</th>'+
    '<th>狀態</th></tr></thead><tbody>';
  
  rows.forEach(function(r,i){
    var stColor='';
    var stLabel='';
    if(r.netProfit<0){stColor='#B82525';stLabel='🔴 虧錢!';}
    else if(r.netMargin<0.1){stColor='#9A6210';stLabel='🟡 利薄';}
    else if(r.netMargin>=0.3){stColor='#0A5A46';stLabel='🟢 優質';}
    else{stColor='#1455A0';stLabel='🔵 一般';}
    
    var rowStyle=r.netProfit<0?'background:#FCE8E8':'';
    
    tblHtml+='<tr style="'+rowStyle+'">'+
      '<td style="font-weight:700">'+(i+1)+(i===0?' 👑':'')+'</td>'+
      '<td style="font-weight:700">'+esc(r.name)+'</td>'+
      '<td style="text-align:right">'+r.orderCount+'</td>'+
      '<td style="text-align:right;font-weight:700">'+CUR()+fmt(r.revenue,0)+'</td>'+
      '<td style="text-align:right;color:#706E68">'+CUR()+fmt(r.foodCost,0)+'</td>'+
      '<td style="text-align:right;color:#B82525">'+CUR()+fmt(r.fullCost,0)+'</td>'+
      '<td style="text-align:right;color:#0A5A46">'+CUR()+fmt(r.grossProfit,0)+'</td>'+
      '<td style="text-align:right;font-weight:700;color:'+stColor+'">'+CUR()+fmt(r.netProfit,0)+'</td>'+
      '<td style="text-align:right;font-weight:700;color:'+stColor+'">'+(r.netMargin*100).toFixed(1)+'%</td>'+
      '<td><span style="color:'+stColor+';font-weight:600">'+stLabel+'</span></td>'+
    '</tr>';
  });
  
  tblHtml+='</tbody></table></div>';
  
  div.appendChild(dv({cls:'card',style:'padding:0;overflow:hidden',html:tblHtml}));
  
  // 提示
  div.appendChild(dv({style:'background:#F3F1EB;border-radius:6px;padding:10px 14px;margin-top:10px;font-size:0.82rem;color:#706E68'},
    '💡 找不到對應配方的品項用「售價 35% 食材成本 + 60% 全成本」估算 (餐飲業平均)｜資料來自客戶訂單 + 轉售訂單'
  ));
  
  return div;
}

// Tab 3: 月度趨勢
function buildProfitTrendTab(){
  var div=dv({});
  
  // 取近 6 個月
  var months=window.getRecentMonths(6).reverse();
  
  // 計算每月:營收、成本、淨利
  var monthlyData=months.map(function(m){
    var orders=[].concat(state.custOrders||[]).concat(state.internalOrders||[]);
    var monthOrders=orders.filter(function(o){return (o.date||'').substring(0,7)===m});
    
    var rev=0,foodCost=0,fullCost=0;
    monthOrders.forEach(function(o){
      (o.items||[]).forEach(function(item){
        var qty=+item.qty||0;
        var price=+item.price||0;
        rev+=qty*price;
        var rec=(state.recipes||[]).find(function(r){return r.name===item.name||r.id===item.recipeId});
        if(rec){
          var fc=window.calcFullCostV2(rec);
          foodCost+=fc.perFood*qty;
          fullCost+=fc.perTotalCost*qty;
        }else{
          foodCost+=qty*price*0.35;
          fullCost+=qty*price*0.6;
        }
      });
    });
    
    return {
      month:m,
      orderCount:monthOrders.length,
      revenue:rev,
      foodCost:foodCost,
      fullCost:fullCost,
      grossProfit:rev-foodCost,
      netProfit:rev-fullCost,
      grossMargin:rev>0?(rev-foodCost)/rev:0,
      netMargin:rev>0?(rev-fullCost)/rev:0
    };
  });
  
  // 統計
  var totalRev=monthlyData.reduce(function(s,d){return s+d.revenue},0);
  var totalNet=monthlyData.reduce(function(s,d){return s+d.netProfit},0);
  
  div.appendChild(dv({cls:'grid3',style:'margin-bottom:14px'},
    metCard('近 6 個月總營收',CUR()+fmt(totalRev,0),''),
    metCard('近 6 個月總淨利',CUR()+fmt(totalNet,0),''),
    metCard('平均淨利率',totalRev>0?(totalNet/totalRev*100).toFixed(1)+'%':'—','')
  ));
  
  // 趨勢表
  var tblHtml='<div style="overflow-x:auto"><table class="tbl"><thead><tr>'+
    '<th>月份</th><th style="text-align:right">訂單數</th>'+
    '<th style="text-align:right">營收</th>'+
    '<th style="text-align:right">食材成本</th>'+
    '<th style="text-align:right">全成本</th>'+
    '<th style="text-align:right">毛利</th>'+
    '<th style="text-align:right">淨利</th>'+
    '<th style="text-align:right">毛利%</th>'+
    '<th style="text-align:right">淨利%</th>'+
    '</tr></thead><tbody>';
  
  monthlyData.forEach(function(d){
    var netColor=d.netProfit>0?'#0A5A46':d.netProfit<0?'#B82525':'#999';
    tblHtml+='<tr>'+
      '<td style="font-weight:700">'+d.month+'</td>'+
      '<td style="text-align:right">'+d.orderCount+'</td>'+
      '<td style="text-align:right;font-weight:700">'+CUR()+fmt(d.revenue,0)+'</td>'+
      '<td style="text-align:right;color:#706E68">'+CUR()+fmt(d.foodCost,0)+'</td>'+
      '<td style="text-align:right;color:#B82525">'+CUR()+fmt(d.fullCost,0)+'</td>'+
      '<td style="text-align:right;color:#0A5A46">'+CUR()+fmt(d.grossProfit,0)+'</td>'+
      '<td style="text-align:right;font-weight:700;color:'+netColor+'">'+CUR()+fmt(d.netProfit,0)+'</td>'+
      '<td style="text-align:right">'+(d.grossMargin*100).toFixed(1)+'%</td>'+
      '<td style="text-align:right;font-weight:700;color:'+netColor+'">'+(d.netMargin*100).toFixed(1)+'%</td>'+
    '</tr>';
  });
  
  tblHtml+='</tbody></table></div>';
  
  div.appendChild(dv({cls:'card',style:'padding:0;overflow:hidden',html:tblHtml}));
  
  return div;
}

// 🆕 Google Drive 自動備份 (每日 1 次)
// Client ID: 48292281688-gr3cu08uu4ib7i9ebdl62pl40ej0ojt7.apps.googleusercontent.com
// Scope: drive.file
// ══════════════════════════════════════════════════════
window._gdConfig={
  clientId:'48292281688-gr3cu08uu4ib7i9ebdl62pl40ej0ojt7.apps.googleusercontent.com',
  scope:'https://www.googleapis.com/auth/drive.file',
  systemName:'好洺ERP',
  storageKey:'hm_erp_lastBackupDate'
};
window._gdToken=null;
window._gdClient=null;
window._gdInitialized=false;
window._gdPendingUpload=false;
window._gdManual=false;

window._gdToday=function(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};

window._gdLastBackup=function(){
  return localStorage.getItem(window._gdConfig.storageKey)||'';
};

window._gdBackedUpToday=function(){
  return window._gdLastBackup()===window._gdToday();
};

// 初始化 OAuth client (Lazy 載入)
window._gdInit=function(callback){
  if(window._gdInitialized){callback&&callback();return}
  
  var tries=0;
  var maxTries=50;  // 5 秒
  var checkLoaded=function(){
    if(typeof google!=='undefined'&&google.accounts&&google.accounts.oauth2){
      try{
        window._gdClient=google.accounts.oauth2.initTokenClient({
          client_id:window._gdConfig.clientId,
          scope:window._gdConfig.scope,
          callback:function(response){
            if(response.error){
              if(window._gdManual){
                alert('⚠ Google 授權失敗:'+(response.error_description||response.error));
              }
              window._gdToken=null;
              window._gdPendingUpload=false;
              return;
            }
            window._gdToken=response.access_token;
            if(window._gdPendingUpload){
              window._gdPendingUpload=false;
              window._gdDoUpload();
            }
          }
        });
        window._gdInitialized=true;
        callback&&callback();
      }catch(e){
        console.error('GIS init failed',e);
        if(window._gdManual)alert('⚠ Google Drive 初始化失敗:'+e.message);
      }
      return;
    }
    tries++;
    if(tries>=maxTries){
      if(window._gdManual)alert('⚠ Google 授權服務載入失敗,請檢查網路連線');
      return;
    }
    setTimeout(checkLoaded,100);
  };
  checkLoaded();
};

// 上傳到 Google Drive (multipart upload)
window._gdDoUpload=function(){
  if(!window._gdToken){
    if(window._gdManual)alert('⚠ 未授權,無法上傳');
    return;
  }
  
  try{
    var backupData=JSON.stringify(Object.assign({},state,{
      exportedAt:new Date().toISOString(),
      systemVersion:window.SYSTEM_VERSION||'unknown',
      autoBackup:true
    }),null,2);
    
    var fileName=window._gdConfig.systemName+'_備份_'+window._gdToday().replace(/-/g,'')+'.json';
    
    var metadata={name:fileName,mimeType:'application/json'};
    var form=new FormData();
    form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}));
    form.append('file',new Blob([backupData],{type:'application/json'}));
    
    fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
      method:'POST',
      headers:{'Authorization':'Bearer '+window._gdToken},
      body:form
    }).then(function(res){
      if(!res.ok){
        return res.json().then(function(err){throw new Error((err.error&&err.error.message)||res.statusText)});
      }
      return res.json();
    }).then(function(data){
      // 成功 → 靜默
      localStorage.setItem(window._gdConfig.storageKey,window._gdToday());
      console.log('[Google Drive] 備份成功:',fileName);
      window._gdUpdateBtn();
      if(window._gdManual){
        window._gdManual=false;
        if(typeof toast==='function')toast('☁️ 備份已上傳到 Google Drive');
      }
    }).catch(function(err){
      alert('⚠ 上傳 Google Drive 失敗:'+err.message);
      console.error('[Google Drive] upload failed',err);
    });
  }catch(e){
    if(window._gdManual)alert('⚠ 備份過程錯誤:'+e.message);
  }
};

// 觸發雲端備份 (手動或自動)
window.cloudBackup=function(isManual){
  window._gdManual=!!isManual;
  
  window._gdInit(function(){
    if(!window._gdClient)return;
    
    window._gdPendingUpload=true;
    if(isManual){
      // 手動 → 強制顯示授權
      window._gdClient.requestAccessToken();
    }else{
      // 自動 → 靜默授權 (已授權過才會成功)
      window._gdClient.requestAccessToken({prompt:''});
    }
  });
};

// 更新工具列「雲端備份」按鈕狀態
window._gdUpdateBtn=function(){
  var btn=document.getElementById('cloud-backup-btn');
  if(!btn)return;
  
  var last=window._gdLastBackup();
  var today=window._gdToday();
  
  if(last===today){
    btn.innerHTML='✅ 已備份';
    btn.style.background='#0A5A46';
    btn.style.color='#fff';
    btn.title='今日已自動備份至 Google Drive';
  }else if(last){
    var lastShort=last.substring(5);
    btn.innerHTML='📥 備份('+lastShort+')';
    btn.style.background='#1455A0';
    btn.style.color='#fff';
    btn.title='上次備份:'+last+' (今日尚未備份)';
  }else{
    btn.innerHTML='📥 雲端備份';
    btn.style.background='#1455A0';
    btn.style.color='#fff';
    btn.title='點擊上傳備份到 Google Drive (首次需 Google 登入授權)';
  }
};

  if(window._gdBackedUpToday())return;

function renderPO(){var pg=dv({});var sw=sopBox('po');if(sw)pg.appendChild(sw);var list=state.poList||[];
var statuses=['申請中','已核准','已下單','已到貨','已取消'];
var pending=list.filter(function(p){return p.status==='申請中'}).length;
var ordered=list.filter(function(p){return p.status==='已下單'}).length;
pg.appendChild(dv({style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px'},dv({cls:'page-title',style:'margin:0'},'📋 採購單管理'),dv({style:'display:flex;gap:8px'},btn('btn btn-primary','＋ 新增採購單',function(){openPOModal('')}),btn('btn btn-outline btn-sm','📊 供應商比價',showCompare))));
pg.appendChild(dv({cls:'grid4',style:'margin-bottom:16px'},metCard('採購單總數',list.length+' 筆',''),metCard('待核准',pending+' 筆','',pending>0?'#9A6210':'#0A5A46'),metCard('已下單待收',ordered+' 筆','',ordered>0?'#1455A0':'#0A5A46'),metCard('本月金額',CUR()+fmt(list.filter(function(p){return p.date&&p.date.startsWith(toMon())&&p.status!=='已取消'}).reduce(function(s,p){return s+(p.totalAmt||0)},0)),'')));
if(!list.length){pg.appendChild(dv({cls:'card',style:'text-align:center;padding:40px;color:#706E68'},'尚無採購單'));return pg}
var stFilter='<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">'+statuses.map(function(s){return'<button class="btn btn-sm btn-outline" onclick="filterPO(\''+s+'\')">'+s+'</button>'}).join('')+'<button class="btn btn-sm btn-outline" onclick="filterPO(\'\')">全部</button></div>';
pg.appendChild(dv({html:stFilter}));
pg.appendChild(dv({cls:'card',style:'padding:0;overflow:hidden',id:'po-table'}));
setTimeout(function(){filterPO('')},50);return pg}

window.filterPO=function(st){var w=$('po-table');if(!w)return;var list=(state.poList||[]).filter(function(p){return!st||p.status===st});
var stMap={'申請中':'badge-warn','已核准':'badge-blue','已下單':'badge-green','已到貨':'badge-gray','已取消':'badge-red'};
w.innerHTML=list.length===0?'<div style="padding:30px;text-align:center;color:#706E68">無資料</div>':'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>單號</th><th>日期</th><th>供應商</th><th>品項</th><th>數量</th><th>金額</th><th>狀態</th><th>申請人</th><th style="min-width:180px">操作</th></tr></thead><tbody>'+list.slice().reverse().map(function(p){return'<tr><td style="font-family:monospace;font-size:0.82rem;color:#706E68">'+esc(p.id.slice(-8))+'</td><td style="font-size:0.84rem">'+esc(p.date)+'</td><td style="font-weight:600">'+esc(p.supplier)+'</td><td style="font-weight:600">'+esc(p.itemName)+'</td><td>'+fmt(p.qty,1)+' '+esc(p.unit)+'</td><td style="color:#7A4D0B;font-weight:700">'+CUR()+fmt(p.totalAmt,0)+'</td><td><span class="badge '+(stMap[p.status]||'badge-gray')+'">'+esc(p.status)+'</span></td><td style="font-size:0.84rem">'+esc(p.requester||'—')+'</td><td><div style="display:flex;gap:4px;flex-wrap:wrap">'+(p.status==='申請中'?'<button class="btn btn-sm btn-success" onclick="updatePOStatus(\''+p.id+'\',\'已核准\')">核准</button><button class="btn btn-sm btn-danger" onclick="updatePOStatus(\''+p.id+'\',\'已取消\')">駁回</button>':'')+(p.status==='已核准'?'<button class="btn btn-sm btn-primary" onclick="updatePOStatus(\''+p.id+'\',\'已下單\')">下單</button>':'')+(p.status==='已下單'?'<button class="btn btn-sm btn-success" onclick="receivePO(\''+p.id+'\')">到貨驗收</button>':'')+(p.status==='已到貨'?'<button class="btn btn-sm btn-outline" onclick="returnPO(\''+p.id+'\')">退貨</button>':'—')+'</div></td></tr>'}).join('')+'</tbody></table></div>'};

window.openPOModal=function(){var sups=state.sups||[];
modal(mH('新增採購單')+'<div class="form-row c3"><div class="fg"><label>供應商</label><select id="po-sup">'+sups.map(function(s){return'<option value="'+esc(s.name)+'">'+s.id+' '+esc(s.name)+'</option>'}).join('')+'</select></div><div class="fg"><label>申請人</label><input id="po-req" placeholder="姓名"></div><div class="fg"><label>日期</label><input id="po-date" type="date" value="'+toDay()+'"></div></div><div class="form-row c4"><div class="fg"><label>品名</label><input id="po-item" placeholder="採購品項"></div><div class="fg"><label>數量</label><input id="po-qty" type="number" min="0" step="0.1"></div><div class="fg"><label>單位</label><input id="po-unit" value="包"></div><div class="fg"><label>單價</label><input id="po-price" type="number" min="0" step="0.01"></div></div><div class="fg" style="margin-bottom:8px"><label>備註</label><input id="po-note" placeholder="採購說明..."></div>'+mF('savePO()'))};

window.savePO=function(){var name=$('po-item')?$('po-item').value.trim():'';if(!name){alert('請填入品名');return}var qty=+($('po-qty')?$('po-qty').value:0)||0;var price=+($('po-price')?$('po-price').value:0)||0;var obj={id:'PO'+Date.now(),date:$('po-date')?$('po-date').value:toDay(),supplier:$('po-sup')?$('po-sup').value:'',requester:$('po-req')?$('po-req').value:'',itemName:name,qty:qty,unit:$('po-unit')?$('po-unit').value:'包',unitPrice:price,totalAmt:qty*price,status:'申請中',note:$('po-note')?$('po-note').value:'',receivedDate:'',returnQty:0};if(!state.poList)state.poList=[];state.poList.push(obj);addAudit('新增採購單',name+' '+CUR()+fmt(qty*price,0));saveState();closeModal();renderPage();toast('✅ 採購單已建立')};

window.updatePOStatus=function(id,st){var p=(state.poList||[]).find(function(x){return x.id===id});if(!p)return;p.status=st;if(st==='已取消'&&!confirm('確定取消此採購單？'))return;addAudit('採購單'+st,p.itemName);saveState();renderPage();toast('✅ 狀態更新為：'+st)};

window.receivePO=function(id){var p=(state.poList||[]).find(function(x){return x.id===id});if(!p)return;p.status='已到貨';p.receivedDate=toDay();if(!state.apList)state.apList=[];state.apList.push({id:'AP'+Date.now(),poId:p.id,date:p.receivedDate,supplier:p.supplier,itemName:p.itemName,amount:p.totalAmt,status:'未付款',dueDate:'',note:'自動由採購單產生'});addAudit('到貨驗收',p.itemName);saveState();renderPage();toast('✅ 已驗收，應付帳款已自動建立')};

window.returnPO=function(id){var p=(state.poList||[]).find(function(x){return x.id===id});if(!p)return;
modal(mH('退貨處理：'+esc(p.itemName))+'<div class="tip">原採購：'+fmt(p.qty,1)+' '+esc(p.unit)+' ｜ '+CUR()+fmt(p.totalAmt,0)+'</div><div class="form-row c2"><div class="fg"><label>退貨數量</label><input id="rt-qty" type="number" min="0" max="'+p.qty+'" step="0.1" value="'+p.qty+'"></div><div class="fg"><label>退貨原因</label><input id="rt-reason" placeholder="品質不良/數量不符..."></div></div>'+mF("savePOReturn('"+id+"')"))};

window.savePOReturn=function(id){var p=(state.poList||[]).find(function(x){return x.id===id});if(!p)return;var rq=+($('rt-qty')?$('rt-qty').value:0)||0;p.returnQty=(p.returnQty||0)+rq;p.note=(p.note||'')+' [退貨'+rq+esc(p.unit)+':'+($('rt-reason')?$('rt-reason').value:'')+']';addAudit('退貨',p.itemName+' '+rq+p.unit);saveState();closeModal();renderPage();toast('✅ 退貨已記錄')};

window.showCompare=function(){var sups=state.sups||[];var buys=state.buyLog||[];
var html=mH('📊 供應商比價分析');
var itemMap={};buys.forEach(function(b){if(!itemMap[b.ingName])itemMap[b.ingName]=[];itemMap[b.ingName].push(b)});
var items=Object.keys(itemMap).slice(0,15);
if(!items.length){html+='<div style="text-align:center;color:#706E68;padding:20px">需有進貨記錄才能比價</div>'}else{
html+='<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>品名</th><th>供應商</th><th>最近單價</th><th>平均單價</th><th>進貨次數</th></tr></thead><tbody>';
items.forEach(function(name){var records=itemMap[name];var bySupplier={};records.forEach(function(r){var sn=r.supId||'未知';if(!bySupplier[sn])bySupplier[sn]=[];bySupplier[sn].push(r)});
Object.keys(bySupplier).forEach(function(sn){var recs=bySupplier[sn];var latest=recs[recs.length-1];var avg=recs.reduce(function(s,r){return s+r.unitPrice},0)/recs.length;var sup=sups.find(function(s){return s.id===sn});
html+='<tr><td style="font-weight:600">'+esc(name)+'</td><td>'+esc(sup?sup.name:sn)+'</td><td style="color:#7A4D0B;font-weight:700">'+CUR()+fmt(latest.unitPrice,2)+'</td><td>'+CUR()+fmt(avg,2)+'</td><td>'+recs.length+'</td></tr>'})});
html+='</tbody></table></div>'}
html+='<div class="save-btns"><button class="btn btn-outline" onclick="closeModal()">關閉</button></div>';modal(html,true)};
