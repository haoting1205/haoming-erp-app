// 💳 應付帳款管理
// ══════════════════════════════════════════════════════
function renderAP(){var pg=dv({});var sw=sopBox('ap');if(sw)pg.appendChild(sw);var list=state.apList||[];
var unpaid=list.filter(function(a){return a.status==='未付款'});
var unpaidAmt=unpaid.reduce(function(s,a){return s+(a.amount||0)},0);
var paidAmt=list.filter(function(a){return a.status==='已付款'}).reduce(function(s,a){return s+(a.amount||0)},0);
pg.appendChild(dv({style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px'},dv({cls:'page-title',style:'margin:0'},'💳 應付帳款管理'),btn('btn btn-primary','＋ 新增帳款',function(){openAPModal('')})));
pg.appendChild(dv({cls:'grid4',style:'margin-bottom:16px'},metCard('帳款筆數',list.length+' 筆',''),metCard('未付金額',CUR()+fmt(unpaidAmt),'',unpaidAmt>0?'#B82525':'#0A5A46'),metCard('已付金額',CUR()+fmt(paidAmt),''),metCard('逾期帳款',list.filter(function(a){return a.status==='未付款'&&a.dueDate&&a.dueDate<toDay()}).length+' 筆','','')));
if(!list.length){pg.appendChild(dv({cls:'card',style:'text-align:center;padding:40px;color:#706E68'},'尚無應付帳款'));return pg}
pg.appendChild(dv({cls:'card',style:'padding:0;overflow:hidden',html:'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>日期</th><th>供應商</th><th>品項</th><th>金額</th><th>到期日</th><th>狀態</th><th>備註</th><th style="min-width:120px">操作</th></tr></thead><tbody>'+list.slice().reverse().map(function(a){var isOverdue=a.status==='未付款'&&a.dueDate&&a.dueDate<toDay();var stBadge=a.status==='已付款'?'<span class="badge badge-green">已付款</span>':a.status==='部分付款'?'<span class="badge badge-blue">部分付款</span>':isOverdue?'<span class="badge badge-red">逾期</span>':'<span class="badge badge-warn">未付款</span>';return'<tr style="'+(isOverdue?'background:#FDE8E8':'')+'"><td style="font-size:0.84rem">'+esc(a.date)+'</td><td style="font-weight:600">'+esc(a.supplier)+'</td><td>'+esc(a.itemName)+'</td><td style="color:#7A4D0B;font-weight:700">'+CUR()+fmt(a.amount,0)+'</td><td style="font-size:0.84rem;'+(isOverdue?'color:#B82525;font-weight:700':'color:#706E68')+'">'+esc(a.dueDate||'未設定')+'</td><td>'+stBadge+'</td><td style="font-size:0.84rem;color:#706E68">'+esc(a.note||'')+'</td><td><div style="display:flex;gap:4px">'+((a.status==='未付款'||a.status==='部分付款')?'<button class="btn btn-sm btn-success" onclick="collectAP(\''+a.id+'\')">付款</button><button class="btn btn-sm btn-outline" onclick="editAPDue(\''+a.id+'\')">設到期日</button>':'<span style="font-size:0.82rem;color:#706E68">'+esc(a.paidDate||'')+'</span>')+'</div></td></tr>'}).join('')+'</tbody></table></div>'}));return pg}

window.openAPModal=function(){modal(mH('新增應付帳款')+'<div class="form-row c3"><div class="fg"><label>供應商</label><input id="ap-sup" placeholder="供應商名稱"></div><div class="fg"><label>品項說明</label><input id="ap-item" placeholder="進貨品項"></div><div class="fg"><label>金額</label><input id="ap-amt" type="number" min="0" step="1"></div></div><div class="form-row c3"><div class="fg"><label>帳款日期</label><input id="ap-date" type="date" value="'+toDay()+'"></div><div class="fg"><label>到期日</label><input id="ap-due" type="date"></div><div class="fg"><label>備註</label><input id="ap-note" placeholder="發票號碼等..."></div></div>'+mF('saveAP()'))};

window.saveAP=function(){var obj={id:'AP'+Date.now(),date:$('ap-date')?$('ap-date').value:toDay(),supplier:$('ap-sup')?$('ap-sup').value:'',itemName:$('ap-item')?$('ap-item').value:'',amount:+($('ap-amt')?$('ap-amt').value:0)||0,dueDate:$('ap-due')?$('ap-due').value:'',status:'未付款',paidDate:'',note:$('ap-note')?$('ap-note').value:''};if(!state.apList)state.apList=[];state.apList.push(obj);addAudit('新增應付帳款',obj.supplier+' '+CUR()+fmt(obj.amount,0));saveState();closeModal();renderPage();toast('✅ 帳款已建立')};

window.payAP=function(id){if(!confirm('確認此筆帳款已付款？'))return;var a=(state.apList||[]).find(function(x){return x.id===id});if(!a)return;a.status='已付款';a.paidDate=toDay();addAudit('付款',a.supplier+' '+CUR()+fmt(a.amount,0));saveState();renderPage();toast('✅ 已標記為已付款')};

window.editAPDue=function(id){var a=(state.apList||[]).find(function(x){return x.id===id});if(!a)return;modal(mH('設定到期日')+'<div class="fg"><label>到期日</label><input id="ap-due2" type="date" value="'+(a.dueDate||'')+'"></div>'+mF("saveAPDue('"+id+"')"))};
window.saveAPDue=function(id){var a=(state.apList||[]).find(function(x){return x.id===id});if(!a)return;a.dueDate=$('ap-due2')?$('ap-due2').value:'';saveState();closeModal();renderPage();toast('✅ 到期日已設定')};


// ══════════════════════════════════════════════════════
// 📅 批號效期管理（FIFO）
// ══════════════════════════════════════════════════════
function renderBatch(){var pg=dv({});var sw=sopBox('batch');if(sw)pg.appendChild(sw);var list=state.batchList||[];
var today=toDay();var expiringSoon=list.filter(function(b){return b.status!=='已用完'&&b.expiryDate&&b.expiryDate<=today.slice(0,8)+(parseInt(today.slice(8))+7)});
var expired=list.filter(function(b){return b.status!=='已用完'&&b.expiryDate&&b.expiryDate<today});
pg.appendChild(dv({style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px'},dv({cls:'page-title',style:'margin:0'},'📅 批號效期管理'),btn('btn btn-primary','＋ 登錄批次',function(){openBatchModal()})));
pg.appendChild(dv({cls:'grid4',style:'margin-bottom:16px'},metCard('有效批次',list.filter(function(b){return b.status==='使用中'||b.status==='庫存中'}).length+' 批',''),metCard('即將到期',expiringSoon.length+' 批','7天內',expiringSoon.length>0?'#9A6210':'#0A5A46'),metCard('已過期',expired.length+' 批','',expired.length>0?'#B82525':'#0A5A46'),metCard('已用完',list.filter(function(b){return b.status==='已用完'}).length+' 批','')));
if(!list.length){pg.appendChild(dv({cls:'card',style:'text-align:center;padding:40px;color:#706E68'},'尚無批次記錄，進貨時登錄批號與效期'));return pg}
if(expired.length>0){pg.appendChild(dv({cls:'warn-box'},'⚠️ 有 '+expired.length+' 批食材已過期，請立即處理！'))}
pg.appendChild(dv({cls:'card',style:'padding:0;overflow:hidden',html:'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>批號</th><th>食材名稱</th><th>門市</th><th>進貨日</th><th>有效期限</th><th>剩餘天數</th><th>數量</th><th>狀態</th><th style="min-width:100px">操作</th></tr></thead><tbody>'+list.slice().reverse().map(function(b){var days=b.expiryDate?Math.ceil((new Date(b.expiryDate)-new Date(today))/86400000):'—';var dayColor=typeof days==='number'?(days<0?'#B82525':days<=7?'#9A6210':'#0A5A46'):'#706E68';var stMap={'庫存中':'badge-blue','使用中':'badge-green','已用完':'badge-gray','已過期':'badge-red'};var st=b.status;if(typeof days==='number'&&days<0&&st!=='已用完')st='已過期';return'<tr style="'+(st==='已過期'?'background:#FDE8E8':'')+'"><td style="font-family:monospace;font-weight:700">'+esc(b.batchNo)+'</td><td style="font-weight:600">'+esc(b.itemName)+'</td><td>'+esc(b.store||'中央廚房')+'</td><td style="font-size:0.84rem">'+esc(b.inDate)+'</td><td style="font-weight:600">'+esc(b.expiryDate||'未設定')+'</td><td style="font-weight:700;color:'+dayColor+'">'+(typeof days==='number'?(days<0?'已過期 '+Math.abs(days)+'天':days+'天'):'—')+'</td><td>'+fmt(b.remainQty,1)+' '+esc(b.unit)+'</td><td><span class="badge '+(stMap[st]||'badge-gray')+'">'+st+'</span></td><td><div style="display:flex;gap:4px">'+(st!=='已用完'&&st!=='已過期'?'<button class="btn btn-sm btn-outline" onclick="useBatch(\''+b.id+'\')">領用</button>':'')+(st==='已過期'?'<button class="btn btn-sm btn-danger" onclick="disposeBatch(\''+b.id+'\')">報廢</button>':'')+'</div></td></tr>'}).join('')+'</tbody></table></div>'}));return pg}

window.openBatchModal=function(){modal(mH('登錄新批次')+'<div class="form-row c3"><div class="fg"><label>批號</label><input id="bt-no" value="B'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+Math.floor(Math.random()*100)+'" placeholder="批號"></div><div class="fg"><label>食材名稱</label><input id="bt-item" placeholder="食材名稱"></div><div class="fg"><label>門市/倉庫</label><select id="bt-store"><option value="中央廚房">中央廚房</option>'+(state.meta.stores||[]).map(function(s){return'<option value="'+s+'">'+s+'</option>'}).join('')+'</select></div></div><div class="form-row c4"><div class="fg"><label>進貨日期</label><input id="bt-in" type="date" value="'+toDay()+'"></div><div class="fg"><label>有效期限</label><input id="bt-exp" type="date"></div><div class="fg"><label>數量</label><input id="bt-qty" type="number" min="0" step="0.1"></div><div class="fg"><label>單位</label><input id="bt-unit" value="包"></div></div><div class="fg"><label>備註</label><input id="bt-note" placeholder="供應商、溫層等..."></div>'+mF('saveBatch()'))};

window.saveBatch=function(){var obj={id:'BT'+Date.now(),batchNo:$('bt-no')?$('bt-no').value:'',itemName:$('bt-item')?$('bt-item').value:'',store:$('bt-store')?$('bt-store').value:'中央廚房',inDate:$('bt-in')?$('bt-in').value:toDay(),expiryDate:$('bt-exp')?$('bt-exp').value:'',totalQty:+($('bt-qty')?$('bt-qty').value:0)||0,remainQty:+($('bt-qty')?$('bt-qty').value:0)||0,unit:$('bt-unit')?$('bt-unit').value:'包',status:'庫存中',note:$('bt-note')?$('bt-note').value:''};if(!obj.itemName){alert('請填入食材名稱');return}if(!state.batchList)state.batchList=[];state.batchList.push(obj);addAudit('登錄批次',obj.batchNo+' '+obj.itemName);saveState();closeModal();renderPage();toast('✅ 批次已登錄')};

window.useBatch=function(id){var b=(state.batchList||[]).find(function(x){return x.id===id});if(!b)return;
modal(mH('領用：'+esc(b.batchNo)+' '+esc(b.itemName))+'<div class="tip">剩餘庫存：<b>'+fmt(b.remainQty,1)+' '+esc(b.unit)+'</b></div><div class="fg"><label>領用數量</label><input id="bu-qty" type="number" min="0" max="'+b.remainQty+'" step="0.1"></div>'+mF("saveBatchUse('"+id+"')"))};
window.saveBatchUse=function(id){var b=(state.batchList||[]).find(function(x){return x.id===id});if(!b)return;var q=+($('bu-qty')?$('bu-qty').value:0)||0;if(q>b.remainQty){alert('領用數量超過剩餘');return}b.remainQty-=q;if(b.remainQty<=0){b.remainQty=0;b.status='已用完'}else{b.status='使用中'}addAudit('批次領用',b.batchNo+' -'+q+b.unit);saveState();closeModal();renderPage();toast('✅ 已領用 '+q+' '+b.unit)};

window.disposeBatch=function(id){
  if(!confirm('確定報廢此批次?\n\n將自動:\n1. 扣減食材庫存\n2. 記錄為損耗(類型:異常報廢)\n3. 批次狀態改為已用完'))return;
  var b=(state.batchList||[]).find(function(x){return x.id===id});
  if(!b)return;
  
  // 找對應食材
  var ing=(state.ings||[]).find(function(i){return i.name===b.itemName});
  var costAmt=ing?calcIngCost(ing,b.remainQty||0,b.unit||(ing?ing.unit:'公斤')):0;
  
  state.waste.push({
    id:'W'+Date.now(),
    name:b.itemName,
    ingId:ing?ing.id:'',
    date:toDay(),
    incoming:b.totalQty,
    lossQty:b.remainQty,
    unit:b.unit||(ing?ing.unit:'公斤'),
    type:'abnormal',
    reason:'過期',
    handle:'丟棄',
    notes:'批次號 '+b.batchNo+' 報廢',
    costAmt:costAmt,
    deductedQty:b.remainQty,
    deductedUnit:b.unit||(ing?ing.unit:'公斤')
  });
  
  // 🔴 A 修補: 扣食材庫存
  if(ing){
    var deductInStockUnit=b.remainQty||0;
    if((b.unit||ing.unit)!==ing.unit){
      var weightUnits=['公斤','台斤','公升','公克','毫升','g','ml','kg','L'];
      if(weightUnits.indexOf(b.unit)>=0&&weightUnits.indexOf(ing.unit)>=0){
        var lossInG=unitToG(b.remainQty||0,b.unit||ing.unit);
        var oneStockUnitInG=unitToG(1,ing.unit);
        deductInStockUnit=lossInG/oneStockUnitInG;
      }
    }
    ing.stock=Math.max(0,(+ing.stock||0)-deductInStockUnit);
    ing.updatedAt=toDay();
  }
  
  b.status='已用完';
  b.remainQty=0;
  addAudit('批次報廢',b.batchNo+' '+b.itemName+' 損耗 '+CUR()+fmt(costAmt,0));
  saveState();renderPage();
  toast('✅ 已報廢並記入損耗\n扣減庫存 '+CUR()+fmt(costAmt,0));
};

window.exportProdLog=function(){
  if(typeof XLSX==='undefined'){alert('XLSX 未載入,無法匯出');return}
  var logs=state.prodLog||[];
  if(!logs.length){alert('無生產紀錄可匯出');return}
  
  var rows=logs.slice().reverse().map(function(l){
    return {
      '日期':l.date||'',
      '來源':({app_report:'📱 APP回報',schedule:'📅 排程',manual:'✏️ 手動'})[l.source||'manual']||'',
      '配方':l.recipeName||'',
      '批號':l.batchNo||'',
      '倍數':l.multiplier||1,
      '產出':l.output||0,
      '計畫產出':l.plannedOutput||'',
      '差異':l.plannedOutput?(l.output-l.plannedOutput):'',
      '單位':l.unit||'',
      '扣料項數':(l.deducted||l.deductedItems||[]).length,
      '回報人/負責人':l.reporterName||l.assignee||'',
      '回報時間':l.reportedAt||'',
      '門市':l.store||'',
      '排程ID':l.sourceId||'',
      'APP回報ID':l.sourceReportId||'',
      '備註':l.note||'',
      '建立時間':l.createdAt||l.date||''
    };
  });
  
  var ws=XLSX.utils.json_to_sheet(rows);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'生產紀錄');
  
  // 設定欄寬
  ws['!cols']=[{wch:12},{wch:12},{wch:18},{wch:14},{wch:6},{wch:8},{wch:8},{wch:8},{wch:6},{wch:8},{wch:14},{wch:18},{wch:12},{wch:18},{wch:18},{wch:20},{wch:18}];
  
  var fname='生產紀錄_'+toDay()+'_共'+logs.length+'筆.xlsx';
  XLSX.writeFile(wb,fname);
  toast('✅ 已匯出 '+logs.length+' 筆生產紀錄');
  addAudit('匯出生產紀錄',logs.length+' 筆 → '+fname);
};

// 🆕 月度生產報表
window.showProdMonthlyReport=function(){
  var logs=state.prodLog||[];
  if(!logs.length){alert('無生產紀錄');return}
  
  // 按月分組
  var byMonth={};
  logs.forEach(function(l){
    var m=(l.date||'').substring(0,7);
    if(!m)return;
    if(!byMonth[m])byMonth[m]={count:0,totalOutput:0,recipes:{},sources:{app_report:0,schedule:0,manual:0}};
    byMonth[m].count++;
    byMonth[m].totalOutput+=(+l.output||0);
    byMonth[m].recipes[l.recipeName]=(byMonth[m].recipes[l.recipeName]||0)+1;
    var src=l.source||'manual';
    byMonth[m].sources[src]=(byMonth[m].sources[src]||0)+1;
  });
  
  var months=Object.keys(byMonth).sort().reverse();
  
  var html=mH('📊 月度生產報表');
  html+='<div style="background:#F3F1EB;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.82rem">';
  html+='💡 顯示所有月份的生產統計,可了解各月生產量、來源比例、熱門配方';
  html+='</div>';
  
  if(months.length===0){
    html+='<div style="text-align:center;color:#999;padding:30px">無月度資料</div>';
  }else{
    html+='<div style="max-height:500px;overflow-y:auto"><table class="tbl" style="font-size:0.86rem"><thead><tr>';
    html+='<th>月份</th><th>總筆數</th><th>總產出</th><th>📱 APP</th><th>📅 排程</th><th>✏️ 手動</th><th>熱門配方 TOP 3</th>';
    html+='</tr></thead><tbody>';
    
    months.forEach(function(m){
      var d=byMonth[m];
      var topRecipes=Object.entries(d.recipes).sort(function(a,b){return b[1]-a[1]}).slice(0,3);
      html+='<tr>';
      html+='<td style="font-weight:700">'+m+'</td>';
      html+='<td><span class="badge badge-blue">'+d.count+'</span></td>';
      html+='<td style="font-weight:700;color:#7A4D0B">'+fmt(d.totalOutput,0)+'</td>';
      html+='<td><span style="color:#0A5A46;font-weight:700">'+(d.sources.app_report||0)+'</span></td>';
      html+='<td><span style="color:#1455A0;font-weight:700">'+(d.sources.schedule||0)+'</span></td>';
      html+='<td><span style="color:#706E68">'+(d.sources.manual||0)+'</span></td>';
      html+='<td style="font-size:0.78rem">'+topRecipes.map(function(r){return esc(r[0])+'<span style="color:#999">('+r[1]+')</span>'}).join(' ｜ ')+'</td>';
      html+='</tr>';
    });
    html+='</tbody></table></div>';
  }
  
  html+='<div style="margin-top:12px;text-align:right">';
  html+='<button class="btn btn-outline btn-sm" onclick="exportProdLog()" style="margin-right:6px">📥 匯出 Excel</button>';
  html+='<button class="btn btn-outline" onclick="closeModal()">關閉</button>';
  html+='</div>';
  
  modal(html);
};

window.previewProdDeduct=function(){var pv=$('pd-preview');if(!pv)return;var recId=$('pd-rec')?$('pd-rec').value:'';var mult=+($('pd-mult')?$('pd-mult').value:1)||1;var rec=(state.recipes||[]).find(function(r){return r.id===recId});if(!rec){pv.innerHTML='';return}var im=imap();var prodMult=mult*(rec.multiplier||1);var output=mult*(rec.perBatch||1);

window.encryptedExport=function(){

var pwd=prompt('請設定加密密碼（匯入時需要）：');
if(!pwd)return;
var enc=btoa(unescape(encodeURIComponent(pwd+'|||'+data)));

window.encryptedImport=function(){
var input=document.createElement('input');input.type='file';input.accept='.enc';
input.onchange=function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){
try{var dec=decodeURIComponent(escape(atob(ev.target.result)));var sep=dec.indexOf('|||');if(sep<0)throw new Error();
var pwd=prompt('請輸入加密密碼：');if(!pwd)return;
if(dec.slice(0,sep)!==pwd){alert('❌ 密碼錯誤');return}
var d=JSON.parse(dec.slice(sep+3));if(!d.ings)throw new Error();
if(!confirm('確定匯入？目前資料將被覆蓋'))return;
Object.assign(state,d);saveState();renderPage();toast('✅ 加密備份已匯入')}catch(err){alert('❌ 檔案無效或密碼錯誤')}};reader.readAsText(file)};input.click()};

var _autoBackupTimer=null;
function scheduleAutoBackup(){clearInterval(_autoBackupTimer);_autoBackupTimer=setInterval(function(){
try{
  var now=new Date();var key='hm_autobackup_'+toDay();
  // 每天第一次自動備份
  if(!localStorage.getItem(key)){
    localStorage.setItem(key,JSON.stringify({ts:now.toISOString(),data:state}));
  }else{
    // 同一天更新備份
    localStorage.setItem(key,JSON.stringify({ts:now.toISOString(),data:state}));
  }
  // 清理超過 14 天的備份
  var old=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('hm_autobackup_')&&!k.includes('_T'))old.push(k)}
  old.sort();while(old.length>14){localStorage.removeItem(old.shift())}
}catch(e){}},180000)}
scheduleAutoBackup();

// 🆕 從排程算採購清單 (showProcurementFromSchedule)
// 邏輯:抓「待生產」排程 → 累計食材需求 (含單位換算) → 對比庫存 → 算缺口 → 按廠商分組
// ══════════════════════════════════════════════════════

// 數量單位轉換工具 (重量↔重量、體積↔體積、重量↔體積透過密度)
window._convertProcQty=function(qty,fromUnit,toUnit,invName){
  if(!qty)return 0;
  if(!fromUnit||!toUnit||fromUnit===toUnit)return qty;
  
  var UD=window.UNIT_DB||{};
  var fromInfo=UD[fromUnit];
  var toInfo=UD[toUnit];
  var fromType=fromInfo&&fromInfo.type;
  var toType=toInfo&&toInfo.type;
  
  // 同類別 (重量↔重量, 體積↔體積)
  if(fromType&&toType&&fromType===toType&&(fromType==='weight'||fromType==='volume')){
    var qtyInBase=window.unitToG?window.unitToG(qty,fromUnit):qty;
    var oneInBase=window.unitToG?window.unitToG(1,toUnit):1;
    if(oneInBase>0)return qtyInBase/oneInBase;
  }
  
  // 跨類別 (重量↔體積) — 用密度
  if(fromType&&toType&&((fromType==='weight'&&toType==='volume')||(fromType==='volume'&&toType==='weight'))){
    var density=(window.getDensity&&invName?window.getDensity(invName):null)||1.0;
    var qtyInBaseUnit=window.unitToG?window.unitToG(qty,fromUnit):qty;
    if(fromType==='weight'&&toType==='volume'){
      // g → ml: vol = mass / density
      var qtyInMl=qtyInBaseUnit/density;
      var oneInMl=window.unitToG?window.unitToG(1,toUnit):1;
      if(oneInMl>0)return qtyInMl/oneInMl;
    }else{
      // ml → g: mass = vol × density
      var qtyInG=qtyInBaseUnit*density;
      var oneInG=window.unitToG?window.unitToG(1,toUnit):1;
      if(oneInG>0)return qtyInG/oneInG;
    }
  }
  
  // 計件類無法換算 — 警告並回原值 (此 case 應該不會走到,因為 detectIngAnomalies 會擋)
  if(typeof console!=='undefined')console.warn('[採購清單] 單位無法換算 '+fromUnit+' → '+toUnit+' ('+invName+')');
  return qty;
};

window.calcProcurementFromSchedule=function(opts){
  opts=opts||{};
  var statuses=opts.statuses||['待生產'];
  var dateFrom=opts.dateFrom||'';
  var dateTo=opts.dateTo||'';
  
  var schedules=(state.prodSchedule||[]).filter(function(s){
    if(statuses.indexOf(s.status)<0)return false;
    if(dateFrom&&s.date<dateFrom)return false;
    if(dateTo&&s.date>dateTo)return false;
    return true;
  });
  
  if(schedules.length===0)return {needs:[],schedules:[],summary:{scheduleCount:0,ingCount:0,totalCost:0,buyCount:0}};
  
  // 食材庫 lookup (先建立,需求累計時要用)
  var im={};
  (state.ings||[]).forEach(function(i){im[i.name]=i});
  
  // 累計每個食材的總需求量 (含批次倍數,並換算到食材單位)
  var needs={};
  schedules.forEach(function(s){
    var rec=(state.recipes||[]).find(function(r){return r.id===s.recipeId});
    if(!rec)return;
    var mult=s.multiplier||1;
    (rec.ings||[]).forEach(function(ing){
      var k=ing.name;
      var inv=im[ing.name];
      // 用食材單位作為計算基準 (沒食材就用配方單位,事後會標 ⚠️ 未建食材)
      var displayUnit=inv?inv.unit:(ing.unit||'');
      
      if(!needs[k]){
        needs[k]={
          name:ing.name,
          totalQty:0,
          unit:displayUnit,
          recipeUnit:ing.unit||'',
          schedules:[]
        };
      }
      
      // 配方需求量 (配方單位)
      var qtyInRecipeUnit=(ing.qty||0)*mult;
      // 🆕 換算到食材單位 (避免 30000g vs 1kg 直接相減的單位錯亂)
      var qtyInInvUnit=qtyInRecipeUnit;
      if(inv&&ing.unit&&inv.unit&&ing.unit!==inv.unit){
        qtyInInvUnit=window._convertProcQty(qtyInRecipeUnit,ing.unit,inv.unit,ing.name);
      }
      
      needs[k].totalQty+=qtyInInvUnit;
      needs[k].schedules.push({
        date:s.date,
        recipeName:s.recipeName,
        qty:qtyInInvUnit
      });
    });
  });
  
  // 對比庫存 + 算缺口 + 廠商
  var result=Object.keys(needs).map(function(k){
    var n=needs[k];
    var inv=im[n.name];
    var stock=inv?(+inv.stock||0):0;
    var safety=inv?(+inv.safety||0):0;
    // 需採購 = 需求量 - 現有庫存 + 安全庫存 (用完還要保留)
    // 此時 totalQty/stock/safety 都是同單位 (食材單位)
    // 🆕 deductStock=false 時:不扣庫存,直接顯示總需求 (Tim 還沒用採購功能時的純叫貨量)
    var deductStock=opts.deductStock!==false;  // 預設 true (扣庫存)
    var needBuy=deductStock?Math.max(0,n.totalQty-stock+safety):n.totalQty;
    
    // 廠商
    var supId=inv&&inv.sup?inv.sup:'';
    var supName='未指定';
    if(supId){
      var supObj=(state.sups||[]).find(function(x){return x.id===supId||x.name===supId});
      supName=supObj?supObj.name:supId;
    }
    if(!inv)supName='⚠️ 未建食材';
    
    return {
      name:n.name,
      totalQty:n.totalQty,
      unit:n.unit,
      recipeUnit:n.recipeUnit,
      stock:stock,
      safety:safety,
      needBuy:needBuy,
      price:inv?(+inv.price||0):0,
      cost:needBuy*(inv?(+inv.price||0):0),  // needBuy 跟 price 都是食材單位 → 直接乘正確
      supId:supId,
      supName:supName,
      hasInventory:!!inv,
      schedules:n.schedules
    };
  });
  
  // 排序:依採購金額 (高到低)
  result.sort(function(a,b){return b.cost-a.cost});
  
  return {
    needs:result,
    schedules:schedules,
    summary:{
      scheduleCount:schedules.length,
      ingCount:result.length,
      buyCount:result.filter(function(n){return n.needBuy>0}).length,
      totalCost:result.reduce(function(s,n){return s+n.cost},0)
    }
  };
};

// 🆕 開始生產 = 自動從庫存扣料 (連動 prod)
window.execSchedule=function(id){
  var s=state.prodSchedule.find(function(x){return x.id===id});
  if(!s)return;
  var rec=(state.recipes||[]).find(function(r){return r.id===s.recipeId});
  if(!rec){alert('找不到對應配方');return}
  
  // 預檢扣料
  var im=imap();
  var shortage=[];
  var deductPlan=[];
  (rec.ings||[]).forEach(function(ri){
    var inv=im[ri.name];
    if(!inv){shortage.push({name:ri.name,reason:'食材不在庫存中'});return}
    var qtyToDeduct=(ri.qty||0)*s.multiplier;
    // 換算到食材庫存單位
    var deductInStockUnit=qtyToDeduct;
    if(ri.unit!==inv.unit){
      var weightUnits=['公斤','台斤','公升','公克','毫升','g','ml','kg','L'];
      if(weightUnits.indexOf(ri.unit)>=0&&weightUnits.indexOf(inv.unit)>=0){
        var lossInG=unitToG(qtyToDeduct,ri.unit);
        var oneStockUnitInG=unitToG(1,inv.unit);
        deductInStockUnit=lossInG/oneStockUnitInG;
      }
    }
    if(deductInStockUnit>(inv.stock||0)){
      shortage.push({name:ri.name,need:deductInStockUnit,have:inv.stock||0,unit:inv.unit});
    }
    deductPlan.push({inv:inv,qty:deductInStockUnit});
  });
  
  if(shortage.length>0){
    var msg='⚠️ 庫存不足!\n\n';
    shortage.forEach(function(sh){
      msg+='• '+sh.name+(sh.reason?' - '+sh.reason:': 需 '+fmt(sh.need,2)+' '+sh.unit+',庫存只有 '+fmt(sh.have,2))+'\n';
    });
    msg+='\n是否強制開始生產? (庫存會被扣到負/0)';
    if(!confirm(msg))return;
  }
  
  // 執行扣料
  var deducted=[];
  deductPlan.forEach(function(d){
    var oldStock=d.inv.stock||0;
    d.inv.stock=Math.max(0,oldStock-d.qty);
    d.inv.updatedAt=toDay();
    deducted.push(d.inv.name+' -'+fmt(d.qty,2)+' '+d.inv.unit);
  });
  
  s.status='生產中';
  s.startedAt=new Date().toISOString();
  s.deductedAt=new Date().toISOString();
  s.deductedItems=deducted;
  
  // 推一筆到 prodLog
  if(!state.prodLog)state.prodLog=[];
  state.prodLog.push({
    id:'P'+Date.now(),
    date:toDay(),
    recipeId:rec.id,
    recipeName:rec.name,
    multiplier:s.multiplier,
    output:s.output,
    unit:s.unit,
    source:'schedule',
    sourceId:s.id,
    note:'從排程自動扣料 - '+s.timeSlot,
    deductedItems:deducted
  });
  
  addAudit('開始生產+扣料',s.recipeName+' x'+s.multiplier+' ('+deducted.length+' 項食材扣減)');
  saveState();
  renderPage();
  toast('✅ 已開始生產\n扣減 '+deducted.length+' 項食材庫存');
};

// 🆕 員工 APP 生產回報串接
// ═══════════════════════════════════════════════════
// 員工 APP 寫入路徑: prod_hrdata/prodReports (Firestore collection)
// 每筆回報結構:
// {
//   id: 'PR1730000000000',
//   scheduleId: 'SC1730000000000',  // 對應排程 ID
//   recipeName: '藍莓優格醬',
//   batchNo: 'B20260505-01',         // 批號
//   actualQty: 1850,                 // 實際數量
//   plannedQty: 2000,                // 計畫數量 (來自排程)
//   unit: '公克',
//   reporterName: '王小明',
//   reporterId: 'E001',
//   reportedAt: '2026-05-05T10:30:00.000Z',
//   note: '冰箱不夠冰,實際少 150g',
//   store: '中央廚房'
// }

window._prodReportsLoaded=false;
window._prodReportsLoading=false;

// 🆕 員工 APP 資料結構適配層
// 員工 APP 寫入格式 (巢狀物件):
//   {data: {scheduleId: {empId: {batch, actual, extraG, extraUnit, unit, name, time, date, recipeName}}}}
// ERP 期待格式 (陣列):
//   {data: [{id, scheduleId, batchNo, actualQty, unit, reporterName, reporterId, reportedAt, recipeName, ...}]}
// 此函式自動偵測並轉換,相容兩種格式
window.normalizeProdReports=function(rawData){
  if(!rawData)return [];
  
  // 已經是陣列 → 直接返回 (相容舊格式或將來統一格式)
  if(Array.isArray(rawData))return rawData;
  
  // 巢狀物件 (員工 APP 格式) → 攤平成陣列
  if(typeof rawData==='object'){
    var result=[];
    Object.keys(rawData).forEach(function(scheduleId){
      var byEmp=rawData[scheduleId];
      if(!byEmp||typeof byEmp!=='object')return;
      Object.keys(byEmp).forEach(function(empId){
        var rpt=byEmp[empId];
        if(!rpt||typeof rpt!=='object')return;
        
        // 處理時間:員工 APP 是 ISO 字串
        var reportedAt=rpt.date||rpt.time||'';
        // 如果只有 time (HH:MM) 沒 date,組合今天
        if(reportedAt&&reportedAt.length<=5){
          reportedAt=new Date().toISOString().substring(0,10)+'T'+reportedAt+':00.000Z';
        }
        
        // 計算實際數量 (主數量 + 額外數量, 額外換算需注意單位)
        var actualQty=+rpt.actual||0;
        var extraQty=+rpt.extraG||0;
        // 若 extraUnit 是 g 且主單位也是 g/公克 → 直接相加
        // 否則保留主數量 (額外當作額外不加總)
        var totalQty=actualQty;
        if(extraQty>0){
          var mainUnit=(rpt.unit||'').toLowerCase();
          var extUnit=(rpt.extraUnit||'').toLowerCase();
          if(mainUnit===extUnit||
             (mainUnit==='g'&&extUnit==='g')||
             (mainUnit==='公克'&&extUnit==='g')||
             (mainUnit==='g'&&extUnit==='公克')||
             (mainUnit==='公克'&&extUnit==='公克')){
            totalQty=actualQty+extraQty;
          }
          // 不同單位不加總,保留 actualQty
        }
        
        // 構造備註 (含額外數量資訊)
        var note='';
        if(extraQty>0){
          note='+'+extraQty+(rpt.extraUnit||'g');
        }
        
        result.push({
          id:'PR_'+scheduleId+'_'+empId,
          scheduleId:scheduleId,
          recipeName:rpt.recipeName||'',
          batchNo:rpt.batch||'',
          actualQty:totalQty,
          plannedQty:0,  // 從 schedule 取
          unit:rpt.unit||'',
          reporterName:rpt.name||'',
          reporterId:empId,
          reportedAt:reportedAt,
          note:note,
          store:rpt.store||'',
          // 保留原始資料,以便除錯
          _raw:{
            actual:rpt.actual,
            extraG:rpt.extraG,
            extraUnit:rpt.extraUnit,
            time:rpt.time
          }
        });
      });
    });
    
    // 依時間倒序排列 (新的在前)
    result.sort(function(a,b){
      return (b.reportedAt||'').localeCompare(a.reportedAt||'');
    });
    
    return result;
  }
  
  return [];
};

window.loadProdReports=function(forceReload){
  if(window._prodReportsLoading)return;
  if(window._prodReportsLoaded&&!forceReload)return;  // 避免重複載入
  if(typeof initFirebaseSDK!=='function'||!initFirebaseSDK())return;
  if(typeof _fbDb==='undefined'||!_fbDb)return;
  
  window._prodReportsLoading=true;
  _fbDb.collection('prod_hrdata').doc('prodReports').get()
    .then(function(doc){
      if(doc.exists&&doc.data()){
        var d=doc.data();
        // 🆕 兼容兩種格式:員工 APP 巢狀物件 / ERP 陣列
        var rawData=d.data!==undefined?d.data:(d.records!==undefined?d.records:[]);
        var reports=window.normalizeProdReports(rawData);
        state._prodReports=reports;
        // 🆕 同步到 ERP localStorage 永久保存
        state.prodReports=reports.slice();  // 深拷貝
        // 🆕 自動合併到 prodLog (主生產紀錄,給生產頁/成本分析用)
        syncReportsToProdLog(reports);
        saveState();  // 寫入 localStorage
        window._prodReportsLoaded=true;
        window._prodReportsLoading=false;
        if(state.page==='schedule'||state.page==='prod')renderPage();
      }else{
        state._prodReports=[];
        window._prodReportsLoaded=true;
        window._prodReportsLoading=false;

// 🆕 把 APP 回報自動合併到主 prodLog
// 用 source='app_report' + sourceId 標記,避免重複寫入
window.syncReportsToProdLog=function(reports){
  if(!state.prodLog)state.prodLog=[];
  var existingIds={};
  state.prodLog.forEach(function(p){
    if(p.source==='app_report'&&p.sourceReportId){
      existingIds[p.sourceReportId]=true;
    }
  });
  
  var newCount=0;
  reports.forEach(function(r){
    if(!r.id||existingIds[r.id])return;  // 已存在
    
    // 找對應排程取得計畫資訊
    var sched=(state.prodSchedule||[]).find(function(s){return s.id===r.scheduleId});
    
    state.prodLog.push({
      id:'P'+Date.now()+Math.floor(Math.random()*1000),
      date:r.reportedAt?r.reportedAt.substring(0,10):toDay(),
      recipeId:sched?sched.recipeId:'',
      recipeName:r.recipeName||(sched?sched.recipeName:''),
      multiplier:sched?sched.multiplier:1,
      output:r.actualQty,
      plannedOutput:r.plannedQty||(sched?sched.output:0),
      unit:r.unit,
      source:'app_report',  // 🆕 來源標記
      sourceReportId:r.id,  // 🆕 對應的 APP 回報 ID
      sourceId:r.scheduleId,
      reporterId:r.reporterId,
      reporterName:r.reporterName,
      reportedAt:r.reportedAt,
      batchNo:r.batchNo,
      store:r.store,
      note:r.note||'從員工 APP 自動同步',
      // 防竄改
      locked:true,  // 🔒 APP 回報不可在 ERP 端修改
      createdAt:new Date().toISOString()
    });
    newCount++;
  });
  
  if(newCount>0){
    addAudit('APP回報同步','合併 '+newCount+' 筆到生產紀錄');
    console.log('[syncReportsToProdLog] 新增 '+newCount+' 筆 APP 回報');
  }
};

window.doLogin=function(){
  var un=(document.getElementById('login-user')||{}).value||'';
  var pw=(document.getElementById('login-pass')||{}).value||'';
  var errEl=document.getElementById('login-err');
  if(!un||!pw){if(errEl){errEl.textContent='請輸入帳號和密碼';errEl.style.display='block'}return}
  
  // 🆕 階段二:優先查 HR accounts (共用人資系統帳號)
  var hrUser=null;
  try{
    var cache=JSON.parse(localStorage.getItem('hm_hr_accounts_cache')||'{}');
    if(cache.accounts&&Array.isArray(cache.accounts)){
      hrUser=cache.accounts.find(function(a){return a.user===un&&window.verifyPass(pw,a.pass)});
    }
  }catch(e){}
  if(hrUser){
    // HR 角色映射到 ERP 角色
    var erpRole='員工';
    var hrRole=hrUser.role||'';
    if(hrRole==='管理員'||hrRole==='老闆'||hrUser.user==='boss')erpRole='老闆';
    else if(hrRole==='店長'||hrRole==='主管')erpRole='店長';
    else if(hrRole==='示範訪客')erpRole='示範訪客';
    state.currentUser={id:hrUser.empId||('HR-'+hrUser.user),username:un,name:hrUser.name||un,role:erpRole,hrAccount:true};
    if(erpRole==='示範訪客')enterDemoMode();
    // 共用流程處理 (記憶帳密等)
    _doLoginCommonFlow(un,pw,erpRole,hrUser.name||un);
    return;
  }
  
  // 回退:查 ERP 自有 state.users (admin/demo 等內建帳號)
  var user=(state.users||[]).find(function(u){return u.username===un&&u.password===pw&&u.active});
  if(!user){if(errEl){errEl.textContent='帳號或密碼錯誤，或帳號已停用';errEl.style.display='block'}return}
  state.currentUser={id:user.id,username:user.username,name:user.name,role:user.role};
  if(user.role==='示範訪客')enterDemoMode();
  _doLoginCommonFlow(un,pw,user.role,user.name);
};

// 🆕 登入後共用流程 (記憶帳密、saveState、套權限、toast)
function _doLoginCommonFlow(un,pw,role,name){
  try{
    var remUser=document.getElementById('login-remember-user');
    var remPass=document.getElementById('login-remember-pass');
    var memory={};
    if(remUser&&remUser.checked)memory.username=un;
    if(remPass&&remPass.checked)memory.password=pw;
    if(memory.username||memory.password){localStorage.setItem('hm_login_memory',JSON.stringify(memory))}
    else{localStorage.removeItem('hm_login_memory')}
  }catch(e){}
  saveState();
  var overlay=document.getElementById('login-overlay');
  if(overlay)overlay.remove();
  applyPermissions();
  addAudit('登入系統',name+' ('+role+')');
  saveState();
  if(role==='示範訪客')setTimeout(applyDemoModeBadge,200);
  renderPage();
  toast(role==='示範訪客'?'📍 已進入示範模式 (虛構資料,可自由試用)':'✅ 歡迎，'+name);
  // 登入後在背景同步 HR accounts cache
  if(role!=='示範訪客')setTimeout(syncHRAccountsCache,1000);
}

// 🆕 密碼雜湊 (與 HR 系統一致)
window.hashPass=function(plain){
  if(!plain)return'';
  var h=0;
  for(var i=0;i<plain.length;i++){var ch=plain.charCodeAt(i);h=((h<<5)-h)+ch;h=h&h}
  return'hm$'+Math.abs(h).toString(36)+'$'+plain.length;
};
window.verifyPass=function(plain,hashed){
  if(!hashed||hashed.indexOf('hm$')!==0)return plain===hashed;  // 舊明碼相容
  return window.hashPass(plain)===hashed;
};

// 🆕 從 HR 系統同步帳號 cache 到 localStorage
window.syncHRAccountsCache=function(){
  if(typeof _fbDb==='undefined'||!_fbDb){
    if(typeof initFirebaseSDK==='function'&&initFirebaseSDK()){/*成功初始化*/}
    else return;
  }
  if(!_fbDb)return;
  try{
    _fbDb.collection('prod_hrdata').doc('accounts').get().then(function(doc){
      if(!doc.exists)return;
      var accounts=(doc.data()||{}).userAccounts||[];
      if(!accounts.length)return;
      localStorage.setItem('hm_hr_accounts_cache',JSON.stringify({accounts:accounts,ts:Date.now()}));
      console.log('🔄 HR accounts 已同步 ('+accounts.length+' 個)');
    }).catch(function(e){console.log('HR accounts 同步失敗:',e.message)});
  }catch(e){}
};

window.doLogout=function(){
  if(!confirm('確定要登出？'))return;
  addAudit('登出系統',(state.currentUser||{}).name||'');
  // 🆕 若離開示範模式,清示範 flag (但保留示範區資料以便下次登入續用)
  var wasDemo=window._isDemoMode||(state.currentUser&&state.currentUser.role==='示範訪客');
  if(wasDemo){
    localStorage.removeItem('hm_erp_demo_active');
    window._isDemoMode=false;
    // 重整頁面回到正式資料 (state.currentUser=null 後 reload 觸發 loadState 載正式區)
    var banner=document.getElementById('demo-mode-banner');if(banner)banner.remove();
    var tb=document.getElementById('topbar');if(tb)tb.style.marginTop='';
    location.reload();
    return;
  }
  state.currentUser=null;
  // 登出時保留帳號記憶但清除密碼記憶（安全考量）
  try{
    var saved=JSON.parse(localStorage.getItem('hm_login_memory')||'{}');
    if(saved.username&&!saved.password){/*保留帳號記憶*/}
    else if(saved.username&&saved.password){/*用戶勾選了記住密碼，保留*/}
    // 若未勾選任何記憶則不處理
  }catch(e){}
  saveState();
  showLoginScreen();
};

window.savePermissions=function(){
  var cbs=document.querySelectorAll('.perm-cb');
  var newPerms={'老闆':[],'店長':[],'員工':[]};
  cbs.forEach(function(cb){
    if(cb.checked){
      var role=cb.getAttribute('data-role');
      var mod=cb.getAttribute('data-mod');
      if(newPerms[role])newPerms[role].push(mod);
    }
  });
  // Ensure 老闆 always has dash/users/ref
  ['dash','users','ref'].forEach(function(m){if(newPerms['老闆'].indexOf(m)<0)newPerms['老闆'].push(m)});
  state.permissions=newPerms;
  addAudit('更新權限設定','');
  saveState();
  applyPermissions();
  closeModal();
  renderPage();
  toast('✅ 權限已更新');
};

window.resetPermsToDefault=function(){
  if(!confirm('確定還原為預設權限？'))return;
  state.permissions=JSON.parse(JSON.stringify(DEFAULT_PERMS));
  saveState();closeModal();
  openPermissionSettings();
  toast('✅ 已還原預設權限');
};

if(!state.cloudConfig)state.cloudConfig={url:'',key:'',enabled:false,lastSync:'',autoSync:false,deviceName:''};
var _supabase=null;
var _cloudSyncing=false;

function initSupabase(){
  var cfg=state.cloudConfig;
  if(!cfg||!cfg.url||!cfg.key||!cfg.enabled)return false;
  try{
    if(typeof window.supabase!=='undefined'&&window.supabase.createClient){
      _supabase=window.supabase.createClient(cfg.url,cfg.key);
      return true;
    }
  }catch(e){console.error('Supabase init error:',e)}
  return false;
}

// 上傳到雲端
window.cloudSave=function(silent){
  if(!initSupabase()){if(!silent)toast('⛔ 雲端未設定或連線失敗','err');return}
  _cloudSyncing=true;
  var deviceName=state.cloudConfig.deviceName||'未命名裝置';
  var payload={
    id:'erp_main',
    data:JSON.parse(JSON.stringify(state)),
    updated_at:new Date().toISOString(),
    device:deviceName
  };
  // Remove circular/sensitive
  delete payload.data.cloudConfig;

  _supabase.from('erp_data').upsert(payload,{onConflict:'id'})
    .then(function(res){
      _cloudSyncing=false;
      if(res.error){
        if(!silent)toast('❌ 雲端儲存失敗：'+res.error.message,'err');
        console.error('Cloud save error:',res.error);
      }else{
        state.cloudConfig.lastSync=new Date().toISOString();
        localStorage.setItem(COST_KEY,JSON.stringify(state));
        if(!silent)toast('✅ 已同步到雲端');
        updateCloudStatus();
      }
    }).catch(function(e){
      _cloudSyncing=false;
      if(!silent)toast('❌ 雲端連線失敗','err');
    });
};

// 從雲端載入
window.cloudLoad=function(silent){
  if(!initSupabase()){if(!silent)toast('⛔ 雲端未設定','err');return}
  _supabase.from('erp_data').select('*').eq('id','erp_main').single()
    .then(function(res){
      if(res.error){
        if(res.error.code==='PGRST116'){if(!silent)toast('☁️ 雲端尚無資料，請先上傳');return}
        if(!silent)toast('❌ 載入失敗：'+res.error.message,'err');return;
      }
      if(!res.data||!res.data.data){if(!silent)toast('☁️ 雲端資料為空');return}
      if(!silent&&!confirm('確定從雲端載入？本機資料將被覆蓋\n\n雲端最後更新：'+(res.data.updated_at||'').slice(0,19).replace('T',' ')+'\n來源裝置：'+(res.data.device||'未知')))return;
      var cloudData=res.data.data;
      var savedConfig=JSON.parse(JSON.stringify(state.cloudConfig));
      Object.keys(cloudData).forEach(function(k){if(k!=='cloudConfig'&&k!=='page')state[k]=cloudData[k]});
      state.cloudConfig=savedConfig;
      state.cloudConfig.lastSync=new Date().toISOString();
      saveState();
      if(!silent)toast('✅ 已從雲端載入');
      renderPage();
    }).catch(function(e){
      if(!silent)toast('❌ 雲端連線失敗','err');
    });
};

window.saveCloudConfig=function(){
  state.cloudConfig.url=($('cloud-url')?$('cloud-url').value:'').trim().replace(/\/$/,'');
  state.cloudConfig.key=($('cloud-key')?$('cloud-key').value:'').trim();
  state.cloudConfig.deviceName=($('cloud-device')?$('cloud-device').value:'').trim();
  state.cloudConfig.autoSync=$('cloud-auto')?$('cloud-auto').value==='1':false;
  state.cloudConfig.enabled=!!(state.cloudConfig.url&&state.cloudConfig.key);
  saveState();
  if(state.cloudConfig.enabled)initSupabase();
  updateCloudStatus();
  toast('✅ 雲端設定已儲存');
};

window.testCloudConnection=function(){
  if(!initSupabase()){toast('⛔ 請先填入 URL 和 Key 並儲存','err');return}

    .then(function(res){
      if(res.error){
        if(statusEl)statusEl.innerHTML='<span style="color:#B82525">❌ 連線失敗：'+esc(res.error.message)+'</span>';

          if(statusEl)statusEl.innerHTML+='<br><span style="color:#9A6210">⚠️ 資料表尚未建立，請先執行上方的 SQL</span>';
        }
      }else{
        var info=res.data&&res.data.length?'有資料（最後裝置：'+(res.data[0].device||'未知')+' / '+((res.data[0].updated_at||'').slice(0,19))+'）':'資料表存在但尚無資料';
        if(statusEl)statusEl.innerHTML='<span style="color:#0A5A46">✅ 連線成功！'+info+'</span>';
        toast('✅ 雲端連線成功');
      }
    }).catch(function(e){
      if(statusEl)statusEl.innerHTML='<span style="color:#B82525">❌ 連線錯誤：'+esc(e.message||'未知錯誤')+'</span>';

};

// Firebase SDK 初始化
var _fbApp=null;var _fbDb=null;
function initFirebaseSDK(){
  if(_fbDb)return true;
  var cfg=state.cloudConfig;
  if(!cfg||!cfg.fbApiKey||!cfg.fbProjectId)return false;
  try{
    var fbConfig={apiKey:cfg.fbApiKey,authDomain:cfg.fbAuthDomain||'',projectId:cfg.fbProjectId,storageBucket:cfg.fbStorageBucket||'',messagingSenderId:cfg.fbMessagingSenderId||'',appId:cfg.fbAppId||''};
    if(!firebase.apps.length){_fbApp=firebase.initializeApp(fbConfig)}else{_fbApp=firebase.apps[0]}
    _fbDb=firebase.firestore();
    _fbDb.settings&&_fbDb.settings({cacheSizeBytes:firebase.firestore.CACHE_SIZE_UNLIMITED});
    try{_fbDb.enablePersistence({synchronizeTabs:true})}catch(e){}
    return true;
  }catch(e){console.error('Firebase SDK init error:',e);return false}
}

window.firebaseSave=function(silent){
  if(!initFirebaseSDK()){if(!silent)toast('⛔ Firebase 未設定或初始化失敗','err');return}
  var stateClone=JSON.parse(JSON.stringify(state));
  delete stateClone.cloudConfig;
  _fbDb.collection('erp').doc('state').set({
    data:stateClone,
    updated_at:firebase.firestore.FieldValue.serverTimestamp(),
    device:state.cloudConfig.deviceName||'未命名'
  }).then(function(){
    state.cloudConfig.lastSync=new Date().toISOString();localStorage.setItem(COST_KEY,JSON.stringify(state));
    if(!silent)toast('✅ 已同步到 Firestore');updateCloudStatus();
    _writeSharedData(stateClone);
  }).catch(function(e){if(!silent)toast('❌ Firestore 儲存失敗：'+e.message,'err')});
};

window.firebaseLoad=function(silent){
  if(!initFirebaseSDK()){if(!silent)toast('⛔ Firebase 未設定','err');return}
  _fbDb.collection('erp').doc('state').get()
    .then(function(doc){
      if(!doc.exists||!doc.data()||!doc.data().data){if(!silent)toast('☁️ Firestore 尚無資料');return}
      var res=doc.data();
      var ts=res.updated_at?res.updated_at.toDate().toISOString().slice(0,19).replace('T',' '):'未知';

      var saved=JSON.parse(JSON.stringify(state.cloudConfig));

      state.cloudConfig=saved;state.cloudConfig.lastSync=new Date().toISOString();
      // 🆕 雲端載入後自動跑 migrate (補新單位/型態)

};

// --- JSONBin.io ---
window.jsonbinSave=function(silent){
  var cfg=state.cloudConfig;if(!cfg||cfg.provider!=='jsonbin'||!cfg.jbKey)return;
  var payload={data:JSON.parse(JSON.stringify(state)),updated_at:new Date().toISOString(),device:cfg.deviceName||'未命名'};
  delete payload.data.cloudConfig;
  var headers={'Content-Type':'application/json','X-Master-Key':cfg.jbKey};
  var url=cfg.jbBinId?'https://api.jsonbin.io/v3/b/'+cfg.jbBinId:'https://api.jsonbin.io/v3/b';
  var method=cfg.jbBinId?'PUT':'POST';
  if(!cfg.jbBinId)headers['X-Bin-Name']='haomin-system';
  fetch(url,{method:method,headers:headers,body:JSON.stringify(payload)})
    .then(function(r){return r.json()}).then(function(res){
      if(res.metadata&&res.metadata.id&&!cfg.jbBinId){state.cloudConfig.jbBinId=res.metadata.id}
      state.cloudConfig.lastSync=new Date().toISOString();localStorage.setItem(COST_KEY,JSON.stringify(state));
      if(!silent)toast('✅ 已同步到 JSONBin');updateCloudStatus();

};

window.restoreAutoBackup=function(key){
  try{
    var raw=localStorage.getItem(key);
    if(!raw){toast('❌ 備份不存在','err');return}
    var backup=JSON.parse(raw);
    if(!backup.data||!backup.data.ings){toast('❌ 備份資料異常','err');return}
    var date=key.replace('hm_autobackup_','');
    if(!confirm('確定還原到 '+date+' 的備份？\n\n⚠️ 目前資料將被覆蓋\n（建議先點「📸 立即備份」保存目前狀態）'))return;
    
    var savedCloud=JSON.parse(JSON.stringify(state.cloudConfig||{}));
    var savedUsers=JSON.parse(JSON.stringify(state.users||[]));
    
    Object.keys(backup.data).forEach(function(k){
      if(k!=='cloudConfig'&&k!=='page')state[k]=backup.data[k];
    });
    state.cloudConfig=savedCloud;
    if(!state.users||!state.users.length)state.users=savedUsers;
    
    saveState();
    addAudit('還原自動備份',date);
    saveState();
    closeModal();
    renderPage();
    toast('✅ 已還原到 '+date+' 的備份');
  }catch(e){toast('❌ 還原失敗：'+e.message,'err')}
};

window.downloadAutoBackup=function(key,date){
  try{
    var raw=localStorage.getItem(key);
    if(!raw){toast('❌ 備份不存在','err');return}
    var blob=new Blob([raw],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='好洺ERP自動備份_'+date+'.json';
    a.click();
    toast('✅ 備份已下載');
  }catch(e){toast('❌ 下載失敗','err')}
};

window.manualAutoBackup=function(){
  var key='hm_autobackup_'+toDay()+'_'+new Date().toISOString().slice(11,19).replace(/:/g,'');
  try{
    localStorage.setItem(key,JSON.stringify({ts:new Date().toISOString(),data:state}));
    addAudit('手動備份','');
    saveState();
    toast('✅ 備份完成');
    closeModal();
    openBackupManager();
  }catch(e){toast('❌ 備份失敗（空間不足）','err')}
};

window.clearAutoBackups=function(){
  if(!confirm('確定清除所有自動備份？'))return;
  if(!confirm('再次確認：此操作不可逆'))return;
  var count=0;
  var keys=[];
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.startsWith('hm_autobackup_'))keys.push(k);
  }
  keys.forEach(function(k){localStorage.removeItem(k);count++});
  toast('✅ 已清除 '+count+' 份自動備份');
  closeModal();
  openBackupManager();
};

// ↩️ 上一步 / 下一步（Undo / Redo）
// ══════════════════════════════════════════════════════
var _undoStack=[];
var _redoStack=[];
var _maxUndo=30;
var _undoLock=false;

function pushUndo(){
  if(_undoLock)return;
  try{
    var snap=JSON.stringify(state);
    if(_undoStack.length>0&&_undoStack[_undoStack.length-1]===snap)return;
    _undoStack.push(snap);
    if(_undoStack.length>_maxUndo)_undoStack.shift();
    _redoStack=[];
    updateUndoBtns();
  }catch(e){}
}

window.doUndo=function(){
  if(_undoStack.length<2){toast('已到最早狀態');return}
  _undoLock=true;
  try{
    var current=_undoStack.pop();
    _redoStack.push(current);
    var prev=_undoStack[_undoStack.length-1];
    var restored=JSON.parse(prev);
    var savedCloud=JSON.parse(JSON.stringify(state.cloudConfig||{}));
    var savedPage=state.page;
    Object.keys(restored).forEach(function(k){
      if(k!=='cloudConfig'&&k!=='page'&&k!=='currentUser')state[k]=restored[k];
    });
    state.cloudConfig=savedCloud;
    state.page=savedPage;
    localStorage.setItem(COST_KEY,JSON.stringify(state));
    renderPage();
    updateUndoBtns();
    toast('↩️ 已復原上一步');
  }catch(e){toast('復原失敗','err')}
  _undoLock=false;
};

window.doRedo=function(){
  if(!_redoStack.length){toast('已到最新狀態');return}
  _undoLock=true;
  try{
    var next=_redoStack.pop();
    _undoStack.push(next);
    var restored=JSON.parse(next);
    var savedCloud=JSON.parse(JSON.stringify(state.cloudConfig||{}));
    var savedPage=state.page;
    Object.keys(restored).forEach(function(k){
      if(k!=='cloudConfig'&&k!=='page'&&k!=='currentUser')state[k]=restored[k];
    });
    state.cloudConfig=savedCloud;
    state.page=savedPage;
    localStorage.setItem(COST_KEY,JSON.stringify(state));
    renderPage();
    updateUndoBtns();
    toast('↪️ 已重做下一步');
  }catch(e){toast('重做失敗','err')}
  _undoLock=false;
};

function updateUndoBtns(){
  var ub=document.getElementById('undo-btn');
  var rb=document.getElementById('redo-btn');
  var ct=document.getElementById('undo-count');
  if(ub)ub.style.opacity=_undoStack.length>1?'1':'0.35';
  if(rb)rb.style.opacity=_redoStack.length>0?'1':'0.35';
  if(ct)ct.textContent=(_undoStack.length-1)+'/'+_maxUndo;
}

// Ctrl+Z / Ctrl+Y keyboard shortcuts
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();doUndo()}
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();doRedo()}
});

function buildExcelSheet(key,data){
  if(typeof XLSX==='undefined')return null;
  var catDef=getCatDef(key);
  if(!catDef)return null;
  var cols=catDef.cols;
  
  // Build AOA (Array of Arrays) for full control
  var aoa=[];
  // Row 0: Chinese headers
  aoa.push(cols.map(function(c){return c.n}));
  // Row 1: English keys (grey background, for import mapping)
  aoa.push(cols.map(function(c){return c.k}));
  // Data rows
  (data||[]).forEach(function(item){
    aoa.push(cols.map(function(c){
      var val=item[c.k];
      if(typeof val==='object'&&val!==null)return JSON.stringify(val);
      if(val===undefined||val===null)return '';
      return val;
    }));
  });
  
  // Add empty rows for new data entry (up to row 60)
  var totalRows=Math.max(aoa.length,60);
  while(aoa.length<totalRows)aoa.push(cols.map(function(){return ''}));
  
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  
  // Column widths
  ws['!cols']=cols.map(function(c){
    var w=Math.max(c.n.length*2+2,8);
    if(c.k==='name'||c.k==='itemName'||c.k==='addr'||c.k==='items'||c.k==='note')w=22;
    if(c.k==='id')w=8;
    if(c.k==='phone')w=16;
    return{wch:w};
  });
  
  return ws;
}

function addDataValidations(wb,sheetName,catDef){
  var ws=wb.Sheets[sheetName];
  if(!ws||!catDef)return;
  
  // Map dd keys to options sheet column letters
  var optWs=wb.Sheets['選項清單'];
  if(!optWs)return;
  var optHeaders=[];
  var optRange=XLSX.utils.decode_range(optWs['!ref']||'A1');
  for(var c=optRange.s.c;c<=optRange.e.c;c++){
    var cell=optWs[XLSX.utils.encode_cell({r:0,c:c})];
    if(cell)optHeaders.push({col:c,name:cell.v||''});
  }
  
  var ddMap={
    'supTypes':'supTypes','payTerms':'payTerms','cats':'cats','units':'units',
    'forms':'forms','lossReasons':'lossReasons','lossHandles':'lossHandles',
    '_stores':'_stores'
  };
  var listMap={
    '申請中,已核准,已下單,已到貨,已取消':'採購狀態',
    '未付款,已付款':'帳款狀態',
    '庫存中,使用中,已用完':'批次狀態',
    '合約,報價單':'合約類型',
    '有效,草稿,已到期':'合約狀態',
    '外觀/包裝完整,溫度合規,效期確認,數量核對,氣味/色澤,重量抽驗,全項檢驗':'品管項目',
    '合格,條件合格,不合格':'品管結果',
    '待確認,已完成,已取消':'調撥狀態',
    '06:00-09:00 早班,09:00-12:00 上午,13:00-17:00 下午,17:00-21:00 晚班':'排程時段',
    '待生產,生產中,已完成,已取消':'排程狀態',
    '老闆,店長,員工':'角色',
    'true,false':'啟用',
    '食材,包材':'門市庫存類別',
    '批發,零售':'來源',
    'CCP1-原料驗收,CCP2-冷藏溫度,CCP3-烹調中心溫度,CCP4-冷卻速度,CCP5-成品保存,CCP6-運輸溫度':'HACCP管制點',
    '符合,偏離,不符合':'HACCP判定'
  };
  
  var validations=[];
  catDef.cols.forEach(function(col,colIdx){
    var optColName=null;
    if(col.dd){optColName=ddMap[col.dd]||col.dd}
    else if(col.ddList){
      var joinedKey=col.ddList.join(',');
      optColName=listMap[joinedKey];
    }
    if(!optColName)return;
    
    // Find the column in options sheet
    var optCol=optHeaders.find(function(h){return h.name===optColName});
    if(!optCol)return;
    
    // Count how many values in that column
    var valCount=0;
    for(var r=1;r<=50;r++){
      var cell=optWs[XLSX.utils.encode_cell({r:r,c:optCol.col})];
      if(cell&&cell.v)valCount=r;
    }
    if(!valCount)return;
    
    var optColLetter=XLSX.utils.encode_col(optCol.col);
    var dataColLetter=XLSX.utils.encode_col(colIdx);
    
    // Add validation for rows 3-60 (skip header rows 1-2)
    validations.push({
      sqref:dataColLetter+'3:'+dataColLetter+'60',
      type:'list',
      formula1:'選項參考!$'+optColLetter+'$2:$'+optColLetter+'$'+(valCount+1)
    });
  });
  
  if(validations.length)ws['!dataValidation']=validations;
}

function _ddSetName(c){if(c.dd)return 'dd_'+c.dd;if(c.ddList&&c.ddList.length)return 'list_'+c.ddList.join('|');return null}
// 規劃下拉選項：收集這批表單用到的所有下拉集合(去重)，回傳欄位配置(不建工作表)
function _planOptions(keys){var sets={},order=[];keys.forEach(function(key){var def=getCatDef(key);if(!def)return;def.cols.forEach(function(c){var nm=_ddSetName(c);if(!nm||sets[nm])return;var vals=(c.dd?getDropdownValues(c.dd):c.ddList)||[];vals=vals.filter(function(v){return v!==undefined&&v!==null&&v!==''}).map(function(v){return String(v)});if(!vals.length)return;sets[nm]=vals;order.push(nm)})});var meta={};order.forEach(function(nm,idx){meta[nm]={col:idx+1,len:sets[nm].length}});return{meta:meta,order:order,sets:sets}}
// 把選項集合寫成一張「選項」工作表(供下拉公式參照，也供人對照)
function _writeOptionsWS(wb,plan){if(!plan.order.length)return;var ws=wb.addWorksheet('選項');plan.order.forEach(function(nm,idx){var label=nm.indexOf('dd_')===0?nm.slice(3):nm.slice(5).replace(/\|/g,'/');var hc=ws.getCell(1,idx+1);hc.value=label;hc.font={bold:true,color:{argb:'FF4C4948'}};hc.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF6CE37'}};plan.sets[nm].forEach(function(v,r){ws.getCell(r+2,idx+1).value=v});ws.getColumn(idx+1).width=18});ws.views=[{state:'frozen',ySplit:1}]}
// 建立單一資料工作表（中文表頭 + 英文key + 資料 + 範例列 + 下拉 + 凍結）
function _buildDataWS(wb,key,data,plan){var def=getCatDef(key);if(!def)return false;var cols=def.cols;var ws=wb.addWorksheet((SHEET_CN[key]||key).slice(0,31));
  ws.addRow(cols.map(function(c){return c.n}));
  ws.addRow(cols.map(function(c){return c.k}));
  var hasData=!!(data&&data.length);
  (data||[]).forEach(function(item){ws.addRow(cols.map(function(c){var v=item[c.k];if(typeof v==='object'&&v!==null)return JSON.stringify(v);if(v===undefined||v===null)return '';return v}))});
  // 範例列(僅當無資料時)：編號=範例-請刪除，匯入會自動忽略
  if(!hasData){ws.addRow(cols.map(function(c){if(c.k==='id')return '範例-請刪除';if(c.ddList&&c.ddList.length)return c.ddList[0];if(c.dd){var vv=getDropdownValues(c.dd);return(vv&&vv[0])||''}if(c.k==='date'||/Date$/.test(c.k))return toDay();if(['name','itemName','ingName','recipeName'].indexOf(c.k)>=0)return '範例品名(可刪)';return ''}))}
  // 樣式
  ws.getRow(1).eachCell(function(cell){cell.font={bold:true,color:{argb:'FF4C4948'}};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF6CE37'}};cell.alignment={horizontal:'center',vertical:'middle'};cell.border={bottom:{style:'thin',color:{argb:'FFCCCCCC'}}}});
  ws.getRow(2).eachCell(function(cell){cell.font={italic:true,size:9,color:{argb:'FF999999'}};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF0F0F0'}}});
  ws.views=[{state:'frozen',ySplit:2}];
  // 欄寬
  cols.forEach(function(c,i){var w=Math.max(String(c.n).length*2+4,9);if(['name','itemName','ingName','addr','items','note','sourceItems','recipeName'].indexOf(c.k)>=0)w=24;if(c.k==='id')w=14;ws.getColumn(i+1).width=w});
  // 下拉(資料驗證)：套到第3列~預留列
  if(plan&&plan.order.length){var endRow=Math.max(300,(hasData?data.length:0)+60)+2;cols.forEach(function(c,i){var nm=_ddSetName(c);if(!nm||!plan.meta[nm]||!plan.meta[nm].len)return;var ol=_xlColLetter(plan.meta[nm].col-1);var formula="'選項'!$"+ol+"$2:$"+ol+"$"+(plan.meta[nm].len+1);var dl=_xlColLetter(i);var rng=dl+'3:'+dl+endRow;var model={type:'list',allowBlank:true,showErrorMessage:false,formulae:[formula]};try{ws.dataValidations.add(rng,model)}catch(e){try{for(var rr=3;rr<=endRow;rr++){ws.getCell(dl+rr).dataValidation=model}}catch(e2){}}})}
  return true}
function _downloadExcelJS(wb,fname){return wb.xlsx.writeBuffer().then(function(buf){var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1500)})}

window.importExcelFile=function(input){
  if(!input.files||!input.files[0])return;
  if(typeof XLSX==='undefined'){toast('⛔ XLSX 函式庫未載入','err');return}
  var file=input.files[0];
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var validKeys=['sups','ings','storeInv','buyLog','recipes','menu','waste','poList','apList','batchList','contracts','qcRecords','equipment','transfers','prodLog','prodSchedule','users','haccpLogs','internalProducts','internalOrders','arList','countList','returnList','workOrders','customers','custOrders','assets','salesData'];
      var imported=[];var skipped=[];
      // 🛡 防呆：匯入前確認「整批取代」
      var _affected=[];
      wb.SheetNames.forEach(function(nm){var sk=SHEET_EN[nm]||nm;if(validKeys.indexOf(sk)>=0)_affected.push('・'+(SHEET_CN[sk]||sk)+'（目前 '+((state[sk]||[]).length)+' 筆 → 整批取代）')});
      if(_affected.length){if(!confirm('⚠️ 匯入會「整批取代」以下類別的全部資料：\n\n'+_affected.join('\n')+'\n\n（編號為「範例」的列會自動忽略）\n\n確定要匯入嗎？')){input.value='';return}}
      
      wb.SheetNames.forEach(function(origName){
        // origName = Excel 工作表名稱(中文或英文皆可),用於拿 wb.Sheets[]
        // stateKey = 對應到 state 內部欄位的英文 key,用於 state[stateKey]=data
        var stateKey=SHEET_EN[origName]||origName;
        if(validKeys.indexOf(stateKey)<0){skipped.push(origName);return}
        var ws=wb.Sheets[origName];
        if(!ws){skipped.push(origName+' (找不到工作表)');return}
        var rawData=XLSX.utils.sheet_to_json(ws,{header:1});
        if(rawData.length<3){skipped.push(origName+' (不足3行)');return}

        // Row 0 = Chinese headers, Row 1 = English keys, Row 2+ = data
        var cnHeaders=rawData[0];
        var enKeys=rawData[1];

        // Validate: check if row 2 looks like English keys
        var isNewFormat=enKeys&&enKeys.some&&enKeys.some(function(k){return typeof k==='string'&&/^[a-zA-Z]/.test(k)});

        var data;
        if(isNewFormat){
          // New format: row 1=cn, row 2=en keys, row 3+=data
          data=[];
          for(var r=2;r<rawData.length;r++){
            var row={};var hasValue=false;
            enKeys.forEach(function(key,i){
              if(!key)return;
              var val=rawData[r]?rawData[r][i]:undefined;
              if(val!==undefined&&val!==null&&val!==''){hasValue=true}
              row[key]=val!==undefined?val:'';
            });
            if(hasValue)data.push(row);
          }
        }else{
          // Legacy format: row 1=keys, row 2+=data (fallback)
          data=XLSX.utils.sheet_to_json(ws);
        }

        if(!data.length){skipped.push(origName+' (空)');return}

        // 🛡 防呆：自動忽略範例列（編號以「範例」開頭）
        data=data.filter(function(row){return String(row.id!=null?row.id:'').indexOf('範例')!==0});
        if(!data.length){skipped.push(origName+' (僅範例列,略過)');return}

        // Parse JSON strings, auto-generate IDs
        data=data.map(function(row){
          Object.keys(row).forEach(function(k){
            if(typeof row[k]==='string'&&(row[k].startsWith('[')||row[k].startsWith('{'))){
              try{row[k]=JSON.parse(row[k])}catch(e){}
            }
            // Convert 'true'/'false' strings
            if(row[k]==='true')row[k]=true;
            if(row[k]==='false')row[k]=false;
          });
          if(!row.id||String(row.id).trim()===''){
            var prefix=stateKey==='sups'?'S':stateKey==='ings'?'I':stateKey==='users'?'U':'';
            if(prefix){row.id=nxtId(data.filter(function(r){return r.id}),prefix)}
            else{row.id=stateKey.slice(0,2).toUpperCase()+Date.now()+Math.random().toString(36).slice(2,5)}
          }
          return row;
        });

        state[stateKey]=data;
        imported.push((SHEET_CN[stateKey]||stateKey)+' ('+data.length+'筆)');
      });
      
      if(imported.length){
        saveState();renderPage();closeModal();
        var msg='✅ 匯入成功：\n'+imported.join('\n');
        if(skipped.length)msg+='\n\n跳過：'+skipped.join(', ');
        alert(msg);toast('✅ 已匯入 '+imported.length+' 個類別');
      }else{
        alert('⚠️ 未找到可匯入的資料\n\n工作表名稱須為（中文或英文皆可）：\n'+validKeys.map(function(k){return(SHEET_CN[k]||k)+' ('+k+')'}).join(', ')+'\n\n目前工作表：'+wb.SheetNames.join(', '));
      }
    }catch(err){toast('❌ 匯入失敗：'+err.message,'err')}
    input.value='';
  };
  reader.readAsArrayBuffer(file);
};



// 固形物成本計算
function getSolidPrice(ing){
  if(!ing.totalWeight||!ing.solidWeight||!ing.price)return ing.price||0;
  var solidRatio=ing.solidWeight/ing.totalWeight;
  return ing.price/solidRatio;
}
function getSolidRatio(ing){
  if(!ing.totalWeight||!ing.solidWeight)return 1;
  return ing.solidWeight/ing.totalWeight;
}

window._buildZhuyinMap=function(){
  if(window._zyMap)return window._zyMap;
  var map={};
  Object.keys(ZHUYIN_GROUPS).forEach(function(ini){
    ZHUYIN_GROUPS[ini].split('').forEach(function(ch){if(ch&&ch!=='('&&ch!==')'&&ch!=='n'&&ch!=='o')map[ch]=ini});
  });
  window._zyMap=map;return map;
};
// 🆕 通用注音+關鍵字比對 (給所有功能列表搜尋用)
window.zhuyinMatch=function(text,kw){
  if(!kw)return true;
  kw=String(kw).trim();if(!kw)return true;
  text=String(text||'');
  if(text.toLowerCase().indexOf(kw.toLowerCase())>=0)return true;
  // 注音首字母 (kw 含注音聲母 ㄅ-ㄙ)
  if(/[\u3105-\u3119]/.test(kw)){
    var zyMap=window._buildZhuyinMap();
    for(var i=0;i<text.length;i++){var ini=zyMap[text[i]];if(ini&&kw.indexOf(ini)>=0)return true}
  }
  return false;
};

// 列表內容渲染 (含多層排序 + 搜尋過濾)
window._renderIPListBody=function(prods,kw){
  // 過濾
  var filtered=prods.filter(function(p){return window.matchIPSearch(p,kw)});
  if(!prods.length)return '<div style="text-align:center;color:#706E68;padding:20px">尚無轉售品項</div>';
  if(!filtered.length)return '<div style="text-align:center;color:#706E68;padding:20px">查無符合「'+esc(kw)+'」的品項</div>';
  
  // 多層排序:1.分類(食材→包材) 2.完成狀態(完成→未完成) 3.供應商分組 4.品名
  var catOrder={'食材':0,'包材':1};
  filtered.sort(function(a,b){
    var ca=catOrder[a.category]==null?0:catOrder[a.category];
    var cb=catOrder[b.category]==null?0:catOrder[b.category];
    if(ca!==cb)return ca-cb;  // 食材在前
    var doneA=window.isIPComplete(a)?0:1,doneB=window.isIPComplete(b)?0:1;
    if(doneA!==doneB)return doneA-doneB;  // 已完成在前
    var supA=a.supplier||'zzz',supB=b.supplier||'zzz';
    if(supA!==supB)return supA.localeCompare(supB);  // 同供應商相鄰
    return (a.name||'').localeCompare(b.name||'');
  });
  
  var html='<div style="overflow-x:auto;max-height:440px;overflow-y:auto"><table class="tbl"><thead style="position:sticky;top:0;background:#fff;z-index:1"><tr><th>分類</th><th>品名</th><th>類型</th><th>供應商</th><th>規格</th><th>成本</th><th>售價</th><th>加成%</th><th>狀態</th><th>操作</th></tr></thead><tbody>';
  var lastGroup='';
  filtered.forEach(function(p){
    var markup=p.cost>0?Math.round((p.sellPrice-p.cost)/p.cost*100):0;
    var supName='—';if(p.supplier){var s=(state.sups||[]).find(function(x){return x.id===p.supplier});if(s)supName=s.name}
    var done=window.isIPComplete(p);
    var cat=p.category||'食材';
    // 分組標題 (分類 + 完成狀態變化時插入)
    var groupKey=cat+'|'+(done?'完成':'未完成');
    var groupRow='';
    if(groupKey!==lastGroup){
      lastGroup=groupKey;
      var catColor=cat==='包材'?'#9A6210':'#0A5A46';
      groupRow='<tr style="background:#F3F1EB"><td colspan="10" style="font-weight:700;font-size:0.82rem;color:'+catColor+';padding:6px 10px">'+(cat==='包材'?'📦 包材':'🥬 食材')+' · '+(done?'✅ 已完成':'⏳ 未完成')+'</td></tr>';
    }
    var catBadge=cat==='包材'?'<span class="badge badge-warn">包材</span>':'<span class="badge badge-green">食材</span>';
    var typeBadge='<span class="badge '+(p.type==='加工品'?'badge-warn':p.type==='分裝品'?'badge-blue':'badge-gray')+'">'+esc(p.type||'')+'</span>';
    var statusBadge=done?'<span style="color:#0A5A46;font-weight:700;font-size:0.8rem">✅ 完成</span>':'<span style="color:#B82525;font-weight:700;font-size:0.8rem">⏳ 待補</span>';
    html+=groupRow+'<tr id="ip-row-'+esc(p.id)+'"><td>'+catBadge+'</td><td style="font-weight:700">'+esc(p.name)+'</td><td>'+typeBadge+'</td><td style="font-size:0.82rem">'+esc(supName)+'</td><td style="font-size:0.84rem">'+esc(p.spec||'—')+'</td><td>'+CUR()+fmt(p.cost,1)+'</td><td style="font-weight:700;color:#7A4D0B">'+CUR()+fmt(p.sellPrice,1)+'</td><td style="color:#0A5A46;font-weight:700">+'+markup+'%</td><td>'+statusBadge+'</td><td><div style="display:flex;gap:4px"><button class="btn btn-sm btn-outline" onclick="openInternalProductModal(\''+p.id+'\')">編輯</button><button class="btn btn-sm btn-danger" onclick="delInternalProduct(\''+p.id+'\')">刪除</button></div></td></tr>';
  });
  html+='</tbody></table></div>';
  html+='<div style="font-size:0.72rem;color:#999;margin-top:6px">共 '+filtered.length+' 項'+(kw?' (已過濾)':'')+' ｜ 排序:食材→包材,已完成→未完成,同供應商相鄰</div>';
  return html;
};

window.calcIPMarkup=function(){var cost=+($('ip-cost')?$('ip-cost').value:0)||0;var sell=+($('ip-sell')?$('ip-sell').value:0)||0;var el=$('ip-margin');if(!el)return;if(!cost){el.textContent='請填入成本';return}var markup=Math.round((sell-cost)/cost*100);var margin=sell>0?Math.round((sell-cost)/sell*100):0;el.innerHTML='加成 <b>+'+markup+'%</b> ｜ 毛利率 <b>'+margin+'%</b> ｜ 每單位利潤 <b>'+CUR()+fmt(sell-cost,1)+'</b>'};

// 🆕 依加成定價:售價 = 成本 × (1 + 加成率/100),同時顯示對應毛利率
window.calcIPSuggestPrice=function(){
  var cost=+($('ip-cost')?$('ip-cost').value:0)||0;
  var mk=+($('ip-target-markup')?$('ip-target-markup').value:0)||0;
  var el=$('ip-suggest-price');
  if(!el)return;
  if(cost<=0){el.textContent='（請先填成本）';el.style.color='#999';return}
  if(mk<=0){el.textContent='（加成率需 >0）';el.style.color='#B82525';return}
  var sug=cost*(1+mk/100);
  var margin=Math.round(mk/(1+mk/100));  // 加成→對應毛利率
  el.innerHTML='→ 建議售價 <b>'+CUR()+fmt(sug,0)+'</b> <span style="font-size:0.82rem;color:#9A6210">(毛利率 '+margin+'%)</span>';
  el.style.color='#0A5A46';
};
window.setIPMarkup=function(m){var el=$('ip-target-markup');if(el){el.value=m;calcIPSuggestPrice()}};
window.applyIPSuggestPrice=function(){
  var cost=+($('ip-cost')?$('ip-cost').value:0)||0;
  var mk=+($('ip-target-markup')?$('ip-target-markup').value:0)||0;
  if(cost<=0){alert('請先填入成本');return}
  if(mk<=0){alert('加成率需大於 0');return}
  var sug=Math.round(cost*(1+mk/100));
  var sellEl=$('ip-sell');
  if(sellEl){sellEl.value=sug;calcIPMarkup()}
  if(typeof toast==='function')toast('✅ 已套用建議售價 '+CUR()+sug+' (加成 '+mk+'%)');
};

window.refreshStoreCostReport=function(){
var el=$('scr-content');if(!el)return;
var mon=$('scr-mon')?$('scr-mon').value:toMon();
var orders=(state.internalOrders||[]).filter(function(o){return o.date&&o.date.startsWith(mon)&&o.status!=='已取消'});
var stores=state.meta.stores||['交大店','竹北店','台積電店'];

var html='<div style="display:grid;grid-template-columns:repeat('+stores.length+',1fr);gap:8px;margin:14px 0">';
stores.forEach(function(store){
  var so=orders.filter(function(o){return o.store===store});
  var rev=so.reduce(function(s,o){return s+(o.totalAmt||0)},0);
  var cost=so.reduce(function(s,o){return s+(o.totalCost||0)},0);
  html+='<div class="metric"><div class="metric-label">'+esc(store)+'</div><div class="metric-val" style="font-size:1.1rem">'+CUR()+fmt(rev,0)+'</div><div class="metric-sub">成本'+CUR()+fmt(cost,0)+' / '+so.length+'單</div></div>';
});
html+='</div>';

// Detail by product
var productTotals={};
orders.forEach(function(o){(o.items||[]).forEach(function(it){
  var key=it.name+'|'+o.store;
  if(!productTotals[key])productTotals[key]={name:it.name,store:o.store,qty:0,cost:0,sell:0};
  productTotals[key].qty+=it.qty;
  productTotals[key].cost+=it.subtotalCost;
  productTotals[key].sell+=it.subtotalSell;
})});

var rows=Object.values(productTotals).sort(function(a,b){return b.sell-a.sell});
if(rows.length){
html+='<table class="tbl"><thead><tr><th>品名</th><th>門市</th><th>總數量</th><th>總成本</th><th>總售額</th><th>毛利</th></tr></thead><tbody>';
rows.forEach(function(r){
  var margin=r.sell>0?Math.round((r.sell-r.cost)/r.sell*100):0;
  html+='<tr><td style="font-weight:700">'+esc(r.name)+'</td><td>'+esc(r.store)+'</td><td>'+fmt(r.qty,1)+'</td><td>'+CUR()+fmt(r.cost,0)+'</td><td style="font-weight:700;color:#7A4D0B">'+CUR()+fmt(r.sell,0)+'</td><td style="color:'+(margin>=0?'#0A5A46':'#B82525')+';font-weight:700">'+CUR()+fmt(r.sell-r.cost,0)+' ('+margin+'%)</td></tr>';
});
var totalCost=rows.reduce(function(s,r){return s+r.cost},0);
var totalSell=rows.reduce(function(s,r){return s+r.sell},0);
html+='<tr style="border-top:2px solid #1E1E1C;font-weight:700"><td colspan="3">合計</td><td>'+CUR()+fmt(totalCost,0)+'</td><td style="color:#7A4D0B">'+CUR()+fmt(totalSell,0)+'</td><td style="color:#0A5A46">'+CUR()+fmt(totalSell-totalCost,0)+' ('+Math.round((totalSell-totalCost)/totalSell*100)+'%)</td></tr>';
html+='</tbody></table>'}
else{html+='<div style="text-align:center;color:#706E68;padding:20px">'+mon+' 尚無出貨資料</div>'}

el.innerHTML=html};

window.calcCountDiff=function(inp,idx,cid){var c=(state.countList||[]).find(function(x){return x.id===cid});if(!c)return;
var act=parseFloat(inp.value);c.items[idx].actQty=isNaN(act)?null:act;c.items[idx].diff=isNaN(act)?0:act-c.items[idx].sysQty;
var el=document.querySelector('.ct-diff-'+idx);if(el){var d=c.items[idx].diff;el.innerHTML=d>0?'<span style="color:#0A5A46">+'+fmt(d,2)+'</span>':d<0?'<span style="color:#B82525">'+fmt(d,2)+'</span>':'—'}saveState()};

window.submitCount=function(id){var c=(state.countList||[]).find(function(x){return x.id===id});if(!c)return;
var unfilled=c.items.filter(function(i){return i.actQty===null}).length;
if(unfilled>0&&!confirm('有 '+unfilled+' 項未填，確定提交？'))return;
c.status='待核准';addAudit('提交盤點',c.items.length+'項');saveState();closeModal();renderPage();toast('✅ 盤點已提交')};

window.receivePO=function(poId){var p=(state.poList||[]).find(function(x){return x.id===poId});if(!p)return;
if(!confirm('確認「'+p.itemName+'」已收貨？\n\n將自動：\n1. 建立進貨記錄\n2. 建立應付帳款\n3. 更新採購單狀態'))return;

// 建立應付帳款

window.showReorderSuggestion=function(){var ings=state.ings||[];
var suggestions=ings.filter(function(i){return i.stock<=i.safety*1.2}).map(function(i){
  var sup=(state.sups||[]).find(function(s){return s.id===i.sup});
  var avgDaily=i.safety>0?i.safety/7:1;
  var leadDays=sup?sup.days||3:3;
  var sugQty=Math.ceil((i.safety*2-i.stock)+avgDaily*leadDays);
  return{id:i.id,name:i.name,unit:i.unit,stock:i.stock,safety:i.safety,price:i.price,sup:sup?sup.name:'未指定',leadDays:leadDays,sugQty:Math.max(sugQty,1),sugAmt:Math.max(sugQty,1)*i.price}
}).sort(function(a,b){return a.stock/a.safety-b.stock/b.safety});
var html=mH('📦 訂購建議');
if(!suggestions.length){html+='<div style="text-align:center;padding:24px;color:#0A5A46">✅ 所有食材庫存充足，目前不需要補貨</div>'}
else{var totalAmt=suggestions.reduce(function(s,i){return s+i.sugAmt},0);
html+='<div style="margin-bottom:12px;font-size:0.88rem;color:#706E68">共 '+suggestions.length+' 項需補貨，建議採購金額 <b style="color:#B82525">'+CUR()+fmt(totalAmt,0)+'</b></div>';
html+='<div style="max-height:400px;overflow-y:auto"><table class="tbl"><thead><tr><th>食材</th><th>現有</th><th>安全量</th><th>建議訂購</th><th>供應商</th><th>交期</th><th>預估金額</th><th>操作</th></tr></thead><tbody>';
suggestions.forEach(function(i){var pct=i.safety>0?Math.round(i.stock/i.safety*100):0;
html+='<tr><td style="font-weight:700">'+esc(i.name)+'</td><td style="color:'+(pct<=50?'#B82525':'#9A6210')+';font-weight:700">'+fmt(i.stock,1)+' '+esc(i.unit)+'</td><td>'+fmt(i.safety,0)+'</td><td style="font-weight:700;color:#0A5A46">'+fmt(i.sugQty,0)+' '+esc(i.unit)+'</td><td>'+esc(i.sup)+'</td><td>'+i.leadDays+'天</td><td>'+CUR()+fmt(i.sugAmt,0)+'</td><td><button class="btn btn-sm btn-primary" onclick="createPOFromSug(\''+i.id+'\','+i.sugQty+')">建立採購</button></td></tr>'});
html+='</tbody></table></div>'}

function renderCostAnalysis(){var pg=dv({});var sw=sopBox('cost-analysis');if(sw)pg.appendChild(sw);
pg.appendChild(dv({cls:'page-title'},'📈 成本分析報表'));
var buys=state.buyLog||[];var months={};
buys.forEach(function(b){if(!b.date)return;var m=b.date.slice(0,7);if(!months[m])months[m]={total:0,count:0};months[m].total+=b.total||0;months[m].count++});
var sortedM=Object.keys(months).sort();

// 🆕 KPI 摘要卡 (本月 vs 上月)
var thisMon=toMon();var lastMonDate=new Date();lastMonDate.setMonth(lastMonDate.getMonth()-1);var lastMon=lastMonDate.getFullYear()+'-'+String(lastMonDate.getMonth()+1).padStart(2,'0');
var thisMonTotal=(months[thisMon]||{total:0}).total;
var lastMonTotal=(months[lastMon]||{total:0}).total;
var growth=lastMonTotal>0?((thisMonTotal-lastMonTotal)/lastMonTotal*100):0;
var growthColor=growth>10?'#B82525':growth>0?'#9A6210':'#0A5A46';
var growthIcon=growth>10?'⚠️':growth>0?'↗':'↘';
// 6 個月平均
var last6=sortedM.slice(-6);var avg6=last6.length?last6.reduce(function(s,m){return s+months[m].total},0)/last6.length:0;
pg.appendChild(dv({cls:'grid4',style:'margin-bottom:14px'},
  metCard('本月成本',CUR()+fmt(thisMonTotal,0),''),
  metCard('上月成本',CUR()+fmt(lastMonTotal,0),''),
  metCard('成本變化',(growth>=0?'+':'')+growth.toFixed(1)+'% '+growthIcon,'',growthColor),
  metCard('6 個月平均',CUR()+fmt(avg6,0),'')
));

pg.appendChild(dv({cls:'card',html:'<div class="card-title">📊 月度進貨成本趨勢 (近 12 個月)</div><div style="height:250px;display:flex;align-items:flex-end;gap:6px;padding:10px 0">'+
(sortedM.length?sortedM.slice(-12).map(function(m){var lastSorted=sortedM.slice(-12);var maxV=Math.max.apply(null,lastSorted.map(function(k){return months[k].total}));var h=maxV>0?Math.max(months[m].total/maxV*200,20):20;var isThisMon=m===thisMon;return'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="background:'+(isThisMon?'#B82525':'#0A5A46')+';width:100%;height:'+h+'px;border-radius:4px 4px 0 0;min-width:30px"></div><div style="font-size:0.72rem;font-weight:700;color:'+(isThisMon?'#B82525':'#0A5A46')+'">'+CUR()+fmt(months[m].total/1000,0)+'K</div><div style="font-size:0.7rem;color:#706E68">'+m.slice(5)+'月</div></div>'}).join(''):'<div style="flex:1;text-align:center;color:#706E68;padding:40px">尚無進貨資料</div>')+'</div><div style="font-size:0.72rem;color:#706E68;text-align:center">紅色 = 本月,綠色 = 過去月份</div>'}));

// 🆕 品項成本占比 TOP 10
var itemCost={};buys.forEach(function(b){var key=b.ingName||'未知';itemCost[key]=(itemCost[key]||0)+(b.total||0)});
var itemSorted=Object.entries(itemCost).sort(function(a,b){return b[1]-a[1]}).slice(0,10);
var itemTotalAll=Object.values(itemCost).reduce(function(s,v){return s+v},0);
pg.appendChild(dv({cls:'card',html:'<div class="card-title">🥇 品項成本排行 TOP 10</div>'+
(itemSorted.length?'<div style="font-size:0.78rem;color:#706E68;margin-bottom:8px">這 10 項佔總成本 '+(itemTotalAll>0?(itemSorted.reduce(function(s,e){return s+e[1]},0)/itemTotalAll*100).toFixed(1):0)+'%</div>'+itemSorted.map(function(e,idx){var pct=itemTotalAll>0?e[1]/itemTotalAll*100:0;var rankColor=idx<3?'#B82525':idx<6?'#9A6210':'#0A5A46';return'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><div style="background:'+rankColor+';color:#fff;font-weight:700;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-size:0.78rem">'+(idx+1)+'</div><div style="width:160px;font-size:0.84rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(e[0])+'</div><div style="flex:1;height:18px;background:#F3F1EB;border-radius:4px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:'+rankColor+';border-radius:4px"></div></div><div style="min-width:80px;text-align:right;font-size:0.84rem;font-weight:700">'+CUR()+fmt(e[1],0)+'</div><div style="min-width:40px;text-align:right;font-size:0.78rem;color:#706E68">'+fmt(pct,1)+'%</div></div>'}).join(''):'<div style="color:#706E68;padding:20px;text-align:center">尚無資料</div>')}));

// 🆕 食材進價變動追蹤
var priceChange={};buys.forEach(function(b){if(!b.ingName||!b.unitPrice)return;var key=b.ingName;if(!priceChange[key])priceChange[key]=[];priceChange[key].push({date:b.date,price:b.unitPrice})});
var priceWarn=[];Object.keys(priceChange).forEach(function(k){var arr=priceChange[k].sort(function(a,b){return a.date<b.date?-1:1});if(arr.length<2)return;var oldPrice=arr[0].price;var newPrice=arr[arr.length-1].price;var change=oldPrice>0?(newPrice-oldPrice)/oldPrice*100:0;if(Math.abs(change)>=10)priceWarn.push({name:k,oldPrice:oldPrice,newPrice:newPrice,change:change,count:arr.length})});
priceWarn.sort(function(a,b){return Math.abs(b.change)-Math.abs(a.change)});
if(priceWarn.length>0){
  pg.appendChild(dv({cls:'card',html:'<div class="card-title">⚠️ 進價異常變動 (變動 ≥ 10%)</div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>食材</th><th>最早價</th><th>最近價</th><th>變動</th><th>進貨次數</th></tr></thead><tbody>'+priceWarn.slice(0,15).map(function(p){var changeColor=p.change>0?'#B82525':'#0A5A46';return'<tr><td style="font-weight:600">'+esc(p.name)+'</td><td>'+CUR()+fmt(p.oldPrice,2)+'</td><td>'+CUR()+fmt(p.newPrice,2)+'</td><td style="color:'+changeColor+';font-weight:700">'+(p.change>0?'+':'')+p.change.toFixed(1)+'%</td><td>'+p.count+' 次</td></tr>'}).join('')+'</tbody></table></div>'}));
}

// 🆕 配方毛利率排行 (用 calcCost + menu)
if(state.recipes&&state.recipes.length){
  var marginRanks=state.recipes.map(function(r){
    var rc=calcCost(r);
    var unitCost=rc.opLossRate>0?rc.perFull:rc.per;
    // 找 menu 中對應的售價
    var menuItem=(state.menu||[]).find(function(m){return m.recipeId===r.id||m.name===r.name});
    var sellPrice=menuItem?(menuItem.price||0):0;
    var margin=sellPrice>0?((sellPrice-unitCost)/sellPrice*100):null;
    return{recipe:r,unitCost:unitCost,sellPrice:sellPrice,margin:margin,rc:rc}
  }).filter(function(x){return x.margin!==null}).sort(function(a,b){return a.margin-b.margin});  // 毛利低的排前
  
  if(marginRanks.length>0){
    pg.appendChild(dv({cls:'card',html:'<div class="card-title">📉 配方毛利率關注名單 (低毛利 → 高毛利)</div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>配方</th><th>單位成本</th><th>售價</th><th>毛利</th><th>毛利率</th></tr></thead><tbody>'+marginRanks.slice(0,10).map(function(m){var marginColor=m.margin<40?'#B82525':m.margin<55?'#9A6210':'#0A5A46';return'<tr><td style="font-weight:600">'+esc(m.recipe.name)+'</td><td>'+CUR()+fmt(m.unitCost,2)+'</td><td>'+CUR()+fmt(m.sellPrice,2)+'</td><td style="color:'+marginColor+'">'+CUR()+fmt(m.sellPrice-m.unitCost,2)+'</td><td style="color:'+marginColor+';font-weight:700">'+m.margin.toFixed(1)+'% '+(m.margin<40?'⚠️':m.margin<55?'⚡':'✅')+'</td></tr>'}).join('')+'</tbody></table></div>'}));
  }
}

// 供應商成本佔比
var supCost={};buys.forEach(function(b){var key=b.supId||'未知';supCost[key]=(supCost[key]||0)+(b.total||0)});
var supSorted=Object.entries(supCost).sort(function(a,b){return b[1]-a[1]}).slice(0,10);
var totalCost=supSorted.reduce(function(s,e){return s+e[1]},0);

window.showSupplierEval=function(){var sups=state.sups||[];var buys=state.buyLog||[];var qc=state.qcRecords||[];var returns=state.returnList||[];
var evals=sups.map(function(s){
  var myBuys=buys.filter(function(b){return b.supId===s.id});
  var myQC=qc.filter(function(q){return q.supplier===s.name||q.supplier===s.id});
  var myRtn=returns.filter(function(r){return r.supplier===s.name});
  var totalAmt=myBuys.reduce(function(sum,b){return sum+(b.total||0)},0);
  var qcPass=myQC.filter(function(q){return q.result==='合格'}).length;
  var qcRate=myQC.length?Math.round(qcPass/myQC.length*100):100;
  var rtnRate=myBuys.length?Math.round(myRtn.length/myBuys.length*100):0;
  return{id:s.id,name:s.name,buyCount:myBuys.length,totalAmt:totalAmt,qcCount:myQC.length,qcRate:qcRate,rtnCount:myRtn.length,rtnRate:rtnRate,score:s.score||0}
}).filter(function(e){return e.buyCount>0}).sort(function(a,b){return b.totalAmt-a.totalAmt});
var html=mH('📊 供應商評核報告');
html+='<div style="max-height:450px;overflow-y:auto"><table class="tbl"><thead><tr><th>供應商</th><th>進貨次數</th><th>總金額</th><th>品管次數</th><th>合格率</th><th>退貨次數</th><th>退貨率</th><th>綜合評分</th></tr></thead><tbody>';
evals.forEach(function(e){var overall=Math.round((e.qcRate*0.4+(100-e.rtnRate)*0.3+Math.min(e.score*10,100)*0.3));
html+='<tr><td style="font-weight:700">'+esc(e.name)+'</td><td>'+e.buyCount+'</td><td>'+CUR()+fmt(e.totalAmt,0)+'</td><td>'+e.qcCount+'</td><td style="color:'+(e.qcRate>=90?'#0A5A46':'#B82525')+';font-weight:700">'+e.qcRate+'%</td><td>'+e.rtnCount+'</td><td style="color:'+(e.rtnRate<=5?'#0A5A46':'#B82525')+'">'+e.rtnRate+'%</td><td style="font-weight:700;color:'+(overall>=80?'#0A5A46':overall>=60?'#9A6210':'#B82525')+'">'+overall+'/100</td></tr>'});
if(!evals.length)html+='<tr><td colspan="8" style="text-align:center;color:#706E68">尚無供應商進貨資料</td></tr>';
html+='</tbody></table></div><div class="save-btns"><button class="btn btn-outline" onclick="closeModal()">關閉</button></div>';
modal(html,true)};

window.woPickMaterial=function(id){var w=(state.workOrders||[]).find(function(x){return x.id===id});if(!w)return;

if(!r||!r.ings||!r.ings.length){toast('此配方無食材明細');w.status='已領料';w.pickedAt=new Date().toISOString();saveState();renderPage();return}

r.ings.forEach(function(ri){var ing=(state.ings||[]).find(function(i){return i.id===ri.id||i.name===ri.name});
