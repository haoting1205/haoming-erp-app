<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--pri:#0A6847;--pri-l:#E8F5EE;--amber:#9A6210;--amber-l:#FFF8ED;--red:#C02828;--red-l:#FEF0F0;--bg:#F0EDE7;--card:#fff;--txt:#1E1E1C;--txt2:#555350;--txt3:#706E68;--brd:#D4D2CC;--r:12px}
html{font-size:16px}
body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom,0);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;letter-spacing:.02em}
.header{background:linear-gradient(180deg,#1A1A18,#252523);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.header-title{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:8px}
.header-dot{width:8px;height:8px;background:#D4950F;border-radius:50%}
.header-right{font-size:0.78rem;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:8px}
.header-right button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:4px 10px;font-size:0.78rem;cursor:pointer;font-family:inherit}
.header-right button:disabled{opacity:.4;cursor:not-allowed}
.content{flex:1;padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tab-bar{background:#fff;border-top:1px solid var(--brd);display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;z-index:100;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.tab-item{display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;cursor:pointer;font-size:0.68rem;color:var(--txt3);border:none;background:none;font-family:inherit;transition:.15s}
.tab-item.active{color:var(--amber);font-weight:700}
.tab-icon{font-size:1.3rem;margin-bottom:2px}
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card-title{font-size:0.88rem;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1.5px solid #ECEAE4}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.metric{background:var(--bg);border-radius:8px;padding:10px 12px;text-align:center}
.metric-label{font-size:0.72rem;color:var(--txt3);margin-bottom:3px}
.metric-val{font-size:1.3rem;font-weight:700}
.btn{border:none;border-radius:10px;padding:12px 18px;font-size:0.92rem;cursor:pointer;font-family:inherit;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;letter-spacing:.02em}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(10,104,71,.2)}.btn-pri:active{background:#064535}
.btn-out{background:#fff;border:1.5px solid var(--brd);color:var(--txt)}.btn-out:active{background:var(--bg)}
.btn-sm{padding:7px 12px;font-size:0.84rem;width:auto}
.btn-danger{background:var(--red);color:#fff}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ECEAE4}
.list-item:last-child{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:0.72rem;font-weight:600}
.badge-ok{background:var(--pri-l);color:var(--pri)}.badge-warn{background:var(--amber-l);color:var(--amber)}.badge-err{background:var(--red-l);color:var(--red)}.badge-blue{background:#E6F1FB;color:#0C447C}
.badge-tax{background:var(--amber-l);color:var(--amber);margin-left:4px}
.badge-tax.tax-free{background:var(--pri-l);color:var(--pri)}
.fg{margin-bottom:10px}
.fg label{font-size:0.82rem;color:var(--txt2);font-weight:600;display:block;margin-bottom:4px}
.fg input,.fg select{width:100%;border:1.5px solid var(--brd);border-radius:8px;padding:10px 14px;font-size:0.95rem;font-family:inherit;background:var(--card);color:var(--txt);outline:none;-webkit-appearance:none;transition:all .2s}
.fg input:focus,.fg select:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(10,104,71,.1)}
.empty{text-align:center;color:var(--txt3);padding:32px 0;font-size:0.92rem}
.ord-sticky{position:sticky;bottom:60px;background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:10px 14px;z-index:10}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1E1E1C;color:#fff;padding:8px 20px;border-radius:20px;font-size:0.88rem;font-weight:600;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.toast.toast-error{background:#C02828}
.toast.toast-warning{background:#9A6210}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0))}
.modal-title{font-size:1rem;font-weight:700;margin-bottom:14px;padding-bottom:10px;border-bottom:1.5px solid #ECEAE4;display:flex;justify-content:space-between;align-items:center}
.alert-item{padding:10px 12px;border-radius:8px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer}
.alert-danger{background:var(--red-l);border-left:3px solid var(--red)}
.alert-warn{background:var(--amber-l);border-left:3px solid var(--amber)}
.alert-info{background:#E6F1FB;border-left:3px solid #1455A0}
.sync-spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top:2px solid #fff;border-radius:50%;animation:spin 1s linear infinite;margin-right:4px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.login-wrap{position:fixed;inset:0;background:#1E1E1C;z-index:9999;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:16px;padding:28px 24px;width:340px;max-width:90vw}
</style>

<body>

<div class="header">
  <div class="header-title"><span class="header-dot"></span>好洺門市 APP<span style="font-size:0.65rem;color:rgba(255,255,255,.4);margin-left:6px;font-weight:400">v1.6.0</span></div>
  <div class="header-right" id="hdr-right"></div>
</div>

<div class="content" id="app-content"></div>

<div class="tab-bar" id="tab-bar">

  <button class="tab-item" data-tab="stock" onclick="switchTab('stock')"><span class="tab-icon">📦</span>庫存</button>
  <button class="tab-item" data-tab="order" onclick="switchTab('order')"><span class="tab-icon">📋</span>叫貨</button>
  <button class="tab-item" data-tab="check" onclick="switchTab('check')"><span class="tab-icon">✅</span>檢查</button>
  <button class="tab-item" data-tab="more" onclick="switchTab('more')"><span class="tab-icon">⚙️</span>更多</button>
</div>

<div class="toast" id="app-toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
// 好洺門市 APP v1.6.0 — 修補版（修復 14 項已知問題）
// 變更紀錄：
//   v1.6.0 (2026-04-26)
//   🔴 修 #1 登出按鈕 escape bug → 改用 doLogout() 函式
//   🔴 修 #3 cloudPush 多店覆蓋 → 加入 lastSyncToken 衝突檢查
//   🟡 修 #2 switchTab 加未登入保護
//   🟡 修 #4 統一 myInv 過濾邏輯（中央廚房有特殊規則）
//   🟡 修 #5 中央廚房身份禁止叫貨（顯示提示）
//   🟡 修 #11 整合 window.HaomingTax 稅務模組（顯示稅別徽章）
//   🟢 修 #6 缺貨計算容錯（i.stock || 0）
//   🟢 修 #7 低庫存計算容錯（i.safety || 0）
//   🟢 修 #9 SHEETS 空陣列防護
//   🟢 修 #10 Service Worker 註冊（離線快取）
//   🟢 修 #12 saveAppAndSync 改為實際使用（節流推送）
//   🟢 修 #13 cloudPull 失敗時停留在 Setup
//   🟢 修 #14 推送中按鈕 disabled + spinner
// ═══════════════════════════════════════════════════════════

// ── State ──
var APP_VERSION='1.6.0';
var APP_BUILD='20260426-fix14';
var APP_KEY='hm_app_v1';
var FIREBASE_CONFIG={
  apiKey:"AIzaSyAk8D1oXTYaq9E1t96bPW-1rMu0EhW1JzQ",
  authDomain:"haomin-system.firebaseapp.com",
  databaseURL:"https://haomin-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"haomin-system",
  storageBucket:"haomin-system.firebasestorage.app",
  messagingSenderId:"348193196599",
  appId:"1:348193196599:web:140d7092ba8e61ce80fbfc"
};
var FIREBASE_URL=FIREBASE_CONFIG.databaseURL;
var app={store:'',user:'',role:'',firebaseUrl:FIREBASE_URL,lastSync:'',lastSyncToken:0,data:null};
try{var saved=JSON.parse(localStorage.getItem(APP_KEY)||'{}');if(saved.store)Object.assign(app,saved)}catch(e){}

var currentTab='home';
var _isPushing=false;  // 🟢 fix #14: 推送中旗標

function saveApp(){try{localStorage.setItem(APP_KEY,JSON.stringify(app))}catch(e){}}

// 🟢 fix #12: saveAppAndSync 改為實際使用 — 節流推送（3 秒內多次儲存合併為一次）
var _appPushTimer=null;
function saveAppAndSync(){
  saveApp();
  clearTimeout(_appPushTimer);
  _appPushTimer=setTimeout(function(){cloudPush()},3000);
}

function showToast(msg,type){
  var t=document.getElementById('app-toast');
  if(!t)return;
  t.textContent=msg;
  t.classList.remove('toast-error','toast-warning');
  if(type==='error')t.classList.add('toast-error');
  else if(type==='warning')t.classList.add('toast-warning');
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2200);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n,d){return(n==null||isNaN(n))?'—':Number(n).toFixed(d||0).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function toDay(){return new Date().toISOString().slice(0,10)}

// ── 🟡 fix #11: HaomingTax 模組相容層 ──
// 與生管系統共用稅別判定邏輯。如果生管 v2.1.0 注入過 window.HaomingTax，這個會被覆蓋；
// 如果 APP 獨立執行（沒有同 page 載入生管），用以下 fallback
if(!window.HaomingTax){
  var ING_TAX_PATCH_FALLBACK={
    'I003':'tax_free','I004':'tax_free','I010':'tax_free','I011':'tax_free',
    'I013':'tax_free','I024':'tax_free','I089':'tax_free','I094':'tax_free',
    'I118':'tax_free','I125':'tax_free'
  };
  window.HaomingTax={
    getIngTaxType:function(ing){
      if(!ing)return'taxable';
      if(ing.taxType)return ing.taxType;
      if(ING_TAX_PATCH_FALLBACK[ing.id])return ING_TAX_PATCH_FALLBACK[ing.id];
      var cat=ing.cat||'';
      if(cat==='蔬菜'||/蔬菜|青菜/.test(ing.name||''))return'tax_free';
      return'taxable';
    },
    getTaxBadge:function(ing){
      var t=this.getIngTaxType(ing);
      return t==='tax_free'?{type:'tax_free',label:'免稅',emoji:'🌾'}:{type:'taxable',label:'5%',emoji:'💰'};
    },
    fallback:true
  };
}

// ── Firebase Sync ──
var _appFb=null;var _appDb=null;
function initAppFirebase(){
  if(_appDb)return true;
  try{
    if(!firebase.apps.length){_appFb=firebase.initializeApp(FIREBASE_CONFIG)}else{_appFb=firebase.apps[0]}
    _appDb=firebase.firestore();
    return true;
  }catch(e){console.error('Firestore init:',e);return false}
}

function cloudPull(cb){
  if(!initAppFirebase()){if(cb)cb(false);return}
  _appDb.collection('erp').doc('state').get()
    .then(function(doc){
      if(doc.exists&&doc.data()&&doc.data().data){
        app.data=doc.data().data;
        app.lastSync=new Date().toISOString();
        // 🔴 fix #3: 記錄拉下時的 server-side 時戳，作為下次 push 衝突檢查的基準
        var serverTime=doc.data().updated_at;
        app.lastSyncToken=serverTime?(serverTime.toMillis?serverTime.toMillis():Date.now()):Date.now();
        saveApp();
        if(cb)cb(true);
      }else{if(cb)cb(false)}
    }).catch(function(e){
      console.error('cloudPull error:',e);
      if(cb)cb(false);
    });
}

// 🔴 fix #3: cloudPush 加衝突檢查 — 推送前先比對 server-side updated_at
// 🟢 fix #14: 推送中設 _isPushing 旗標 + 視覺回饋
function cloudPush(skipConflictCheck){
  if(_isPushing){console.log('[push] skipped — already pushing');return}
  if(!initAppFirebase()||!app.data)return;
  _isPushing=true;
  updateHeader();  // 觸發顯示 spinner

  var doActualPush=function(){
    var stateClone=JSON.parse(JSON.stringify(app.data));
    _appDb.collection('erp').doc('state').set({
      data:stateClone,
      updated_at:firebase.firestore.FieldValue.serverTimestamp(),
      device:'APP-'+(app.store||'mobile'),
      device_user:app.user||''
    }).then(function(){
      // 寫入後重新拉一次 timestamp 作為下次基準
      return _appDb.collection('erp').doc('state').get();
    }).then(function(doc){
      if(doc.exists&&doc.data().updated_at){
        var t=doc.data().updated_at;
        app.lastSyncToken=t.toMillis?t.toMillis():Date.now();
      }
      app.lastSync=new Date().toISOString();
      saveApp();
      _isPushing=false;
      updateHeader();
      showToast('✅ 已同步');
    }).catch(function(e){
      console.error('cloudPush error:',e);
      _isPushing=false;
      updateHeader();
      showToast('❌ 同步失敗','error');
    });
  };

  if(skipConflictCheck){
    doActualPush();
    return;
  }

  // 衝突檢查：先抓 server-side updated_at，看是否比 lastSyncToken 新
  _appDb.collection('erp').doc('state').get().then(function(doc){
    if(!doc.exists){doActualPush();return}
    var serverT=doc.data().updated_at;
    var serverMs=serverT?(serverT.toMillis?serverT.toMillis():0):0;
    if(app.lastSyncToken&&serverMs>app.lastSyncToken+500){
      // 偵測到有別人在你 pull 之後寫過資料
      var serverDevice=doc.data().device||'';
      var msg='⚠️ 偵測到衝突：'+serverDevice+' 剛剛也修改了資料\n\n'+
              '若按「確定」會覆蓋他們的修改\n按「取消」可重新同步保留兩邊（建議）';
      if(confirm(msg)){
        doActualPush();
      }else{
        _isPushing=false;
        updateHeader();
        // 自動重新拉,讓使用者看到別人的修改
        cloudPull(function(ok){
          showToast(ok?'🔄 已重新同步,請再次操作':'❌ 重新同步失敗','warning');
          if(ok)switchTab(currentTab);
        });
      }
    }else{
      doActualPush();
    }
  }).catch(function(e){
    console.error('conflict check error:',e);
    // 衝突檢查失敗也照常推送（避免使用者卡住）
    doActualPush();
  });
}

// ── Login ──
function checkLogin(){
  if(app.store&&app.firebaseUrl){updateHeader();return true}
  showSetup();return false;
}

function showSetup(){
  document.getElementById('tab-bar').style.display='none';
  var c=document.getElementById('app-content');
  c.innerHTML='<div style="display:flex;align-items:center;justify-content:center;min-height:70vh"><div class="login-box" style="background:var(--card)">'+
    '<div style="text-align:center;margin-bottom:20px"><div style="width:40px;height:40px;background:#D4950F;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.1rem">好</div><div style="font-weight:700;font-size:1.05rem">好洺門市 APP</div><div style="font-size:0.82rem;color:var(--txt3);margin-top:4px">連接主系統使用</div></div>'+
    '<div class="fg"><label>選擇門市</label><select id="s-store"><option value="">— 請選擇 —</option><option value="交大店">交大店</option><option value="竹北店">竹北店</option><option value="台積電店">台積電店</option><option value="中央廚房">中央廚房</option></select></div>'+
    '<div class="fg"><label>你的名字</label><input id="s-user" value="'+esc(app.user||'')+'" placeholder="輸入姓名"></div>'+
    '<button class="btn btn-pri" onclick="doSetup()" style="margin-top:6px">開始使用</button>'+
    '<div style="text-align:center;margin-top:14px;font-size:0.78rem;color:var(--txt3)">選擇門市並輸入姓名即可開始</div>'+
    '</div></div>';
}

// 🟢 fix #13: cloudPull 失敗時停留在 Setup
function doSetup(){
  var store=(document.getElementById('s-store')||{}).value||'';
  var user=(document.getElementById('s-user')||{}).value||'';
  if(!store){showToast('請選擇門市','warning');return}
  if(!user){showToast('請輸入姓名','warning');return}
  app.firebaseUrl=FIREBASE_URL;
  app.store=store;app.user=user;app.role='員工';
  saveApp();
  showToast('🔄 正在同步...');
  cloudPull(function(ok){
    if(ok){
      document.getElementById('tab-bar').style.display='';
      switchTab('home');
      showToast('✅ 連線成功');
    }else{
      // 連線失敗 — 不切到主頁,提示使用者
      showToast('❌ 連線失敗,請檢查網路','error');
      // 保持在 setup 畫面,讓使用者重試
    }
  });
}

// ── Header ──
// 🟢 fix #14: 推送中顯示 spinner
function updateHeader(){
  var h=document.getElementById('hdr-right');
  if(!h)return;
  var spinnerHtml=_isPushing?'<span class="sync-spinner"></span>':'';
  var disabled=_isPushing?'disabled':'';
  h.innerHTML=spinnerHtml+'<span>'+esc(app.store)+'</span>'+
    '<button '+disabled+' onclick="cloudPull(function(ok){if(ok){switchTab(currentTab);showToast(\'✅ 已同步\')}else{showToast(\'❌ 同步失敗\',\'error\')}})">🔄</button>';
}

// ── Tab Navigation ──
// 🟡 fix #2: switchTab 加未登入保護
function switchTab(tab){
  // 未登入保護：localStorage 在使用中被清掉時保護
  if(!app.store||!app.firebaseUrl){
    showSetup();
    return;
  }
  currentTab=tab;
  document.querySelectorAll('.tab-item').forEach(function(t){t.classList.toggle('active',t.dataset.tab===tab)});
  var c=document.getElementById('app-content');
  var d=app.data||{};
  if(tab==='home')renderHome(c,d);
  else if(tab==='stock')renderStock(c,d);
  else if(tab==='order')renderOrder(c,d);
  else if(tab==='check')renderCheck(c,d);
  else if(tab==='more')renderMore(c,d);
}

// ── 🟡 fix #4: 統一 myInv 過濾規則 ──
// 中央廚房使用者：看「中央廚房」庫存
// 一般門市使用者：看「自己門市」庫存
// （批次效期是另一回事 — 中央廚房的批次理論上會調撥到門市,門市需要看到中央廚房的批次來知道進貨來源效期）
function getMyInv(d){
  var si=d.storeInv||[];
  return si.filter(function(i){return i.store===app.store});
}

function getMyBatches(d){
  // 一般門市可看自己門市 + 中央廚房（因為中央廚房的批次會調撥過來）
  // 中央廚房使用者只看中央廚房自己
  var batches=d.batchList||[];
  if(app.store==='中央廚房'){
    return batches.filter(function(b){return b.store==='中央廚房'});
  }
  return batches.filter(function(b){return b.store===app.store||b.store==='中央廚房'});
}
</script>
<script>
// ── 🏠 Home ──
function renderHome(c,d){
  var myInv=getMyInv(d);
  // 🟢 fix #6 + #7: 容錯處理 — 用 (i.stock || 0) 跟 (i.safety || 0)
  var lowStock=myInv.filter(function(i){
    var stock=Number(i.stock)||0;
    var safety=Number(i.safety)||0;
    return stock>0&&stock<=safety;
  }).length;
  var outStock=myInv.filter(function(i){
    var stock=Number(i.stock);
    // 區分「真的是 0/負數」跟「資料缺失」
    return stock!=null&&!isNaN(stock)&&stock<=0;
  }).length;

  var batches=getMyBatches(d);
  var today=toDay();
  var expiring=batches.filter(function(b){
    if(b.status==='已用完'||!b.expiryDate)return false;
    var days=Math.ceil((new Date(b.expiryDate)-new Date(today))/86400000);
    return days>=0&&days<=3;
  }).length;
  var expired=batches.filter(function(b){
    return b.status!=='已用完'&&b.expiryDate&&b.expiryDate<today;
  }).length;
  
  var alerts=[];
  if(outStock)alerts.push({type:'danger',msg:outStock+' 項缺貨',icon:'❌'});
  if(expired)alerts.push({type:'danger',msg:expired+' 批已過期',icon:'🚫'});
  if(lowStock)alerts.push({type:'warn',msg:lowStock+' 項低庫存',icon:'⚠️'});
  if(expiring)alerts.push({type:'warn',msg:expiring+' 批 3天內到期',icon:'⏰'});
  var pending=(d.poList||[]).filter(function(p){return p.status==='申請中'}).length;
  if(pending)alerts.push({type:'info',msg:pending+' 筆採購待核准',icon:'📋'});
  
  var html='<div style="margin-bottom:10px;font-size:1.1rem;font-weight:700">👋 '+esc(app.user||'你好')+'，'+esc(app.store)+'</div>';
  html+='<div class="metric-grid"><div class="metric"><div class="metric-label">門市庫存品項</div><div class="metric-val">'+myInv.length+'</div></div><div class="metric"><div class="metric-label">需注意</div><div class="metric-val" style="color:'+(alerts.length?'var(--red)':'var(--pri)')+'">'+alerts.length+'</div></div></div>';
  
  if(alerts.length){html+='<div class="card"><div class="card-title">🔔 待處理事項</div>';alerts.forEach(function(a){html+='<div class="alert-item alert-'+a.type+'"><span style="font-size:1.1rem">'+a.icon+'</span><span style="font-weight:600;font-size:0.88rem">'+a.msg+'</span></div>'});html+='</div>'}
  else{html+='<div class="card" style="text-align:center;padding:24px;color:var(--pri)"><div style="font-size:1.5rem;margin-bottom:6px">✅</div>一切正常！</div>'}
  
  // 🟡 fix #5: 中央廚房身份的快速操作不顯示「叫貨」（因為自己叫自己沒意義）
  var isHQ=(app.store==='中央廚房');
  html+='<div class="card"><div class="card-title">⚡ 快速操作</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  html+='<button class="btn btn-out" onclick="switchTab(\'stock\')">📦 查庫存</button>';
  if(isHQ){
    html+='<button class="btn btn-out" onclick="switchTab(\'check\')">✅ 檢查</button>';
    html+='<button class="btn btn-out" onclick="quickAdjust()">📝 盤點</button>';
    html+='<button class="btn btn-out" disabled style="opacity:.5;cursor:not-allowed" title="中央廚房不需叫貨">🏭 中央廚房</button>';
  }else{
    html+='<button class="btn btn-out" onclick="switchTab(\'order\')">📋 叫貨</button>';
    html+='<button class="btn btn-out" onclick="switchTab(\'check\')">✅ 檢查</button>';
    html+='<button class="btn btn-out" onclick="quickAdjust()">📝 盤點</button>';
  }
  html+='</div></div>';
  
  html+='<div style="text-align:center;font-size:0.72rem;color:var(--txt3);margin-top:8px">最後同步：'+(app.lastSync?(app.lastSync.slice(0,19).replace('T',' ')):'尚未同步')+'</div>';
  c.innerHTML=html;
}

// ── 📦 Stock ──
// 🟡 fix #11: 加稅別徽章顯示
function renderStock(c,d){
  var myInv=getMyInv(d);
  var html='<div class="fg"><input id="stk-q" placeholder="🔍 搜尋品名..." oninput="filterStock()"></div>';
  html+='<div id="stk-list">';
  html+=buildStockList(myInv,'',d);
  html+='</div>';
  c.innerHTML=html;
}

function buildStockList(items,q,d){
  var filtered=q?items.filter(function(i){return(i.name||'').includes(q)}):items;
  if(!filtered.length)return'<div class="empty">無庫存品項</div>';
  var ings=(d&&d.ings)||(app.data&&app.data.ings)||[];
  var html='';
  filtered.forEach(function(i){
    // 🟢 fix #6/#7: 數值容錯
    var stock=Number(i.stock)||0;
    var safety=Number(i.safety)||0;
    var statusBadge=stock<=0?'<span class="badge badge-err">缺貨</span>':stock<=safety?'<span class="badge badge-warn">低庫存</span>':'<span class="badge badge-ok">充足</span>';
    var catBadge=i.cat==='食材'?'<span class="badge badge-ok">食材</span>':'<span class="badge badge-blue">包材</span>';

    // 🟡 fix #11: 食材類加稅別徽章
    var taxBadge='';
    if(i.cat==='食材'&&window.HaomingTax){
      var ing=ings.find(function(x){return x.id===i.id||x.name===i.name})||i;
      var b=window.HaomingTax.getTaxBadge(ing);
      taxBadge='<span class="badge badge-tax '+(b.type==='tax_free'?'tax-free':'')+'">'+b.emoji+'</span>';
    }

    html+='<div class="card" style="padding:10px 14px" onclick="showStockDetail(\''+esc(i.id)+'\')"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:700;font-size:0.95rem">'+esc(i.name)+'</div><div style="font-size:0.78rem;color:var(--txt3);margin-top:3px">'+catBadge+' '+statusBadge+taxBadge+'</div></div><div style="text-align:right"><div style="font-size:1.2rem;font-weight:700">'+fmt(stock,1)+'</div><div style="font-size:0.72rem;color:var(--txt3)">'+esc(i.unit)+' / 安全:'+fmt(safety,0)+'</div></div></div></div>';
  });
  return html;
}

window.filterStock=function(){
  var q=(document.getElementById('stk-q')||{}).value||'';
  var d=app.data||{};
  var myInv=getMyInv(d);
  document.getElementById('stk-list').innerHTML=buildStockList(myInv,q,d);
};

window.showStockDetail=function(id){
  var d=app.data||{};
  var si=d.storeInv||[];
  var item=si.find(function(i){return i.id===id});
  if(!item)return;

  // 🟡 fix #11: 詳細頁加稅別資訊
  var taxInfo='';
  if(item.cat==='食材'&&window.HaomingTax){
    var ings=d.ings||[];
    var ing=ings.find(function(x){return x.id===item.id||x.name===item.name})||item;
    var b=window.HaomingTax.getTaxBadge(ing);
    taxInfo='<br>稅別：<span class="badge badge-tax '+(b.type==='tax_free'?'tax-free':'')+'">'+b.emoji+' '+b.label+'</span>';
  }

  showModal('<div class="modal-title"><span>'+esc(item.name)+'</span><button class="btn btn-sm btn-out" onclick="closeModal()">✕</button></div>'+
    '<div class="metric-grid"><div class="metric"><div class="metric-label">現有庫存</div><div class="metric-val">'+fmt(Number(item.stock)||0,1)+'</div><div style="font-size:0.72rem;color:var(--txt3)">'+esc(item.unit)+'</div></div><div class="metric"><div class="metric-label">安全庫存</div><div class="metric-val">'+fmt(Number(item.safety)||0,0)+'</div></div></div>'+
    '<div style="font-size:0.84rem;color:var(--txt2);line-height:1.8;margin-bottom:14px">類別：'+(item.cat==='食材'?'🥬 食材':'📦 包材')+'<br>來源：'+esc(item.sourceType||'—')+'<br>供應商：'+esc(item.supplier||'—')+'<br>進價：NT$'+fmt(Number(item.price)||0,2)+taxInfo+'</div>'+
    '<div class="fg"><label>庫存調整</label><div style="display:flex;gap:6px"><select id="adj-type" style="flex:1"><option value="set">設為</option><option value="add">增加</option><option value="sub">減少</option></select><input id="adj-qty" type="number" min="0" step="0.1" placeholder="數量" style="flex:1"></div></div>'+
    '<button class="btn btn-pri" onclick="doAdjust(\''+esc(id)+'\')">確認調整並同步</button>');
};

window.doAdjust=function(id){
  var si=(app.data||{}).storeInv||[];
  var item=si.find(function(i){return i.id===id});
  if(!item)return;
  var type=(document.getElementById('adj-type')||{}).value||'set';
  var qty=parseFloat((document.getElementById('adj-qty')||{}).value);
  if(isNaN(qty)||qty<0){showToast('請輸入有效數量','warning');return}
  var stock=Number(item.stock)||0;
  if(type==='set')item.stock=qty;
  else if(type==='add')item.stock=stock+qty;
  else item.stock=Math.max(0,stock-qty);
  item.updatedAt=toDay();
  closeModal();
  cloudPush();
  switchTab('stock');
  showToast('✅ 庫存已更新');
};
</script>

function buildOrderItems(){
  // 🟢 fix #9: SHEETS 空陣列防護
  if(!SHEETS.length)return;
  var s=SHEETS[_orderSheetIdx];
  if(!s)return;
  var wrap=document.getElementById('ord-items');if(!wrap)return;
  var q=(document.getElementById('ord-search')||{}).value||'';
  q=q.toLowerCase();
  var saved=loadOrderData(s.id);
  var items=s.items||[];
  if(q)items=items.filter(function(it){return(it.name||'').toLowerCase().includes(q)});
  
  var html='';
  items.forEach(function(it){
    var qty=saved[it.seq]||'';
    var amt=qty?Math.round(parseFloat(qty)*it.price):0;
    html+='<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ECEAE4">';
    html+='<div style="min-width:24px;font-size:0.72rem;color:var(--txt3);text-align:center">'+it.seq+'</div>';
    html+='<div style="flex:1;min-width:0"><div style="font-size:0.84rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(it.name)+'</div><div style="font-size:0.72rem;color:var(--txt3)">'+esc(it.unit)+' / $'+it.price+'</div></div>';
    html+='<input type="number" min="0" step="0.5" value="'+qty+'" data-seq="'+it.seq+'" data-price="'+it.price+'" onchange="onOrderQtyChange(this)" style="width:60px;border:1.5px solid '+(qty?'var(--amber)':'var(--brd)')+';border-radius:6px;padding:6px;text-align:center;font-size:0.92rem;font-weight:'+(qty?'700':'400')+';background:'+(qty?'var(--amber-l)':'var(--bg)')+';color:var(--txt);font-family:inherit">';
    html+='<div style="min-width:55px;text-align:right;font-size:0.84rem;font-weight:700;color:'+(amt?'var(--pri)':'var(--txt3)')+'" data-amt="'+it.seq+'">'+(amt?'$'+fmt(amt):'—')+'</div>';
    html+='</div>';
  });
  wrap.innerHTML=html;
  updateOrderTotal();
}

window.onOrderQtyChange=function(inp){
  var seq=inp.dataset.seq;var price=parseFloat(inp.dataset.price);
  var qty=parseFloat(inp.value)||0;
  inp.style.borderColor=qty?'var(--amber)':'var(--brd)';
  inp.style.fontWeight=qty?'700':'400';
  inp.style.background=qty?'var(--amber-l)':'var(--bg)';
  var amtEl=document.querySelector('[data-amt="'+seq+'"]');
  if(amtEl){var amt=qty?Math.round(qty*price):0;amtEl.textContent=amt?'$'+fmt(amt):'—';amtEl.style.color=amt?'var(--pri)':'var(--txt3)'}
  
  var s=SHEETS[_orderSheetIdx];
  if(!s)return;
  var saved=loadOrderData(s.id);
  if(qty)saved[seq]=qty;else delete saved[seq];
  saveOrderData(s.id,saved);
  updateOrderTotal();
};

function updateOrderTotal(){
  if(!SHEETS.length)return;
  var s=SHEETS[_orderSheetIdx];
  if(!s)return;
  var saved=loadOrderData(s.id);
  var total=0;var filled=0;
  (s.items||[]).forEach(function(it){var q=saved[it.seq];if(q){total+=Math.round(parseFloat(q)*it.price);filled++}});
  var el=document.getElementById('ord-total');if(el)el.textContent='$'+fmt(total);
  var fl=document.getElementById('ord-filled');if(fl)fl.textContent=filled+' 項已填';
}

function loadOrderData(sheetId){
  try{return JSON.parse(localStorage.getItem(_orderKey+sheetId+'_'+toDay())||'{}')}catch(e){return{}}
}
function saveOrderData(sheetId,data){
  try{localStorage.setItem(_orderKey+sheetId+'_'+toDay(),JSON.stringify(data))}catch(e){}
}

window.saveOrderSheet=function(){

// ── 🟢 fix #10: Service Worker 註冊（離線快取）──
if('serviceWorker' in navigator){
  // 用 inline SW（base64 data URL）— 純粹 cache-first 給離線使用
  var swCode='self.addEventListener("install",function(e){self.skipWaiting()});'+
             'self.addEventListener("activate",function(e){e.waitUntil(self.clients.claim())});'+
             'self.addEventListener("fetch",function(e){'+
               'if(e.request.mode==="navigate"){'+
                 'e.respondWith(fetch(e.request).catch(function(){return caches.match("/")||new Response("離線中,請連網後重試",{headers:{"Content-Type":"text/html;charset=utf-8"}})}))'+
               '}'+
             '});';
  // 注意:Service Worker 必須從 same-origin URL 註冊,所以這個只在部署到 GitHub Pages 後才會運作
  // 在 file:// 開啟時會 fail silently
  try{
    var swBlob=new Blob([swCode],{type:'application/javascript'});
    var swUrl=URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(function(e){
      console.log('[SW] 註冊失敗（如在 file:// 開啟屬正常）:',e.message);
    });
  }catch(e){console.log('[SW] 不支援:',e.message);}
}

// 風險檢查 — 額度 + 時間窗
function _checkCustRisk(c){
  var errs=[];
  // 1. 狀態檢查
  if(c.status==='suspended')errs.push('您的帳號已被暫停,請聯繫商家');
  else if(c.status==='archived')errs.push('您的帳號已封存,請聯繫商家');
  
  // 2. 時間窗
  var now=new Date();
  var dow=now.getDay();
  var hr=now.getHours();
  var days=Array.isArray(c.orderDays)?c.orderDays:[1,2,3,4,5,6,0];
  var dayNames=['週日','週一','週二','週三','週四','週五','週六'];
  if(days.indexOf(dow)<0){
    var allowDays=days.map(function(d){return dayNames[d]}).join('、');
    errs.push('目前('+dayNames[dow]+')非接單日\n允許下單日:'+allowDays);
  }
  var h1=c.orderHourStart||0;
  var h2=c.orderHourEnd||24;
  if(hr<h1||hr>=h2){
    errs.push('目前('+hr+'點)非接單時段\n允許時段:'+h1+':00 ~ '+h2+':00');
  }
  
  // 3. 額度檢查 (此處只檢查是否已超額,不檢查本次訂單)
  var lim=c.creditLimit||0;
  var used=c.creditUsed||0;
  if(lim>0&&used>=lim){
    errs.push('您的累積未結金額已達授信額度\n額度: $'+lim.toLocaleString()+',已用: $'+used.toLocaleString());
  }
  
  return errs;
}

function doCustLogin(){
  var code=(document.getElementById('cust-code')||{}).value||'';
  code=code.trim();
  var errEl=document.getElementById('cust-login-err');
  function showErr(msg){
    if(errEl){errEl.textContent=msg;errEl.style.display='block'}
  }
  if(!/^\d{3}$/.test(code)){showErr('代碼必須是 3 位數字 (000-999)');return}
  
  showToast('🔄 驗證中...');
  // 從 Firebase 讀取客戶資料
  cloudPull(function(ok){
    if(!ok){
      showErr('連線失敗,請檢查網路');
      return;
    }
    if(!app.data||!app.data.customers){
      showErr('系統尚未設定客戶資料,請聯繫商家');
      return;
    }
    var customer=app.data.customers.find(function(x){return x.code===code});
    if(!customer){
      showErr('找不到此代碼,請確認後再試');
      return;
    }
    
    // 風險檢查
    var errs=_checkCustRisk(customer);
    if(errs.length>0){
      showErr(errs.join('\n\n'));
      return;
    }
    
    // 登入成功
    custApp.code=code;
    custApp.customer=customer;
    custApp.storeName=customer.name;
    saveCustApp();
    
    showCustomerHome();
  });
}

// 取得客戶可訂購的品項清單 (B+C: internalProducts + 食材庫存中 customerSell=true)
// 依客戶層級計算售價 (覆寫價 > 基準售價 × 層級折數)
function _tierPrice(prod,tierName){
  if(prod.tierOverrides&&tierName&&prod.tierOverrides[tierName]!=null&&prod.tierOverrides[tierName]!==''){return (+prod.tierOverrides[tierName])||0}
  var base=+prod.sellPrice||+prod.price||0;
  var tiers=(app.data&&app.data.tiers)||[];
  var t=tiers.find(function(x){return x.name===tierName});
  var rate=t?((+t.rate)||1):1;
  return Math.round(base*rate*100)/100;
}
function _getCustOrderableItems(){
  var items=[];
  var cust=custApp.customer;var tier=cust?cust.tier:null;
  // B: 轉售品項
  if(app.data&&app.data.internalProducts){
    app.data.internalProducts.forEach(function(p){
      items.push({
        id:p.id,
        source:'internal',
        name:p.name,
        unit:p.unit||'包',
        cat:p.cat||'轉售品項',
        price:_tierPrice(p,tier),
        cost:+p.cost||0
      });
    });
  }
  // C: 食材庫存中標記對外可賣
  if(app.data&&app.data.ings){
    app.data.ings.filter(function(i){return i.customerSell===true}).forEach(function(i){
      items.push({
        id:i.id,
        source:'ing',
        name:i.name,
        unit:i.unit||'公斤',
        cat:i.cat||'食材',
        price:_tierPrice(i,tier),
        cost:+i.price||0
      });
    });
  }
  return items;
}

// 應用客戶折扣率
function _applyDiscount(price,cust){
  var rate=cust.discountRate||1;
  return Math.round(price*rate*100)/100;
}

window.renderCustOrderItems=renderCustOrderItems;

window.adjustCustCart=function(itemId,delta){
  var cur=custCart[itemId]?custCart[itemId].qty:0;
  var newQty=Math.max(0,cur+delta);
  setCustCartQty(itemId,newQty);
  // 同步更新該品項 input 欄位
  var inp=document.getElementById('qty-'+itemId);
  if(inp)inp.value=newQty;
};

window.setCustCartQty=function(itemId,qty){
  qty=parseFloat(qty)||0;
  if(qty<=0){
    delete custCart[itemId];
  }else{
    var items=_getCustOrderableItems();
    var item=items.find(function(x){return x.id===itemId});
    if(!item)return;
    var price=_applyDiscount(item.price,custApp.customer);
    custCart[itemId]={
      id:item.id,
      source:item.source,
      name:item.name,
      unit:item.unit,
      qty:qty,
      price:price,
      total:Math.round(price*qty*100)/100
    };
  }
  updateCustCartSummary();
};

function updateCustCartSummary(){
  var keys=Object.keys(custCart);
  var summary=document.getElementById('cust-cart-summary');
  if(!summary)return;
  if(keys.length===0){
    summary.style.display='none';
    return;
  }
  var total=keys.reduce(function(s,k){return s+custCart[k].total},0);
  document.getElementById('cust-cart-count').textContent=keys.length;
  document.getElementById('cust-cart-total').textContent='$'+total.toLocaleString();
  summary.style.display='block';
}

window.clearCustCart=function(){
  if(Object.keys(custCart).length===0)return;

  custCart={};
  renderCustOrderItems();
};

window.confirmCustOrder=function(){

  if(!cust)return;
  var keys=Object.keys(custCart);
  if(keys.length===0){showToast('請先選擇品項','warning');return}
  
  var subtotal=keys.reduce(function(s,k){return s+custCart[k].total},0);
  var taxRate=0.05;
  var tax=Math.round(subtotal*taxRate);
  var total=subtotal+tax;
  
  // 風險檢查 - 額度

  var used=cust.creditUsed||0;

  var avail=Math.max(0,lim-used);

    alert('⚠️ 此次訂單金額超過可用額度\n\n本次訂單: $'+total.toLocaleString()+'\n可用額度: $'+avail.toLocaleString()+'\n\n請刪除部分品項或聯繫商家提升額度');

window.recalcCustReturn=function(orderId){
  var o=(app.data&&app.data.custOrders||[]).find(function(x){return x.id===orderId});
  if(!o)return;
  var subtotal=0;
  (o.items||[]).forEach(function(it,idx){
    var inp=document.getElementById('ret-qty-'+idx);
    if(inp){
      var qty=+inp.value||0;
      if(qty>(it.qty||0)){inp.value=it.qty;qty=it.qty}
      subtotal+=Math.round((it.price||0)*qty*100)/100;
    }
  });
  var total=Math.round(subtotal*1.05);
  var totalEl=document.getElementById('ret-total');
  if(totalEl)totalEl.textContent='$'+total.toLocaleString();
};

window.submitCustReturn=function(orderId){
  var o=(app.data&&app.data.custOrders||[]).find(function(x){return x.id===orderId});
  if(!o){showToast('找不到訂單','error');return}
  var cust=custApp.customer;
  if(!cust)return;
  
  var returnItems=[];
  var subtotal=0;
  (o.items||[]).forEach(function(it,idx){
    var inp=document.getElementById('ret-qty-'+idx);
    if(inp){
      var qty=+inp.value||0;
      if(qty>0){
        var amt=Math.round((it.price||0)*qty*100)/100;
        returnItems.push({name:it.name,unit:it.unit,qty:qty,origQty:it.qty,price:it.price,total:amt});
        subtotal+=amt;
      }
    }
  });
  
  if(returnItems.length===0){showToast('請至少選擇一個品項','warning');return}
  
  var tax=Math.round(subtotal*0.05);
  var total=subtotal+tax;
  var reason=(document.getElementById('ret-reason')||{}).value||'其他';
  var notes=(document.getElementById('ret-notes')||{}).value||'';
  
  if(!confirm('確認送出退貨申請?\n\n品項: '+returnItems.length+' 項\n退款合計: $'+total.toLocaleString()+'\n原因: '+reason+'\n\n等待商家審核'))return;
  
  // 寫入 app.data.custReturns
  if(!app.data)app.data={};
  if(!app.data.custReturns)app.data.custReturns=[];
  
  var now=new Date();
  var pad=function(n){return n<10?'0'+n:n};
  var nowStr=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());
  var returnId='CR'+now.getTime();
  
  app.data.custReturns.push({
    id:returnId,
    origOrderId:o.id,
    custId:cust.id,
    custCode:cust.code,
    custName:cust.name,
    items:returnItems,
    subtotal:subtotal,
    tax:tax,
    refundAmt:total,
    reason:reason,
    needCreditNote:!!o.invoiceNo,
    creditNoteNo:'',
    status:'pending',
    createdAt:nowStr,
    createdBy:cust.name+'(客戶)',
    notes:notes
  });
  
  // 訂單狀態改為退貨中
  o.status='returned';
  o.returnId=returnId;
  
  showToast('🔄 送出中...');
  cloudPush();
  
  setTimeout(function(){
    var c=document.getElementById('app-content');
    c.innerHTML='<div style="padding:16px;max-width:600px;margin:0 auto">'+
      '<div class="card" style="padding:30px;text-align:center;background:linear-gradient(135deg,#FEF2E5,#fff)">'+
        '<div style="font-size:3rem;margin-bottom:12px">↩️</div>'+
        '<div style="font-size:1.2rem;font-weight:700;color:#B82525;margin-bottom:8px">退貨申請已送出</div>'+
        '<div style="font-size:0.84rem;color:var(--txt3);margin-bottom:14px">商家收到後會審核並聯繫您</div>'+
        '<div style="background:#fff;padding:12px;border-radius:8px;margin-bottom:14px;text-align:left">'+
          '<div style="display:flex;justify-content:space-between;font-size:0.84rem;margin-bottom:4px"><span style="color:var(--txt3)">退貨編號</span><span style="font-family:monospace;font-weight:700">'+returnId+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;font-size:0.84rem;margin-bottom:4px"><span style="color:var(--txt3)">退款金額</span><span style="font-weight:700;color:#B82525">$'+total.toLocaleString()+'</span></div>'+
        '</div>'+
        '<button class="btn btn-pri" onclick="showCustomerOrderHistory()" style="width:100%;margin-bottom:8px">📋 返回我的訂單</button>'+
      '</div>'+

    cloudPull(function(ok){
      if(ok){
        // 重新驗證客戶資料(可能管理端已修改)
        var freshCust=(app.data&&app.data.customers||[]).find(function(x){return x.code===custApp.code});
        if(freshCust){
          // 風險再檢查
          var errs=_checkCustRisk(freshCust);
          if(errs.length){
            // 風險不通過 → 重登
            clearCustApp();
            showCustomerLogin();
            setTimeout(function(){showToast(errs[0],'error')},500);
          }else{
            custApp.customer=freshCust;
            saveCustApp();
            showCustomerHome();
          }
        }else{
          clearCustApp();
          showCustomerLogin(_getQueryParam('code'));
        }
      }else{
        showCustomerLogin(_getQueryParam('code'));
      }
    });
  }else{
    // 未登入 — 連結帶 code 則自動登入,否則顯示登入頁(預填)
    var _uc=_getQueryParam('code');
    showCustomerLogin(_uc);
    if(_uc&&/^\d{3}$/.test(_uc)){setTimeout(function(){if(window.doCustLogin)doCustLogin()},60)}
  }
}else if(app.store&&app.firebaseUrl){
  document.getElementById('tab-bar').style.display='';
  updateHeader();
  cloudPull(function(ok){
    if(ok){
      switchTab('home');
    }else{
      // 🟢 fix #13: 拉取失敗仍進入首頁,但提示使用者
      switchTab('home');
      showToast('⚠️ 同步失敗,顯示本地暫存','warning');
    }
  });
}else{
  showSetup();
}
</script>
</body>
</html>
