<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>好洺餐飲事業有限公司 — 生產管理系統 v2.3.0</title>
<style>
/* ══════════════════════════════════════════════════════
   好洺餐飲 生產管理系統 — Warm Kitchen Theme v1.0
   溫暖專業 · 高對比 · 易讀 · 快速上手
   ══════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
html{font-size:clamp(14px,1.4vw,16.5px)}
:root{
  --pri:#0A6847;--pri-d:#064535;--pri-l:#E8F5EE;--pri-bg:#F0FAF5;
  --amber:#9A6210;--amber-d:#7A4D0B;--amber-l:#FFF8ED;--amber-m:#F0C060;--amber-bg:#FFFDF7;
  --teal:#0A5A46;--teal-d:#064535;--teal-l:#DFF5EC;
  --g50:#FAFAF8;--g100:#F5F3EF;--g200:#E8E6E0;--g300:#B0AEA6;--g400:#706E68;--g500:#555350;--g600:#3E3D3A;--g700:#2C2C2A;--g800:#1E1E1C;
  --red:#C02828;--red-l:#FEF0F0;--red-d:#8C1A1A;
  --blue:#1460A8;--blue-l:#EDF4FC;
  --card:#FFFFFF;--bg:#F0EDE7;--bg2:#E8E5DF;
  --brd:1px solid #D4D2CC;--brd-l:1px solid #E8E6E0;--r:12px;--r-sm:8px;--r-lg:16px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);--shadow-md:0 4px 16px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.14);
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',-apple-system,sans-serif
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:1rem;background:var(--bg);color:var(--g800);min-height:100vh;line-height:1.65;letter-spacing:.02em;-webkit-font-smoothing:antialiased}

/* ── Top Bar ── */
#topbar{background:linear-gradient(180deg,#1A1A18 0%,#252523 100%);color:#F3F1EB;position:sticky;top:0;z-index:999;box-shadow:0 2px 16px rgba(0,0,0,.3)}
#topbar-row1{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-size:1.08rem;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:10px;letter-spacing:.04em;cursor:pointer}
.logo-dot{width:10px;height:10px;background:#D4950F;border-radius:50%;box-shadow:0 0 8px rgba(212,149,15,.45)}
#topbar-row2{display:flex;align-items:center;padding:4px 16px 6px}
#nav-bar{display:flex;gap:3px;flex-wrap:wrap;flex:1;padding:2px 0;-webkit-overflow-scrolling:touch}
.nav-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.68);padding:6px 12px;cursor:pointer;font-size:0.8rem;font-family:var(--font);transition:all .2s;white-space:nowrap;border-radius:var(--r-sm);font-weight:500;letter-spacing:.02em;margin:1px 0}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
.nav-btn.active{color:#FFF;background:rgba(212,149,15,.2);border-color:rgba(212,149,15,.6);font-weight:700;box-shadow:0 0 8px rgba(212,149,15,.15)}
.nav-divider{color:rgba(255,255,255,.12);padding:0 3px;align-self:center;user-select:none;flex-shrink:0;font-size:0.65rem}
#topbar-right{margin-left:auto;font-size:0.82rem;color:rgba(255,255,255,.6);flex-shrink:0;padding-left:12px;font-weight:500}

/* ── Layout ── */
#cost-section{display:block}#order-section{display:none}
#cost-content{padding:20px 28px;max-width:1440px;margin:0 auto}
.page-title{font-size:1.25rem;font-weight:700;color:var(--g800);margin-bottom:20px;letter-spacing:.03em;line-height:1.3}

/* ── Cards ── */
.card{background:var(--card);border-radius:var(--r);border:var(--brd-l);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow-sm);transition:box-shadow .2s}
.card:hover{box-shadow:var(--shadow-md)}
.card-title{font-size:0.92rem;font-weight:700;color:var(--g700);margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--g100);letter-spacing:.02em;display:flex;align-items:center;gap:6px}

/* ── Grids ── */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* ── Metrics ── */
.metric{background:var(--g50);border-radius:var(--r-sm);padding:14px 16px;border:var(--brd-l);text-align:center;transition:transform .15s}
.metric:hover{transform:translateY(-2px)}
.metric-label{font-size:0.75rem;color:var(--g400);font-weight:500;margin-bottom:6px;text-transform:none;letter-spacing:.03em}
.metric-val{font-size:1.55rem;font-weight:700;color:var(--teal);line-height:1.2}
.metric-sub{font-size:0.72rem;color:var(--g300);margin-top:3px}

/* ── Tables ── */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:0.88rem}
.tbl th{background:var(--g100);padding:10px 14px;text-align:left;font-weight:600;color:var(--g500);font-size:0.8rem;letter-spacing:.04em;text-transform:none;border-bottom:2px solid var(--g200);position:sticky;top:0;z-index:1}
.tbl td{padding:10px 14px;border-bottom:var(--brd-l);color:var(--g700);vertical-align:middle;line-height:1.5}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:var(--g50)}
.tbl tbody tr:nth-child(even){background:rgba(245,243,239,.5)}
.tbl tbody tr:nth-child(even):hover{background:var(--g50)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--r-sm);padding:10px 20px;font-size:0.9rem;cursor:pointer;font-family:var(--font);font-weight:600;transition:all .2s;letter-spacing:.02em;line-height:1.3}
.btn:active{transform:scale(.97)}
.btn-primary,.btn-pri{background:var(--pri);color:#fff;box-shadow:0 2px 6px rgba(10,104,71,.2)}
.btn-primary:hover,.btn-pri:hover{background:var(--pri-d);box-shadow:0 4px 12px rgba(10,104,71,.25)}
.btn-outline{background:var(--card);border:1.5px solid var(--g200);color:var(--g600)}
.btn-outline:hover{border-color:var(--g300);background:var(--g50);color:var(--g800)}
.btn-danger{background:var(--red);color:#fff;box-shadow:0 2px 6px rgba(192,40,40,.2)}
.btn-danger:hover{background:var(--red-d)}
.btn-success{background:var(--pri);color:#fff}.btn-success:hover{background:var(--pri-d)}
.btn-sm{padding:6px 14px;font-size:0.82rem;font-weight:600;border-radius:6px}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:600;letter-spacing:.02em}
.badge-green{background:var(--pri-l);color:var(--pri)}
.badge-red{background:var(--red-l);color:var(--red)}
.badge-warn{background:var(--amber-l);color:var(--amber)}
.badge-blue{background:var(--blue-l);color:var(--blue)}
.badge-gray{background:var(--g100);color:var(--g400)}

/* ── Forms ── */
.fg{margin-bottom:12px}
.fg label{display:block;font-size:0.82rem;font-weight:600;color:var(--g500);margin-bottom:5px;letter-spacing:.02em}
.fg input,.fg select,.fg textarea{width:100%;border:1.5px solid var(--g200);border-radius:var(--r-sm);padding:10px 14px;font-size:0.92rem;font-family:var(--font);background:var(--card);color:var(--g800);transition:all .2s;outline:none;line-height:1.4}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(10,104,71,.1);background:#fff}
.fg input::placeholder{color:var(--g300);font-weight:400}
.form-row{display:grid;gap:12px;margin-bottom:4px}
.form-row.c2{grid-template-columns:1fr 1fr}
.form-row.c3{grid-template-columns:1fr 1fr 1fr}
.form-row.c4{grid-template-columns:repeat(4,1fr)}
.form-row.c5{grid-template-columns:repeat(5,1fr)}

/* ── Modal ── */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal-box{background:var(--card);border-radius:var(--r-lg);width:auto;min-width:460px;max-width:95vw;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal-title{font-size:1.05rem;font-weight:700;padding:18px 24px;border-bottom:2px solid var(--g100);color:var(--g800);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--card);z-index:1;border-radius:var(--r-lg) var(--r-lg) 0 0}
.modal-body{padding:20px 24px}
.save-btns{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:var(--brd-l);background:var(--g50);border-radius:0 0 var(--r-lg) var(--r-lg)}

/* ── Toast ── */
.toast-wrap{position:fixed;top:80px;right:24px;z-index:9000}
.toast-item{background:var(--g800);color:#fff;padding:12px 22px;border-radius:var(--r);font-size:0.9rem;font-weight:500;box-shadow:var(--shadow-lg);animation:toastIn .3s ease;margin-bottom:8px}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* ── Tips / Warnings ── */
.tip{background:var(--amber-l);border-left:4px solid var(--amber);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 16px;font-size:0.86rem;color:var(--amber-d);margin-bottom:14px;line-height:1.6}
.warn-box{background:var(--red-l);border-left:4px solid var(--red);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 16px;font-size:0.86rem;color:var(--red-d);margin-bottom:14px;line-height:1.6}

/* ── SOP ── */
.sop-toggle{background:var(--pri-l);border:1.5px solid rgba(10,104,71,.15);border-radius:var(--r-sm);padding:10px 16px;cursor:pointer;font-size:0.86rem;color:var(--pri);font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;transition:all .2s}
/* 🆕 SOP 區塊收合控制 */
.sop-box{background:var(--pri-l);border:1.5px solid rgba(10,104,71,.15);border-radius:var(--r-sm);margin-bottom:14px;overflow:hidden;transition:all .2s}
.sop-header{padding:10px 16px;cursor:pointer;font-size:0.86rem;color:var(--pri);font-weight:600;display:flex;justify-content:space-between;align-items:center;transition:background .15s}
.sop-header:hover{background:rgba(10,104,71,.08)}
.sop-header-left{display:flex;align-items:center;gap:8px}
.sop-badge{background:rgba(10,104,71,.15);color:var(--pri);padding:2px 10px;border-radius:12px;font-size:0.74rem;font-weight:700}
.sop-toggle{transition:transform .2s;font-size:0.78rem;background:transparent;border:none;padding:0;margin:0;color:var(--pri)}
.sop-toggle.open{transform:rotate(180deg)}
.sop-body{display:none;padding:0 16px 14px}
.sop-body.open{display:block}
.sop-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 14px;font-size:0.82rem}
.sop-flow-step{background:#fff;border:1px solid rgba(10,104,71,.2);border-radius:6px;padding:5px 10px;font-weight:600;color:var(--pri)}
.sop-flow-arrow{color:var(--pri);font-weight:700}
.sop-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:8px}
.sop-section{background:#fff;border-radius:6px;padding:12px 14px;border:1px solid rgba(10,104,71,.1)}
.sop-section-title{font-weight:700;color:var(--pri);font-size:0.92rem;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(10,104,71,.1)}
.sop-steps{list-style:none;padding:0;margin:0}
.sop-steps li{display:flex;gap:8px;padding:5px 0;font-size:0.82rem;line-height:1.5}
.sop-num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--pri);color:#fff;border-radius:50%;font-size:0.7rem;font-weight:700;flex-shrink:0;margin-top:2px}
.sop-warn{background:#FCE8E8;border-left:3px solid #B82525;border-radius:4px;padding:6px 10px;margin-top:8px;font-size:0.8rem;color:#B82525}
.sop-tip{background:#FFF8ED;border-left:3px solid #f5c98a;border-radius:4px;padding:6px 10px;margin-top:6px;font-size:0.8rem;color:#9A6210}
/* 🆕 searchSelect 快速搜尋下拉 */
.ss-wrap{position:relative}
.ss-input{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:0.86rem;background:#fff;transition:border-color .15s}
.ss-input:focus{outline:none;border-color:#0A5A46;box-shadow:0 0 0 2px rgba(10,104,71,.1)}
.ss-list{position:absolute;top:calc(100% + 2px);left:0;right:0;background:#fff;border:1px solid #ccc;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.12);max-height:240px;overflow-y:auto;z-index:1000}
.ss-item{padding:8px 12px;cursor:pointer;font-size:0.86rem;border-bottom:1px solid #f0f0f0;transition:background .12s}
.ss-item:last-child{border-bottom:none}
.ss-item:hover{background:#f3f7f5;color:#0A5A46}
.ss-empty{padding:14px;color:#999;text-align:center;font-size:0.82rem;font-style:italic}
.sop-toggle:hover{background:var(--pri-bg);border-color:rgba(10,104,71,.25)}
.sop-content{background:var(--card);border:var(--brd-l);border-radius:0 0 var(--r-sm) var(--r-sm);padding:16px 20px;margin-top:-14px;margin-bottom:14px;font-size:0.86rem;line-height:1.7}
.sop-flow{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sop-step{background:var(--pri-l);color:var(--pri);padding:4px 12px;border-radius:20px;font-size:0.78rem;font-weight:600}
.sop-arrow{color:var(--g300);font-size:0.7rem}
.sop-section-title{font-weight:700;color:var(--g700);margin:10px 0 6px;font-size:0.88rem}
.sop-steps{padding-left:20px;color:var(--g500);margin-bottom:8px}
.sop-steps li{margin-bottom:4px;line-height:1.6}
.sop-tip{background:var(--amber-l);border-radius:6px;padding:8px 12px;font-size:0.82rem;color:var(--amber-d);margin-top:6px}
.sop-warn{background:var(--red-l);border-radius:6px;padding:8px 12px;font-size:0.82rem;color:var(--red-d);margin-top:6px}

/* ── Recipe ── */
.recipe-list{border-right:var(--brd);overflow-y:auto;max-height:70vh}
.recipe-item{padding:10px 14px;cursor:pointer;border-bottom:var(--brd-l);transition:background .15s;font-size:0.88rem}
.recipe-item:hover{background:var(--g50)}
.recipe-item.active{background:var(--pri-l);border-left:3px solid var(--pri)}
.recipe-detail{padding:16px 20px;overflow-y:auto;max-height:70vh}
.recipe-ing-row{display:grid;grid-template-columns:46px 2fr 80px 60px 90px 36px;gap:6px;align-items:center;padding:6px 0;border-bottom:var(--brd-l);font-size:0.88rem}

/* ── Action Bar (叫貨表) ── */
.action-bar{background:var(--card);padding:14px 24px;border-bottom:var(--brd);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tab-nav{display:flex;gap:2px;overflow-x:auto;padding-bottom:4px}
.tab-nav button{padding:10px 18px;border:none;background:transparent;color:var(--g400);font-weight:600;cursor:pointer;font-family:var(--font);font-size:0.88rem;border-bottom:2.5px solid transparent;transition:.2s;white-space:nowrap}
.tab-nav button.active{color:var(--pri);border-bottom-color:var(--pri)}
.tab-nav button:hover{color:var(--g700)}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--g200);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--g300)}

/* ── Print ── */
@media print{#topbar,.nav-btn,.btn,.sop-toggle{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd}}

/* ── RWD 480px ── */
@media(max-width:480px){
  html{font-size:clamp(13px,4vw,15px)}
  .grid4,.grid3{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .form-row.c4,.form-row.c5,.form-row.c3{grid-template-columns:1fr 1fr}
  .form-row.c2{grid-template-columns:1fr}
  #topbar-row1{padding:6px 12px}
  #topbar-row2{padding:2px 8px 4px}
  .logo{font-size:0.92rem}
  .nav-btn{padding:4px 8px;font-size:0.76rem}
  .action-bar{padding:10px 14px;flex-direction:column;gap:10px}
  .btns{width:100%;justify-content:center;flex-wrap:wrap}
  .card{padding:14px 16px;border-radius:var(--r-sm)}
  .page-title{font-size:1.05rem}
  .modal-title{font-size:1rem;padding:14px 16px}
  .modal-body{padding:14px 16px}
  .tbl th,.tbl td{padding:7px 10px;font-size:0.82rem}
  .metric-val{font-size:1.3rem}
  .metric{padding:10px 12px}
  .recipe-ing-row{grid-template-columns:34px 1fr 70px 55px 80px 30px;gap:4px}
  #cost-content{padding:12px}
  .btn{padding:8px 14px;font-size:0.86rem}
  .save-btns{padding:12px 16px}
}
/* ── RWD 360px ── */
@media(max-width:360px){
  .grid4,.grid3,.grid2{grid-template-columns:1fr}
  .form-row.c4,.form-row.c5,.form-row.c3,.form-row.c2{grid-template-columns:1fr}
  .nav-btn{padding:3px 6px;font-size:0.74rem}
  .metric-val{font-size:1.1rem}
}
/* 捲動條樣式 - 更明顯易辨識 */
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:#E8E5DA;border-radius:7px;border:1px solid #D5D1C3}
::-webkit-scrollbar-thumb{background:#0A5A46;border-radius:7px;border:2px solid #E8E5DA;min-height:40px}
::-webkit-scrollbar-thumb:hover{background:#0E7558;border:2px solid #DDD6C2}
::-webkit-scrollbar-thumb:active{background:#16876D}
::-webkit-scrollbar-corner{background:#E8E5DA}
* {scrollbar-width:auto;scrollbar-color:#0A5A46 #E8E5DA} /* Firefox */
/* Modal 內捲動條較細,但仍清楚 */
#modal-ov::-webkit-scrollbar{width:12px}
#modal-ov::-webkit-scrollbar-thumb{background:#BA7517;border:2px solid rgba(0,0,0,.1)}
#modal-ov::-webkit-scrollbar-thumb:hover{background:#D49B30}
</style>
<!-- 🆕 Google Identity Services (Google Drive 自動備份用) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="topbar">
  <div id="topbar-row1">
    <div class="logo" style="cursor:pointer" onclick="showVersionInfo()"><span class="logo-dot"></span><span>好洺餐飲事業有限公司 生產管理系統</span><span style="font-size:0.65rem;color:rgba(255,255,255,.4);margin-left:6px;font-weight:400">v2.3.0</span></div>

function _saveToFirebase(){
  if(!initFirebaseSDK())return;
  if(_cloudSyncing)return;
  _cloudSyncing=true;
  var stateClone=JSON.parse(JSON.stringify(state));
  delete stateClone.cloudConfig;
  
  // 主資料存到 erp/state/main
  _fbDb.collection('erp').doc('state').set({
    data:stateClone,
    updated_at:firebase.firestore.FieldValue.serverTimestamp(),
    device:state.cloudConfig.deviceName||'主系統'
  }).then(function(){
    _cloudSyncing=false;
    state.cloudConfig.lastSync=new Date().toISOString();
    try{localStorage.setItem(COST_KEY,JSON.stringify(state))}catch(e){}
    // 同步寫入共用區（給財會系統讀取）
    _writeSharedData(stateClone);
  }).catch(function(e){
    _cloudSyncing=false;
    console.error('Firestore save error:',e);
  });
}

// 寫入 shared/ 共用區 — 財會系統可直接讀取
function _writeSharedData(data){
  if(!_fbDb)return;
  var now=new Date();
  var mon=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  
  // 轉售出貨摘要
  var orders=(data.internalOrders||[]).filter(function(o){return o.date&&o.date.startsWith(mon.replace(now.getFullYear(),now.getFullYear()))&&o.status!=='已取消'});
  if(orders.length){
    var salesByStore={};
    orders.forEach(function(o){
      if(!salesByStore[o.store])salesByStore[o.store]={items:[],totalCost:0,totalSell:0};
      salesByStore[o.store].totalCost+=o.totalCost||0;
      salesByStore[o.store].totalSell+=o.totalAmt||0;
      (o.items||[]).forEach(function(it){salesByStore[o.store].items.push({name:it.name,qty:it.qty,cost:it.subtotalCost,sell:it.subtotalSell,date:o.date})});
    });
    _fbDb.collection('shared').doc(mon).collection('erp').doc('internal_sales').set({
      data:salesByStore,source:'erp',updated_at:firebase.firestore.FieldValue.serverTimestamp()
    }).catch(function(e){console.log('Shared write error:',e)});
  }
  
  // 進貨摘要
  var buys=(data.buyLog||[]).filter(function(b){return b.date&&b.date.startsWith(mon.replace(now.getFullYear(),now.getFullYear()))});
  if(buys.length){
    _fbDb.collection('shared').doc(mon).collection('erp').doc('purchases').set({
      data:buys,source:'erp',updated_at:firebase.firestore.FieldValue.serverTimestamp()
    }).catch(function(e){console.log('Shared write error:',e)});
  }
  
  // 應付帳款
  var ap=(data.apList||[]).filter(function(a){return a.status==='未付款'});
  if(ap.length){
    _fbDb.collection('shared').doc('current').collection('erp').doc('accounts_payable').set({
      data:ap,source:'erp',updated_at:firebase.firestore.FieldValue.serverTimestamp()
    }).catch(function(e){console.log('Shared write error:',e)});
  }
}

window.importSheetProducts=function(){
  if(!confirm('要把現有 4 張叫貨表的商品（共 '+SHEET_IMPORT_SEED.length+' 項）匯入商品清單嗎？\n\n價格會用叫貨表上的價（門市付的價不變）。\n已存在的同名商品會自動略過。'))return;
  if(!state.internalProducts)state.internalProducts=[];
  var seen={};state.internalProducts.forEach(function(p){seen[(p.name||'')+'|'+(p.category||'')]=1});
  var added=0,skipped=0;
  SHEET_IMPORT_SEED.forEach(function(r,i){
    var key=r[0]+'|'+r[3];
    if(seen[key]){skipped++;return}
    state.internalProducts.push({id:'IP'+Date.now()+'_'+i,name:r[0],type:'原裝轉售',category:r[3],spec:'',unit:r[1],cost:0,sellPrice:r[2],sourceItems:'',note:'由叫貨表匯入',tierOverrides:{}});
    seen[key]=1;added++;
  });
  if(added===0){if(typeof toast==='function')toast('沒有新商品可匯入（已全部匯入過）');return}
  if(typeof addAudit==='function')addAudit('匯入叫貨表商品',added+'項');
  saveState();renderPage();
  alert('✅ 已匯入 '+added+' 項商品到商品清單'+(skipped>0?'\n（'+skipped+' 項已存在，略過）':''));
};

window.openResalePoolView=function(){
  var pool=getResalePool();var tiers=getTiers();
  var thead='<tr><th>商品</th><th>來源</th><th style="text-align:right">成本</th><th style="text-align:right">基準售價</th>'+tiers.map(function(t){return '<th style="font-size:0.74rem;text-align:right">'+esc(t.name)+'</th>'}).join('')+'</tr>';
  var rows=pool.length?pool.map(function(p){
    var srcBadge=p.source==='internal'?'<span class="badge badge-blue">轉售品項</span>':'<span class="badge badge-warn">自製品</span>';
    var tcells=tiers.map(function(t){var ov=p.tierOverrides&&p.tierOverrides[t.name]!=null&&p.tierOverrides[t.name]!=='';var price=window.getTierPrice(p,t.name);return '<td style="text-align:right'+(ov?';color:#B82525;font-weight:700':'')+'">'+CUR()+fmt(price,1)+(ov?' *':'')+'</td>'}).join('');
    return '<tr><td style="font-weight:600">'+esc(p.name)+'</td><td>'+srcBadge+'</td><td style="text-align:right;color:#706E68">'+CUR()+fmt(p.cost,1)+'</td><td style="text-align:right;font-weight:700;color:#7A4D0B">'+CUR()+fmt(p.sellPrice,1)+'</td>'+tcells+'</tr>';
  }).join(''):'<tr><td colspan="'+(4+tiers.length)+'" style="text-align:center;color:#999;padding:20px">尚無可轉售商品 — 轉售品項自動納入;配方需勾「納入轉售商品池」</td></tr>';
  var html='<div style="font-size:1.1rem;font-weight:700;margin-bottom:6px">🛒 可轉售商品池 ('+pool.length+' 項)</div><div style="font-size:0.8rem;color:#706E68;margin-bottom:10px">轉售品項全數納入;配方需在編輯時勾選「納入轉售商品池」。紅字 * = 該層級為個別覆寫價。Phase 2 門市叫貨 / Phase 3 客戶下單會讀此池。</div><div style="overflow-x:auto"><table class="tbl" style="font-size:0.84rem"><thead>'+thead+'</thead><tbody>'+rows+'</tbody></table></div><div class="save-btns" style="margin-top:14px"><button class="btn btn-primary" onclick="closeModal()">關閉</button></div>';
  modal(html,true);
};
const opts=(arr,sel)=>arr.map(v=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(v)}</option>`).join('');

function dv(a,...k){const e=document.createElement('div');if(a){if(a.cls)e.className=a.cls;if(a.style)e.style.cssText=a.style;if(a.id)e.id=a.id;if(a.html)e.innerHTML=a.html}k.filter(Boolean).forEach(c=>e.appendChild(typeof c==='string'?document.createTextNode(c):c));return e}
function el(tag,attrs,...kids){const e=document.createElement(tag);Object.entries(attrs||{}).forEach(([k,v])=>{if(k==='cls')e.className=v;else if(k==='html')e.innerHTML=v;else if(k==='txt')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)});kids.filter(Boolean).forEach(c=>e.appendChild(typeof c==='string'?document.createTextNode(c):c));return e}
function btn(cls,txt,fn){return el('button',{cls,onclick:fn,txt})}
const imap=()=>Object.fromEntries(state.ings.map(i=>[i.name,i]));

function metCard(label,val,sub,col){const w=dv({cls:'metric'});w.appendChild(el('span',{cls:'metric-label'},label));const vd=dv({cls:'metric-val'},String(val));if(col)vd.style.color=col;w.appendChild(vd);if(sub)w.appendChild(dv({style:'font-size:0.78rem;color:#555350;margin-top:4px'},sub));return w}
const sbadge=(s,sf)=>s<=0?'<span class="badge badge-red">❌ 缺貨</span>':s<=sf?'<span class="badge badge-warn">⚠️ 低庫存</span>':'<span class="badge badge-green">✅ 充足</span>';
const mbadge=m=>{const t=state.meta.targetMargin||0.65;return m==null?'<span class="badge badge-gray">未設定</span>':m>=t?'<span class="badge badge-green">✅ 達標</span>':m>=(t-0.1)?'<span class="badge badge-warn">⚠️ 尚可</span>':'<span class="badge badge-red">❌ 偏低</span>'};

// Modal system
function _snapshotModalForm(){
  // 快照 modal 內所有可編輯欄位的當前值,作為「未改動」的基準
  var ov=$('modal-ov');if(!ov)return null;
  var snap={};
  ov.querySelectorAll('input,select,textarea').forEach(function(el,idx){
    var key=el.id||('_idx_'+idx);
    if(el.type==='checkbox'||el.type==='radio'){snap[key]=el.checked}
    else{snap[key]=el.value||''}
  });
  return snap;
}
function _isModalDirty(){
  // 判斷 modal 內容是否有改動
  if(!window._modalSnapshot)return false;
  var ov=$('modal-ov');if(!ov)return false;
  var dirty=false;
  ov.querySelectorAll('input,select,textarea').forEach(function(el,idx){
    if(dirty)return;
    var key=el.id||('_idx_'+idx);
    var cur=(el.type==='checkbox'||el.type==='radio')?el.checked:(el.value||'');
    if(window._modalSnapshot[key]!==undefined&&window._modalSnapshot[key]!==cur)dirty=true;
  });
  return dirty;
}

// 🆕 modal 內按 Enter 自動觸發儲存按鈕 (全域監聽,不依賴焦點)
function _bindModalEnterToSave(ov){
  if(window._modalEnterBound)return;
  window._modalEnterBound=true;
  
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    if(e.shiftKey||e.ctrlKey||e.metaKey||e.altKey)return;
    
    // modal 是否開啟
    var mov=document.getElementById('modal-ov');
    if(!mov||mov.style.display==='none')return;
    
    // 焦點在哪個元素
    var t=e.target;
    var tag=(t&&t.tagName||'').toLowerCase();
    if(tag==='textarea')return;  // textarea Enter 是換行
    if(t&&t.contentEditable==='true')return;
    
    // 智慧搜尋下拉框內 (避免衝突)
    if(t&&t.classList){
      if(t.classList.contains('smart-search-input'))return;
      if(t.classList.contains('ss-input'))return;
      // 父層含 smart-select 的也擋
      var p=t.parentElement;
      while(p&&p!==mov){
        if(p.classList&&(p.classList.contains('smart-select')||p.classList.contains('ss-dropdown')))return;
        p=p.parentElement;
      }
    }
    
    // select 開啟下拉時 Enter 是選擇,不要搶
    if(tag==='select')return;
    
    // 找儲存按鈕 (modal 內) — 優先級從高到低
    var saveBtn=null;
    
    // 優先 1:.save-btns 區塊內的 .btn-primary (mF 函式產生的儲存按鈕,最可靠)
    var saveBtns=mov.querySelectorAll('.save-btns .btn-primary');
    if(saveBtns.length>0)saveBtn=saveBtns[saveBtns.length-1];
    
    // 優先 2: onclick 開頭是 save (排除 saveBuy/saveIng 等真正儲存,排除 apply/import 等)
    if(!saveBtn){
      var btns=mov.querySelectorAll('button');
      for(var i=0;i<btns.length;i++){
        var b=btns[i];
        var oc=b.getAttribute('onclick')||'';
        // 必須以 save 開頭 (saveIng/saveBuy/saveRecipe 等)
        if(/^save[A-Z]/.test(oc.trim())||/^submit[A-Z]/.test(oc.trim())){saveBtn=b;break}
      }
    }
    
    // 優先 3: 文字含「儲存/確定/送出/新增/建立/提交」(精準關鍵字,不用圖示避免誤判)
    if(!saveBtn){
      var btns2=mov.querySelectorAll('button');
      for(var j=0;j<btns2.length;j++){
        var b2=btns2[j];
        var txt=(b2.textContent||'').trim();
        if(/儲存|確定送出|^✔ 儲存|^💾/.test(txt)){saveBtn=b2;break}
      }
    }
    
    // 優先 4 (Fallback): 最後一個 .btn-primary
    if(!saveBtn){
      var primaries=mov.querySelectorAll('.btn-primary');
      if(primaries.length>0)saveBtn=primaries[primaries.length-1];
    }
    
    if(saveBtn){
      e.preventDefault();
      saveBtn.click();
    }
  });
}

// ═══ SmartSelect 智慧搜尋下拉系統 ═══
// 把指定的 <select> 升級為可搜尋下拉,使用者可打關鍵字過濾
// 升級後 select 仍存在(隱藏),value 同步,saveXxx 邏輯不用改
function _smartSelectExtractData(opt,id){
  // 從原 option 抽出搜尋資料(name/code/cat/sup)
  var data={value:opt.value,label:opt.text,id:'',cat:'',sup:'',extra:''};
  // 食材選單 (b-ing/mu-ing1/w-name/lb-ing/tr-rec) 通常 value=name, 從 state.ings 比對找
  if(state&&state.ings&&['b-ing','mu-ing1','w-name','tr-rec','lb-ing','sc-rec'].indexOf(id)>=0){
    var ing=state.ings.find(function(x){return x.name===opt.value||x.id===opt.value});
    if(ing){data.id=ing.id;data.cat=ing.cat||'';data.sup=ing.sup||''}
  }
  // 供應商選單(b-sup/po-sup/qc-sup/fi-sup) 通常 value=id, 從 state.sups 比對
  if(state&&state.sups&&['b-sup','po-sup','qc-sup','fi-sup'].indexOf(id)>=0){
    var sup=state.sups.find(function(x){return x.id===opt.value});
    if(sup){data.id=sup.id;data.cat=sup.type||'';data.extra=sup.contact||''}
  }
  // 配方選單(pd-rec/lb-rec/wo-recipe/tr-rec/sc-rec)
  if(state&&state.recipes&&['pd-rec','lb-rec','wo-recipe','sc-rec'].indexOf(id)>=0){
    var rec=state.recipes.find(function(x){return x.id===opt.value||x.name===opt.value});
    if(rec){data.id=rec.id;data.cat=rec.cat||'';data.extra=rec.code||''}
  }
  return data;
}

function enhanceSelect(sel){
  if(!sel||sel._smartSelectAttached)return;
  if(sel.tagName!=='SELECT')return;
  if(sel.multiple)return;  // 多選不支援
  var optionCount=sel.options.length;
  if(optionCount<6)return;  // 選項少不需要搜尋
  if(sel.dataset.noSmart==='1')return;  // 明確標記不要升級
  sel._smartSelectAttached=true;
  
  // 建立 wrapper
  var wrap=document.createElement('div');
  wrap.style.cssText='position:relative;width:100%';
  sel.parentNode.insertBefore(wrap,sel);
  wrap.appendChild(sel);
  sel.style.display='none';
  sel.setAttribute('data-smart-hidden','1');
  
  // 抽出所有選項資料
  var optsData=[];
  for(var i=0;i<sel.options.length;i++){
    optsData.push(_smartSelectExtractData(sel.options[i],sel.id));
  }
  
  // 建立 input 顯示框
  var input=document.createElement('input');
  input.type='text';
  input.autocomplete='off';
  input.placeholder='🔍 點此搜尋或選擇...';
  input.style.cssText='width:100%;padding:8px 12px;border:1px solid #C9C5BA;border-radius:6px;background:#fff;cursor:pointer;font-family:inherit;font-size:0.92rem';
  // 設定當前選中值的顯示
  var curOpt=optsData.find(function(o){return o.value===sel.value});
  if(curOpt&&curOpt.value){input.value=curOpt.label}
  wrap.appendChild(input);
  
  // 建立 dropdown
  var drop=document.createElement('div');
  drop.style.cssText='position:absolute;top:100%;left:0;right:0;z-index:3000;background:#fff;border:1px solid #C9C5BA;border-top:none;border-radius:0 0 6px 6px;max-height:280px;overflow-y:auto;box-shadow:0 6px 18px rgba(0,0,0,.12);display:none';
  wrap.appendChild(drop);
  
  var hilite=-1;  // 鍵盤上下方向高亮位置
  var visList=[];
  
  function renderList(query){
    query=(query||'').trim().toLowerCase();
    visList=optsData.filter(function(o){
      // 「— 請選擇 —」這類空 value 選項:無搜尋字時顯示,有搜尋字時隱藏
      if(!o.value){return !query}
      if(!query)return true;
      var hay=(o.label+' '+o.id+' '+o.cat+' '+o.sup+' '+o.extra+' '+o.value).toLowerCase();
      return hay.indexOf(query)>=0;
    });
    if(!visList.length){
      drop.innerHTML='<div style="padding:14px 12px;color:#999;text-align:center;font-size:0.88rem">📭 找不到符合條件的項目</div>';
      return;
    }
    var html='';
    visList.forEach(function(o,idx){
      var isSel=o.value===sel.value;
      var bg=idx===hilite?'#FFF8ED':(isSel?'#DFF5EC':'#fff');
      var labelHtml=o.label||'<i style="color:#999">— 請選擇 —</i>';
      // 標籤(類別/供應商)
      var tags='';
      if(o.cat)tags+='<span style="display:inline-block;background:#F3F1EB;color:#555;padding:1px 7px;border-radius:10px;font-size:0.72rem;margin-left:4px">'+o.cat+'</span>';
      if(o.id&&o.id!==o.value)tags+='<span style="color:#999;font-size:0.74rem;margin-left:4px;font-family:monospace">'+o.id+'</span>';
      html+='<div data-idx="'+idx+'" style="padding:7px 12px;cursor:pointer;border-bottom:1px solid #F3F1EB;background:'+bg+';font-size:0.9rem" onmouseover="this.style.background=\'#FFF8ED\'" onmouseout="this.style.background=\''+bg+'\'">'+
        (isSel?'<span style="color:#0A5A46;margin-right:5px">✓</span>':'')+labelHtml+tags+'</div>';
    });
    drop.innerHTML=html;
    // 綁定點擊 (用 mousedown 確保比 input.blur 先觸發)
    drop.querySelectorAll('[data-idx]').forEach(function(row){
      row.addEventListener('mousedown',function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        var idx=+row.getAttribute('data-idx');
        var pick=visList[idx];
        if(pick){
          sel.value=pick.value;
          input.value=pick.label||'';
          drop.style.display='none';
          // 觸發原 select 的 change 事件,讓既有 onchange 處理器運作
          var ev2=new Event('change',{bubbles:true});
          sel.dispatchEvent(ev2);
        }
      });
    });
  }
  
  function showDrop(){
    renderList(input.value===_lastDisplayValue()?'':input.value);
    drop.style.display='block';
  }
  function _lastDisplayValue(){
    var c=optsData.find(function(o){return o.value===sel.value});
    return c?c.label:'';
  }
  
  input.addEventListener('focus',function(){
    // 點擊後清空顯示讓使用者打字搜尋,但記住原值
    input._origLabel=_lastDisplayValue();
    input.value='';
    hilite=-1;
    showDrop();
    input.select();
  });
  input.addEventListener('blur',function(){
    // 失焦時:如果沒選到任何 (input.value 不對應任何選項),恢復原值
    setTimeout(function(){
      drop.style.display='none';
      var matched=optsData.find(function(o){return o.label===input.value});
      if(!matched){
        // 還原顯示
        var cur=optsData.find(function(o){return o.value===sel.value});
        input.value=cur?cur.label:'';
      }
    },150);
  });
  input.addEventListener('input',function(){
    hilite=visList.length>0?0:-1;
    renderList(input.value);
  });
  input.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){
      e.preventDefault();
      if(drop.style.display==='none')showDrop();
      hilite=Math.min(visList.length-1,hilite+1);
      renderList(input.value);
      // 自動滾到可見位置
      var cur=drop.querySelector('[data-idx="'+hilite+'"]');
      if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest'});
    }else if(e.key==='ArrowUp'){
      e.preventDefault();
      hilite=Math.max(0,hilite-1);
      renderList(input.value);
      var cur=drop.querySelector('[data-idx="'+hilite+'"]');
      if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'){
      e.preventDefault();
      if(hilite>=0&&visList[hilite]){
        var pick=visList[hilite];
        sel.value=pick.value;
        input.value=pick.label||'';
        drop.style.display='none';
        var ev2=new Event('change',{bubbles:true});
        sel.dispatchEvent(ev2);
        input.blur();
      }
    }else if(e.key==='Escape'){
      drop.style.display='none';
      input.blur();
    }
  });
}

  recipe:{badge:'配方卡管理作業',flow:['建立配方','填入食材','計算成本','設定售價','檢視營養'],sections:[{title:'新增配方卡',steps:['點選「＋ 新增配方」填入名稱與代碼','設定分類、成品單位、批次倍數','逐一新增食材明細（品名、用量、單位）','儲存後左側列表可查看成本'],tip:'食材用量以最小批次為基準填入'},{title:'成本與售價',steps:['系統自動計算每單位成本（依食材進價單位智慧換算）','若食材有設可食率 < 100%,系統用「真實成本」算','右側詳情顯示 55%/60%/65% 毛利建議售價','底部顯示每 100g 營養標示','定期檢查食材進價變動影響'],warn:'食材進價或可食率變動時成本會自動更新'},{title:'🍽️ 帳面成本 vs 真實成本',steps:['配方詳情會顯示兩個成本:','📦 帳面成本:純按進貨價算 (不含損耗)','🍽️ 真實成本:含可食率 (備料損耗) — 這才是真實使用成本','差異越大代表食材損耗越多 (鳳梨/帶骨肉品最明顯)','毛利率建議用「真實成本」計算才不會虧錢'],tip:'真實成本通常比帳面成本高 5~40%,看食材種類'},{title:'⚠️ 單位匹配重要說明',steps:['食材庫存的「單位」決定進價的計算基準（如：豬肉 100元/公斤、醬油 60元/公升）','配方填入用量時務必確認單位 → 重量(g/公斤/台斤) 系統自動換算','✅ 自動換算情境:食材公斤 → 配方填 g/台斤/公斤 都OK','✅ 自動換算情境:食材公升 → 配方填 ml/公升 都OK','⚠️ 計件類食材(包/盒/瓶/顆/張) 配方務必用相同單位','❌ 例如 醬油是「包」(每包 500ml,30元) 但配方填 100ml → 計算錯誤！應改成食材改用「公升」單位再設進價'],warn:'若食材單位是計件類(包/盒/瓶) 而配方用重量(g/ml),系統無法精確換算,會在 Console 顯示警告'},{title:'🆕 跨類別換算 (公升↔公克) 內建密度表',steps:['🆕 系統內建 50+ 常見食材密度表,「容量↔重量」可自動換算','油類(橄欖油/沙拉油/麻油):密度 0.91~0.92','水/高湯/茶/咖啡:密度 1.00','酒類(米酒/料酒/紹興):密度 0.97~0.98','醬油:密度 1.10','蠔油/醬油膏/番茄醬:密度 1.15~1.20','蜂蜜:密度 1.42','牛奶/鮮奶/豆漿:密度 1.03~1.04','範例:橄欖油 NT$150/公升 + 配方 100g → 系統算 NT$16.5 (套用密度 0.91)','食材命名含關鍵字即匹配:「初榨橄欖油」→ 套用「橄欖油」的 0.91','找不到密度的食材會以 1.0 計算且 Console 顯示警告'],tip:'此功能讓「食材記公升、配方填公克」也能正確算成本,不需強制統一單位'},{title:'🥚 雞蛋的處理方式 (三選一)',steps:['🥚 方法 1 - 散裝雞蛋(按顆):食材單位「顆」/進價 8元 /可食率 85% (扣蛋殼)','  → 配方一定要用「顆」','🥚 方法 2 - 整箱雞蛋(按重量) 推薦:食材單位「公斤」/進價 160元/kg /可食率 90%','  → 配方可用 g、公斤、台斤,系統自動換算','  → 例:配方填 150g → 系統算 160 ÷ 0.9 × 0.150 = NT$26.67','🥚 方法 3 - 蛋液/全蛋液(中央廚房):食材單位「公升」/進價 120元/L /可食率 100%','  → 配方可用 g、ml、公升 (蛋液密度 1.04 內建)','  → 例:配方填 100g 蛋液 → 系統算 NT$11.54','配方常用 g 的話建議用方法 2 (整箱) 或方法 3 (蛋液)'],tip:'雞蛋可食率參考:整顆雞蛋 85% (扣蛋殼+滴落) ｜ 整箱按重量 90% (主要扣蛋殼) ｜ 蛋液 100%'},{title:'🆕 📦 包裝規格 + 包材成本',steps:['每個配方可設「包裝規格」(每包淨重 X g/ml)','例:藍莓優格醬 1000g/包｜紐澳良雞腿排 600g/包(4支)｜辣椒醬 500g/包','配方詳情會自動顯示「成本拆解」:🍽️ 食材成本 + 📦 包材成本','食材庫類別「包材」會自動歸類到包材成本 (其他類別歸食材成本)','📦 食材庫頁面有「📦 匯入包材」按鈕可從叫貨單一次匯入','包材成本占比 > 10% 表示包材偏貴,可考慮換包裝/找新供應商','若配方總成本中「包材成本」是 0 → 提示未計入包材'],warn:'配方未計包材會虛報毛利!記得每個配方都加包材食材',tip:'包裝規格影響:標籤淨重自動帶入、營養標示「每份」計算'},{title:'🆕 ⚠️ 缺料報告 (右上紅色按鈕)',steps:['配方頁右上若出現「⚠️ 缺料報告 (X)」紅色按鈕','點開列出所有「配方有用但食材庫沒登錄」的食材','重要性分級:🔥 高 (≥10 個配方用)、⚠️ 中、• 低','點「快速新增」直接建食材','建議從🔥高重要性開始補,可大幅修正成本'],warn:'缺料食材會被靜默跳過,讓配方成本被低估!'},{title:'🆕 ⚠️ 異常偵測 + 💸 成本拆解',steps:['配方詳情頂部會顯示異常警示卡 (用量/單位錯誤/比例異常)','例:用量 12000 公斤 → 警示「單位可能選錯應為 g」','某食材佔總成本 > 95% → 警示「比例異常」','點任一食材列展開「成本拆解」:單價 × 用量 × 倍數 = 小計','配方詳情顯示「💸 成本拆解」(食材成本 vs 包材成本占比)'],tip:'異常偵測會在儀表板顯示警示卡 + 配方列表 ⚠️ badge'},{title:'🆕 📦 包材組合 (配方編輯)',steps:['編輯配方時,「包裝規格」下方會顯示「📦 包材組合」區塊','自動列食材庫所有「包材」類別食材 (來自匯入包材功能)','勾選需要的包材 + 設數量 (例:真空袋 1 包/標籤 1 張)','編輯舊配方時系統自動勾起已有的包材','儲存時自動合併到「食材明細」,計算成本時識別為包材'],warn:'若食材庫沒包材分類,先去「🥬 食材庫存」匯入包材',tip:'比逐一加食材快 5 倍'},{title:'🆕 🍳 餐點靈感工坊 (右上綠色按鈕)',steps:['配方頁右上點「🍳 餐點靈感工坊」開啟 3 個分頁','🎲 智能推薦:勾選食材 → 系統推薦現有相似配方 (Jaccard 演算法)','🔍 反向搜尋:選食材 → 列出哪些配方在用、毛利排序','💡 組合分析:常一起用的食材對 + 閒置食材清單','閒置食材 = 沒被任何配方用到 → 可開新菜或停採購'],tip:'從食材庫設計新菜的最佳工具!研發新品時必用'},{title:'🆕 ♻️ 操作損耗率 (毛利不被低估)',steps:['配方編輯時可填「操作損耗率」(預設 0%)','例:廚房失誤+過期+員工偷吃 預估 5% → 填 5','配方詳情會顯示「全成本 = 真實成本 ÷ (1-損耗率)」','建議:看儀表板「♻️ 本月損耗成本」的損耗率','若整體損耗率 5% → 把每個配方的操作損耗率設 5%','毛利建議售價自動改用「全成本」算,確保不虧錢'],warn:'操作損耗率 ≠ 可食率!可食率是備料(食材本身),操作損耗是廚房作業',tip:'高風險食材(易腐壞/容易出錯)可設高,穩定食材設低'}]},

function sopBox(pageId){const cfg=SOP_DATA[pageId];if(!cfg)return null;const wrap=dv({cls:'sop-box'});const hdr=dv({cls:'sop-header'});hdr.innerHTML=`<div class="sop-header-left">📖 操作說明 SOP<span class="sop-badge">${cfg.badge}</span></div><span class="sop-toggle${_sopOpen[pageId]?' open':''}">▼</span>`;const body=dv({cls:'sop-body'+(_sopOpen[pageId]?' open':'')});if(cfg.flow&&cfg.flow.length){const fr=dv({cls:'sop-flow'});cfg.flow.forEach((step,i)=>{fr.appendChild(dv({cls:'sop-flow-step'},step));if(i<cfg.flow.length-1)fr.appendChild(dv({cls:'sop-flow-arrow'},'→'))});body.appendChild(fr)}const cols=dv({cls:'sop-cols'});(cfg.sections||[]).forEach(sec=>{const sc=dv({cls:'sop-section'});sc.appendChild(dv({cls:'sop-section-title'},sec.title));const ul=el('ul',{cls:'sop-steps'});(sec.steps||[]).forEach((step,i)=>{const li=el('li',{});li.innerHTML=`<span class="sop-num">${i+1}</span><span>${step}</span>`;ul.appendChild(li)});sc.appendChild(ul);if(sec.warn)sc.innerHTML+=`<div class="sop-warn">⚠️ ${sec.warn}</div>`;if(sec.tip)sc.innerHTML+=`<div class="sop-tip">💡 ${sec.tip}</div>`;cols.appendChild(sc)});body.appendChild(cols);wrap.appendChild(hdr);wrap.appendChild(body);hdr.addEventListener('click',()=>{_sopOpen[pageId]=!_sopOpen[pageId];body.classList.toggle('open',_sopOpen[pageId]);hdr.querySelector('.sop-toggle').classList.toggle('open',_sopOpen[pageId])});return wrap}

// 取得食材營養 (用名稱模糊比對 + 食材庫優先)
window.getNutrition=function(ingName,invItem){
  // 優先用食材庫填的值 (即使部分為 0 也用)
  if(invItem){
    var hasAny=(invItem.kcal||0)>0||(invItem.prot||0)>0||(invItem.fat||0)>0||(invItem.carb||0)>0||(invItem.sodium||0)>0;
    if(hasAny){
      return {
        kcal:+invItem.kcal||0,
        prot:+invItem.prot||0,
        fat:+invItem.fat||0,
        satFat:+invItem.satFat||0,    // 食材庫沒這欄就 0
        transFat:+invItem.transFat||0,
        carb:+invItem.carb||0,
        sugar:+invItem.sugar||0,
        sodium:+invItem.sodium||0,
        source:'manual'
      };
    }
  }
  // 沒填 → 用內建資料庫模糊比對
  if(!ingName)return null;
  var name=String(ingName).trim();
  if(window.NUTRITION_DB[name])return Object.assign({},window.NUTRITION_DB[name],{source:'db'});
  var bestMatch=null,bestLen=0;
  Object.keys(window.NUTRITION_DB).forEach(function(key){
    if(name.indexOf(key)>=0&&key.length>bestLen){
      bestMatch=window.NUTRITION_DB[key];
      bestLen=key.length;
    }
  });
  return bestMatch?Object.assign({},bestMatch,{source:'db'}):null;
};

function calcIngCost(inv, qty, useUnit, opts){
  if(!inv||!qty)return 0;
  if(!useUnit)useUnit=inv.unit;
  opts=opts||{};
  
  var unitPrice = +inv.price || 0;
  var invUnit = inv.unit || '公斤';
  
  // 🔧 套用可食率 (yieldRate) - 真實成本 = 進價 / 可食率
  var yieldRate = +inv.yieldRate;
  if(!yieldRate||yieldRate<=0||yieldRate>1)yieldRate=1;
  if(!opts.skipYield&&yieldRate<1){
    unitPrice = unitPrice / yieldRate;
  }
  
  // 同單位 → 直接相乘
  if(useUnit === invUnit){
    return unitPrice * qty;
  }
  
  // 🆕 包裝層級換算 (箱/包/張等多層計件包裝)
  // 食材有 packageLevels 且 useUnit 在層級中 → 用 factor 換算
  if(inv.packageLevels&&inv.packageLevels.length>0){
    var levels=inv.packageLevels;
    var mainLvl=levels.find(function(l){return l.unit===invUnit});
    var useLvl=levels.find(function(l){return l.unit===useUnit});
    if(mainLvl&&useLvl&&mainLvl.factor>0&&useLvl.factor>0){
      // 每基本單位的價格 = unitPrice / mainLvl.factor
      // qty (useUnit) → 換成基本單位 = qty × useLvl.factor
      // 總價 = (unitPrice/mainLvl.factor) × (qty × useLvl.factor)
      return (unitPrice/mainLvl.factor)*(qty*useLvl.factor);
    }
  }
  
  // 🆕 用 UNIT_DB 判斷類型 (不再用硬編碼陣列,避免漏斤/台兩/磅/盎司等)
  var invInfo = (window.UNIT_DB&&window.UNIT_DB[invUnit])||null;
  var useInfo = (window.UNIT_DB&&window.UNIT_DB[useUnit])||null;
  var invType = invInfo&&invInfo.type;
  var useType = useInfo&&useInfo.type;
  
  // 同類別換算 (重量↔重量, 容量↔容量) — 透過 unitToG 統一基底
  if(invType&&useType&&invType===useType&&(invType==='weight'||invType==='volume')){
    var invInBase = unitToG(1, invUnit);  // 食材 1 單位 = 多少 g 或 ml
    if(!invInBase||invInBase<=0)return unitPrice * qty;  // 防呆
    var pricePerBase = unitPrice / invInBase;  // 每 g 或每 ml 價格
    var qtyInBase = unitToG(qty, useUnit);  // 配方數量換算成基底
    return pricePerBase * qtyInBase;
  }
  
  // 跨類別換算 (容量↔重量) — 套用密度
  if(invType&&useType&&((invType==='weight'&&useType==='volume')||(invType==='volume'&&useType==='weight'))){
    var density = window.getDensity?window.getDensity(inv.name):null;
    if(density==null){
      density=1.0;
      if(typeof console!=='undefined')console.warn('[calcIngCost] 食材「'+inv.name+'」無密度資料,跨類別換算用預設 1.0,可能不準確');
    }
    
    if(invType==='volume'&&useType==='weight'){
      // 食材是體積 (ml/L),配方用重量 (g/kg)
      var pricePerMl = unitPrice / unitToG(1, invUnit);  // 每 ml 價格
      var qtyInG = unitToG(qty, useUnit);  // 配方換算成 g
      var qtyInMl = qtyInG / density;  // g → ml (透過密度)
      return pricePerMl * qtyInMl;
    }else{
      // 食材是重量 (g/kg),配方用體積 (ml/L)
      var pricePerG = unitPrice / unitToG(1, invUnit);  // 每 g 價格
      var qtyInMl2 = unitToG(qty, useUnit);  // 配方換算成 ml
      var qtyInG2 = qtyInMl2 * density;  // ml → g (透過密度)
      return pricePerG * qtyInG2;
    }
  }
  
  // 計件類 ↔ 重量/體積 — 真的不匹配,直接相乘 (會算錯,但 detectIngAnomalies 會警告)
  if(typeof console!=='undefined')console.warn('[calcIngCost] 食材「'+inv.name+'」單位不匹配:食材='+invUnit+' 配方='+useUnit+',直接相乘可能不準確');
  return unitPrice * qty;
}
window.calcIngCost = calcIngCost;

// 🆕 包裝層級換算工具 (Phase: 無限層級包裝)
// 資料結構:ing.packageLevels = [
//   {unit:'張', factor:1},    // 基本單位 (factor 永遠 1)
//   {unit:'包', factor:100},  // 1 包 = 100 張
//   {unit:'箱', factor:2000}  // 1 箱 = 2000 張
// ]
// inv.unit = 主單位 (採購用), inv.price = 主單位價格
// ══════════════════════════════════════════════════════

// 取得食材所有可用單位 (含包裝層級)
window.getIngUnits=function(inv){
  if(!inv)return [];
  if(inv.packageLevels&&inv.packageLevels.length>0){
    return inv.packageLevels.map(function(l){return l.unit});
  }
  return [inv.unit||'公斤'];
};

// 取得指定單位的單價
window.getUnitPrice=function(inv,unit){
  if(!inv)return 0;
  var price=+inv.price||0;
  if(!unit||unit===inv.unit)return price;
  
  if(inv.packageLevels&&inv.packageLevels.length>0){
    var mainLvl=inv.packageLevels.find(function(l){return l.unit===inv.unit});
    var tgtLvl=inv.packageLevels.find(function(l){return l.unit===unit});
    if(mainLvl&&tgtLvl&&mainLvl.factor>0){
      // 該單位單價 = 主單位價 × (該單位 factor / 主單位 factor)
      return price*(tgtLvl.factor/mainLvl.factor);
    }
  }
  return price;
};

// 包裝層級之間的數量換算 (例如 5 箱 → 多少張)
window.convertPackageQty=function(inv,qty,fromUnit,toUnit){
  if(!inv||fromUnit===toUnit)return qty;
  if(!inv.packageLevels||inv.packageLevels.length===0)return qty;
  
  var fromLvl=inv.packageLevels.find(function(l){return l.unit===fromUnit});
  var toLvl=inv.packageLevels.find(function(l){return l.unit===toUnit});
  if(!fromLvl||!toLvl||toLvl.factor<=0)return qty;
  
  // qty (fromUnit) × fromLvl.factor = 基本單位數量
  // 基本單位數量 / toLvl.factor = toUnit 數量
  return (qty*fromLvl.factor)/toLvl.factor;
};

// 偵測食材是否「可升級」(尚未設定 packageLevels 但名稱看起來有多層包裝)
window.canUpgradeToPackageLevels=function(inv){
  if(!inv)return false;
  if(inv.packageLevels&&inv.packageLevels.length>0)return false;  // 已升級
  if(!inv.name)return false;
  
  // 從名稱偵測包裝層級
  var parsed=window.parsePackageName?window.parsePackageName(inv.name,inv.unit):null;
  // 或從 _innerQty / _parentPackage (舊版 packInner 升級殘留) 偵測
  return !!(parsed&&parsed.innerQty>1)||!!(inv._parentPackage)||!!(inv._innerQty);
};

// 從名稱自動建議包裝層級結構
// 例如「真空袋200*300mm100張/20包/箱」+ 單位「箱」
//   → [{unit:'張',factor:1},{unit:'包',factor:100},{unit:'箱',factor:2000}]
window.suggestPackageLevels=function(name,mainUnit){
  if(!name||!mainUnit)return null;
  
  var parts=name.split('/');
  var unitIdx=-1;
  for(var i=0;i<parts.length;i++){
    if(parts[i].indexOf(mainUnit)>=0){unitIdx=i;break;}
  }
  if(unitIdx<=0)return null;
  
  var levels=[];
  var cumFactor=1;
  
  // 處理 0 ~ unitIdx 每一層
  // 每層 part 內含「數字+單位」配對 (例:「20包」→ n=20, u=包)
  // 或只有「單位」沒數字 (例:「箱」→ n=1, u=箱)
  for(var j=0;j<=unitIdx;j++){
    var p=parts[j];
    var n=1,u='';
    // 取最後出現的「數字+中文單位」配對 (排除規格如 200*300mm)
    var ms=p.match(/(\d+)\s*([\u4e00-\u9fa5]+)/g);
    if(ms&&ms.length>0){
      var lastM=ms[ms.length-1].match(/(\d+)\s*([\u4e00-\u9fa5]+)/);
      if(lastM){n=+lastM[1];u=lastM[2]}
    }else{
      // 沒數字 → 整段當單位 (例「箱」)
      u=p.trim();
      n=1;
    }
    if(!u)continue;
    
    if(j===0){
      // 第一層 = 基本單位 (factor=1)
      levels.push({unit:u,factor:1});
    }else{
      // 上層 factor = 累積到目前 (本層 1 單位含基本單位數)
      levels.push({unit:u,factor:cumFactor});
    }
    cumFactor*=n;
  }
  
  return levels.length>=2?levels:null;
};

// 一鍵升級食材 (從舊資料生成 packageLevels)
window.upgradeIngToPackageLevels=function(invId){
  var inv=(state.ings||[]).find(function(i){return i.id===invId});
  if(!inv)return false;
  
  var suggested=null;
  
  // 優先 1:從舊 _innerQty / _parentPackage 升級
  if(inv._parentPackage&&inv._innerQty>1){
    // 找父食材
    var parent=(state.ings||[]).find(function(i){return i.name===inv._parentPackage});
    if(parent){
      // 把 parent 升級
      parent.packageLevels=[
        {unit:inv.unit,factor:1},
        {unit:parent.unit,factor:inv._innerQty}
      ];
      // 移除子食材 (合併到父食材)
      var idx=state.ings.indexOf(inv);
      if(idx>=0)state.ings.splice(idx,1);
      return true;
    }
  }
  
  // 優先 2:從名稱解析
  if(!suggested)suggested=window.suggestPackageLevels(inv.name,inv.unit);
  
  if(!suggested)return false;
  
  inv.packageLevels=suggested;
  return true;
};

// 🔧 取得食材的「真實單位成本」(含可食率)
window.calcRealUnitCost = function(inv){
  if(!inv)return 0;
  var price = +inv.price || 0;
  var yieldRate = +inv.yieldRate;
  if(!yieldRate||yieldRate<=0||yieldRate>1)return price;
  return price / yieldRate;
};

  var icon=document.getElementById('exp-icon-'+idx);

  if(bd.style.display==='none'){bd.style.display='';if(icon)icon.textContent='▲'}

};

// ══════════════════════════════════════════════════════
// 🆕 異常偵測:檢查配方中各食材是否有不合理設定
// 規則:
//   1. 用量 > 1000 公斤 → 「單位可能選錯」
//   2. 用量 > 100 公升 → 「液體用量過大」
//   3. 計件類用量 > 1000 → 「數量異常」
//   4. 食材佔配方總成本 > 90% → 「比例異常」
//   5. 配方每單位成本 > NT$5,000 → 「成本異常」
//   6. 食材小計 > NT$50,000 → 「金額異常」
// ══════════════════════════════════════════════════════
window.detectIngAnomalies=function(ing,invItem,subtotal,totalCost){
  var anomalies=[];
  var qty=+ing.qty||0;
  var unit=ing.unit||'';
  var invUnit=(invItem&&invItem.unit)||'';
  
  // 🆕 優先檢查:單位類型嚴重不匹配 (計件 vs 重量/體積) — 計算結果一定錯
  // 重量↔體積由 calcIngCost 用密度自動換算,不視為異常
  if(unit&&invUnit&&unit!==invUnit&&typeof window.UNIT_DB==='object'){
    var unitType=window.UNIT_DB[unit]&&window.UNIT_DB[unit].type;
    var invUnitType=window.UNIT_DB[invUnit]&&window.UNIT_DB[invUnit].type;
    
    if(unitType&&invUnitType&&unitType!==invUnitType){
      var hasCount=unitType==='count'||invUnitType==='count';
      if(hasCount){
        // 計件類無法跟重量/體積換算 — 真的會算錯
        anomalies.push({level:'mid',msg:'單位不匹配 (食材設「'+invUnit+'」,配方用「'+unit+'」),計算可能失真,請統一單位'});
        return anomalies;
      }
      // 重量↔體積:calcIngCost 會用密度自動換算,不警告
    }
  }
  
  // 用量過大判斷
  if(unit==='公斤'||unit==='kg'){
    if(qty>=1000)anomalies.push({level:'high',msg:'用量 '+qty+' 公斤 = '+qty+' 公噸,單位可能選錯應為「g」'});
    else if(qty>=200)anomalies.push({level:'mid',msg:'用量 '+qty+' 公斤偏大,請確認單位'});
  }else if(unit==='台斤'){
    if(qty>=1000)anomalies.push({level:'high',msg:'用量 '+qty+' 台斤 ≈ '+(qty*0.6).toFixed(0)+' 公斤,單位可能選錯'});
  }else if(unit==='公升'||unit==='L'){
    if(qty>=100)anomalies.push({level:'high',msg:'用量 '+qty+' 公升,單位可能選錯應為「ml」'});
  }else if(['顆','個','張','盒','份','包','瓶'].indexOf(unit)>=0){
    if(qty>=1000)anomalies.push({level:'mid',msg:'用量 '+qty+' '+unit+' 數量異常'});
  }
  
  // 比例異常 (放寬到 99%)
  if(subtotal>0&&totalCost>0){
    var pct=subtotal/totalCost;
    if(pct>0.99&&totalCost>5000){
      anomalies.push({level:'high',msg:'此食材佔總成本 '+(pct*100).toFixed(1)+'%,可能其他食材用量設錯或缺料'});
    }
  }
  
  // 小計金額異常 (門檻 500000)
  if(subtotal>500000){
    anomalies.push({level:'high',msg:'小計金額 '+CUR()+Math.round(subtotal).toLocaleString()+' 過大,請檢查用量'});
  }
  
  return anomalies;
};

// 配方層級異常 (拿來做儀表板提醒用)
window.detectRecipeAnomalies=function(r){
  var rc=calcCost(r);
  var anomalies=[];
  // 🆕 放寬閾值到合理範圍 (中央廚房規模)
  if(rc.per>50000)anomalies.push({level:'high',msg:'每'+(r.unit||'單位')+'成本 '+CUR()+Math.round(rc.per).toLocaleString()+' 異常高',type:'unit'});
  if(rc.total>5000000)anomalies.push({level:'high',msg:'批次總成本 '+CUR()+Math.round(rc.total).toLocaleString()+' 異常高',type:'total'});
  // 檢查每食材
  var im=imap();
  (r.ings||[]).forEach(function(ing){
    var inv=im[ing.name];
    if(!inv)return;
    var subtotal=calcIngCost(inv,(ing.qty||0)*(r.multiplier||1),ing.unit);
    var ingAnomalies=window.detectIngAnomalies(ing,inv,subtotal,rc.total);
    ingAnomalies.forEach(function(a){
      anomalies.push({level:a.level,msg:'['+ing.name+'] '+a.msg,type:'ing'});
    });
  });
  return anomalies;
};

// 全配方掃描 (儀表板用)
window.scanAllRecipeAnomalies=function(){
  var result=[];
  (state.recipes||[]).forEach(function(r){
    var anomalies=window.detectRecipeAnomalies(r);
    if(anomalies.length>0)result.push({recipe:r,anomalies:anomalies});
  });
  return result;
};

function calcCost(r){const mult=r.multiplier||1,im=imap();let tot=0;let ingCost=0,packCost=0;let missingCount=0;let missingNames=[];(r.ings||[]).forEach(ing=>{const inv=im[ing.name];if(!inv){missingCount++;missingNames.push(ing.name);return}var c=calcIngCost(inv,(ing.qty||0)*mult,ing.unit);tot+=c;if(inv.cat==='包材')packCost+=c;else ingCost+=c});
// 🆕 操作損耗率:配方填的 (例如廚房失誤+過期 5%)
var opLossRate=+r.opLossRate||0;
if(opLossRate<0)opLossRate=0;
if(opLossRate>0.5)opLossRate=0.5;  // 上限 50%
// 全成本 = 真實成本 ÷ (1 - 操作損耗率)
// 邏輯:有 5% 操作損耗 = 100元成本實際消耗 100/(1-5%) = 105.26 才能產出
var fullCost=opLossRate>0?tot/(1-opLossRate):tot;
var fullIngCost=opLossRate>0?ingCost/(1-opLossRate):ingCost;
var perBatchUnits=(r.perBatch||1)*mult;
return{total:tot,per:tot/perBatchUnits,ingCost:ingCost,packCost:packCost,perIng:ingCost/perBatchUnits,perPack:packCost/perBatchUnits,fullCost:fullCost,perFull:fullCost/perBatchUnits,fullIngCost:fullIngCost,perFullIng:fullIngCost/perBatchUnits,opLossRate:opLossRate,missingCount:missingCount,missingNames:missingNames}}

// ══════════════════════════════════════════════════════
// 🆕 全成本分析引擎 (中央廚房範圍)
// 全成本 = 食材 + 人事 + 店租 + 水電 + 雜支
//
// 分攤邏輯:
//   月固定成本 / 月生產總量 = 每單位分攤額
//   生產量基準: 近 3 個月平均 (Fallback: 不足 3 個月用實際月數)
//
// 資料結構: state.kitchenCosts = {
//   '2026-05': {
//     personnel: 250000,  // 人事費
//     rent: 80000,        // 店租
//     utilities: 35000,   // 水電
//     misc: 15000,        // 雜支
//     note: '5月人事漲薪'
//   },
//   '2026-04': {...}
// }
// ══════════════════════════════════════════════════════

// 取得近 N 個月的月份 key (含當月)
window.getRecentMonths=function(n){
  var months=[];
  var d=new Date();
  for(var i=0;i<n;i++){
    var y=d.getFullYear(),m=d.getMonth()+1;
    months.push(y+'-'+String(m).padStart(2,'0'));
    d.setMonth(d.getMonth()-1);
  }
  return months;
};

// 取得近 3 個月平均月度生產數量(以包/份為單位,從 prodLog 加總)
window.getAvgMonthlyProduction=function(){
  if(!state.prodLog||state.prodLog.length===0)return 0;
  var months=window.getRecentMonths(3);
  var counts={};
  months.forEach(function(m){counts[m]=0});
  
  state.prodLog.forEach(function(p){
    var ym=(p.date||'').substring(0,7);
    if(counts[ym]!=null){
      // 累計產出量 (用 output * 倍數計算)
      var qty=(+p.output||0)*(+p.multiplier||1);
      // 沒 output 也算 1 筆
      counts[ym]+=qty>0?qty:1;
    }
  });
  
  // Fallback: 計算實際有資料的月份
  var validMonths=Object.values(counts).filter(function(c){return c>0});
  if(validMonths.length===0)return 0;
  
  var total=validMonths.reduce(function(a,b){return a+b},0);
  return total/validMonths.length;
};

// 取得近 3 個月平均月度固定成本 (中央廚房)
window.getAvgMonthlyFixedCost=function(){
  if(!state.kitchenCosts)state.kitchenCosts={};
  var months=window.getRecentMonths(3);
  var totals={personnel:0,rent:0,utilities:0,misc:0};
  var validMonths=0;
  
  months.forEach(function(m){
    var c=state.kitchenCosts[m];
    if(c){
      validMonths++;
      totals.personnel+=(+c.personnel||0);
      totals.rent+=(+c.rent||0);
      totals.utilities+=(+c.utilities||0);
      totals.misc+=(+c.misc||0);
    }
  });
  
  if(validMonths===0){
    // 沒設定過 → 全部 0
    return {personnel:0,rent:0,utilities:0,misc:0,total:0,validMonths:0};
  }
  
  return {
    personnel:totals.personnel/validMonths,
    rent:totals.rent/validMonths,
    utilities:totals.utilities/validMonths,
    misc:totals.misc/validMonths,
    total:(totals.personnel+totals.rent+totals.utilities+totals.misc)/validMonths,
    validMonths:validMonths
  };
};

// 取得每單位分攤額 (核心)
window.getCostAllocation=function(){
  var avgFixed=window.getAvgMonthlyFixedCost();
  var avgProd=window.getAvgMonthlyProduction();
  
  if(avgProd===0||avgFixed.total===0){
    return {
      perUnit:{personnel:0,rent:0,utilities:0,misc:0,total:0},
      avgProd:avgProd,
      avgFixed:avgFixed,
      ready:false  // 沒資料不能算
    };
  }
  
  return {
    perUnit:{
      personnel:avgFixed.personnel/avgProd,
      rent:avgFixed.rent/avgProd,
      utilities:avgFixed.utilities/avgProd,
      misc:avgFixed.misc/avgProd,
      total:avgFixed.total/avgProd
    },
    avgProd:avgProd,
    avgFixed:avgFixed,
    ready:true
  };
};

// 計算配方的全成本(食材+人事+店租+水電+雜支)
window.calcFullCostV2=function(r){
  var rc=calcCost(r);  // 食材+包材成本
  var alloc=window.getCostAllocation();
  
  // 每單位 (per 包/份)
  var perBatchUnits=(r.perBatch||1)*(r.multiplier||1);
  var perFood=rc.per||0;  // 每單位食材成本
  var perPersonnel=alloc.perUnit.personnel;
  var perRent=alloc.perUnit.rent;
  var perUtil=alloc.perUnit.utilities;
  var perMisc=alloc.perUnit.misc;
  var perTotalCost=perFood+perPersonnel+perRent+perUtil+perMisc;
  
  // 對外售價 (配方上設的)
  var sellPrice=+r.sellPrice||0;
  
  // 毛利 (僅食材成本)
  var grossMargin=sellPrice>0?((sellPrice-perFood)/sellPrice):0;
  // 淨利 (扣全成本)
  var netMargin=sellPrice>0?((sellPrice-perTotalCost)/sellPrice):0;
  
  return {
    perFood:perFood,
    perPersonnel:perPersonnel,
    perRent:perRent,
    perUtil:perUtil,
    perMisc:perMisc,
    perFixed:perPersonnel+perRent+perUtil+perMisc,
    perTotalCost:perTotalCost,
    sellPrice:sellPrice,
    grossMargin:grossMargin,
    netMargin:netMargin,
    profit:sellPrice-perTotalCost,
    isLoss:sellPrice>0&&sellPrice<perTotalCost,
    allocation:alloc,
    foodCost:rc  // 完整食材成本資訊
  };
};

// 全配方缺料分析 (用於缺料報告)
window.analyzeMissingIngs=function(){
  var im=imap();
  var missingMap={};  // 缺失食材名 → {count, qty, unit, recipes:[]}
  (state.recipes||[]).forEach(function(r){
    (r.ings||[]).forEach(function(ing){
      if(!im[ing.name]){
        if(!missingMap[ing.name]){
          missingMap[ing.name]={
            name:ing.name,
            count:0,
            unit:ing.unit||'g',
            recipes:[],
            totalQty:0
          };
        }
        missingMap[ing.name].count++;
        missingMap[ing.name].recipes.push({code:r.code,name:r.name,qty:ing.qty,unit:ing.unit});
        missingMap[ing.name].totalQty+=(+ing.qty||0)*(r.multiplier||1);
      }
    });
  });
  // 按出現次數降序
  return Object.values(missingMap).sort(function(a,b){return b.count-a.count});
};

// 將「重量/容量單位 + 數量」換算成公克(以重量單位看待容量,簡化計算)
// 1 公斤 = 1000g, 1 台斤 = 600g, 1 公升 ≈ 1000g (水基準)

// 🆕 searchSelect - 通用快速搜尋下拉元件
// 用法: <select> 改寫成
//   <input id="xx" data-ss="true" data-options="A,B,C" data-value="A" placeholder="...">
// 或用 JS 呼叫:

// 建立快速搜尋下拉的 HTML
// 🆕 計算食材使用頻率,作為下拉排序依據
window.getOptionUsage=function(field){
  if(!state.ings||!state.ings.length)return {};
  var counts={};
  state.ings.forEach(function(ing){
    var val=ing[field];
    if(val){
      if(Array.isArray(val))val.forEach(function(v){counts[v]=(counts[v]||0)+1});
      else counts[val]=(counts[val]||0)+1;
    }
  });
  return counts;
};

// 🆕 依使用頻率排序 (常用的排前面,沒用過的維持原始順序)
window.sortByUsage=function(options,field){
  if(!options||!options.length||!field)return options;
  var usage=window.getOptionUsage(field);
  // 分兩組:有用過的(按次數降序) + 沒用過的(維持原順序)
  var used=[],unused=[];
  options.forEach(function(o){
    if(usage[o]&&usage[o]>0)used.push(o);
    else unused.push(o);
  });
  used.sort(function(a,b){return (usage[b]||0)-(usage[a]||0)});
  return used.concat(unused);
};

window.buildSearchSelect=function(opts){
  // opts = {id, options:[...], value, placeholder, width, sortField}
  var id=opts.id;
  var arr=opts.options||[];
  // 🆕 如果指定 sortField,依該欄位的使用頻率排序
  if(opts.sortField&&typeof window.sortByUsage==='function'){
    arr=window.sortByUsage(arr,opts.sortField);
  }
  var val=opts.value||'';
  var placeholder=opts.placeholder||'點此搜尋或選擇...';
  var width=opts.width||'100%';
  var optsJson=JSON.stringify(arr).replace(/"/g,'&quot;');
  return '<div class="ss-wrap" style="position:relative;width:'+width+'">'+
    '<input class="ss-input" id="'+id+'" type="text" value="'+esc(val)+'" placeholder="'+esc(placeholder)+'" autocomplete="off" data-options="'+optsJson+'" '+
    'onfocus="ssOpen(this)" oninput="ssFilter(this)" onblur="setTimeout(function(){ssClose(\''+id+'\')},150)">'+
    '<div class="ss-list" id="'+id+'-list" style="display:none"></div>'+
  '</div>';
};

// 開啟下拉清單
window.ssOpen=function(input){
  var id=input.id;
  var list=document.getElementById(id+'-list');
  if(!list)return;
  var optsRaw=input.getAttribute('data-options');
  var arr=[];
  try{arr=JSON.parse(optsRaw.replace(/&quot;/g,'"'))}catch(e){arr=[]}
  ssRender(list,arr,input.value,input);
  list.style.display='block';
};

// 過濾選項
window.ssFilter=function(input){
  var id=input.id;
  var list=document.getElementById(id+'-list');
  if(!list)return;
  var optsRaw=input.getAttribute('data-options');
  var arr=[];
  try{arr=JSON.parse(optsRaw.replace(/&quot;/g,'"'))}catch(e){arr=[]}
  var q=(input.value||'').toLowerCase().trim();
  var filtered=q?arr.filter(function(o){
    return String(o).toLowerCase().indexOf(q)>=0;
  }):arr;
  ssRender(list,filtered,q,input);
  list.style.display='block';
};

// 渲染下拉項目
window.ssRender=function(list,arr,query,input){
  if(arr.length===0){
    list.innerHTML='<div class="ss-empty">無符合項目</div>';
    return;
  }
  list.innerHTML=arr.slice(0,50).map(function(o,idx){
    var label=String(o);
    var lower=label.toLowerCase();
    var qlower=(query||'').toLowerCase();
    var highlighted=label;
    if(qlower&&lower.indexOf(qlower)>=0){
      var pos=lower.indexOf(qlower);
      highlighted=esc(label.substring(0,pos))+'<b style="color:#B82525">'+esc(label.substring(pos,pos+qlower.length))+'</b>'+esc(label.substring(pos+qlower.length));
    }else{
      highlighted=esc(label);
    }
    return '<div class="ss-item" onmousedown="ssPick(\''+input.id+'\',\''+esc(label).replace(/'/g,"\\'")+'\')">'+highlighted+'</div>';
  }).join('');
};

// 選擇一項
window.ssPick=function(inputId,val){
  var input=document.getElementById(inputId);
  if(!input)return;
  input.value=val;
  ssClose(inputId);
  // 觸發 change 事件 (讓有掛 onchange 的功能正常)
  var ev=new Event('change',{bubbles:true});
  input.dispatchEvent(ev);
  // 🆕 如果是 fi-unit,觸發 updatePriceConv
  if(inputId==='fi-unit'&&typeof window.updatePriceConv==='function'){
    setTimeout(function(){window.updatePriceConv()},10);
  }
  // 🆕 如果是 fi-yield 相關,重算可食率預覽
  if(inputId==='fi-unit'&&typeof window.updateYieldPreview==='function'){
    setTimeout(function(){window.updateYieldPreview()},10);

// 取得單位資訊 (支援別名)
window.getUnitInfo=function(unit){
  if(!unit)return null;
  var u=window.UNIT_DB[unit];
  return u||null;
};

function unitToG(qty, unit){
  if(!qty)return 0;
  var u=window.UNIT_DB[unit];
  if(u&&u.type==='weight')return qty*u.toG;
  // 舊版相容 + 容量類也算 (1ml = 1g 預設,跨類別需密度)
  if(u&&u.type==='volume')return qty*u.toMl;
  // fallback (舊版邏輯)
  if(unit==='公斤'||unit==='公升')return qty*1000;
  if(unit==='台斤')return qty*600;
  if(unit==='毫升'||unit==='公克')return qty;
  if(unit==='g'||unit==='ml')return qty;
  return qty;  // 計件單位直接回傳
}
window.unitToG=unitToG;

// 🆕 容量單位 → 毫升
window.unitToMl=function(qty,unit){
  if(!qty)return 0;
  var u=window.UNIT_DB[unit];
  if(u&&u.type==='volume')return qty*u.toMl;
  return qty;
};

// 🆕 兩個單位是否同類別 (重量 vs 重量、容量 vs 容量、計件 vs 計件)
window.isSameUnitType=function(unit1,unit2){
  var u1=window.UNIT_DB[unit1];
  var u2=window.UNIT_DB[unit2];
  if(!u1||!u2)return false;
  return u1.type===u2.type;
};

// 🆕 智能換算:從 unit1 換到 unit2 (同類別)
window.convertUnit=function(qty,unit1,unit2){
  var u1=window.UNIT_DB[unit1];
  var u2=window.UNIT_DB[unit2];
  if(!u1||!u2||!qty)return null;
  if(u1.type!==u2.type)return null;  // 不同類別不能換
  if(u1.type==='weight')return qty*u1.toG/u2.toG;
  if(u1.type==='volume')return qty*u1.toMl/u2.toMl;
  return qty;  // 計件不換算
};

// 🆕 取得依「顯示偏好」應該顯示的單位
window.getDisplayUnit=function(cat,fallbackUnit){

// 🆕 格式化顯示:依偏好換算單位
window.fmtUnitDisplay=function(qty,unit,cat){
  if(!qty)return '0 '+(unit||'');
  // 沒設偏好 → 原始顯示
  if(!state.meta||!state.meta.unitDisplay)return fmt(qty,2)+' '+unit;
  var prefer=state.meta.unitDisplay[cat];
  if(!prefer||prefer==='auto'||prefer===unit)return fmt(qty,2)+' '+unit;
  // 換算
  var converted=window.convertUnit(qty,unit,prefer);
  if(converted==null)return fmt(qty,2)+' '+unit;
  return fmt(converted,2)+' '+prefer;
};

window.getMinUnit=function(unit){
  var u=window.UNIT_DB?window.UNIT_DB[unit]:null;
  if(!u)return unit;
  if(u.type==='weight')return '公克';
  if(u.type==='volume')return '毫升';

// 🆕 取得進價在「最小單位」下的價格
window.getMinUnitPrice=function(price,unit){
  if(!price||!unit)return null;
  var u=window.UNIT_DB?window.UNIT_DB[unit]:null;
  if(!u||u.type==='count')return null;
  // 重量:每 1 公克的價格
  if(u.type==='weight')return price/u.toG;

  if(u.type==='volume')return price/u.toMl;

// 🔧 v2.1.0 重寫:配方營養計算
// 改進:
//   1. 使用 NUTRITION_DB 內建資料庫 (食材沒填營養時自動套用)
//   2. 修「每 100g」計算 bug (改用實際成品總重量為基準)
//   3. 加完整度指標 (有幾個食材沒營養資料)
//   4. 加 8 大營養素 (含飽和脂肪/反式脂肪/糖)
//   5. 加每份用量計算
// ══════════════════════════════════════════════════════
function calcNut(r){
  const mult=r.multiplier||1;
  const im=imap();
  // 8 大營養素累計 (絕對量,單位依成分而定)
  let kc=0,pr=0,ft=0,sft=0,tft=0,cb=0,sg=0,so=0;
  let totalG=0;  // 配方總重量 (g)
  let ingCount=0,withNutCount=0,fromDbCount=0;
  
  (r.ings||[]).forEach(function(ing){
    // 忽略「張」「盒」「包」等計件類 (無法換算重量)
    if(['張','盒','包','瓶','罐','份'].indexOf(ing.unit)>=0)return;
    ingCount++;
    
    const g=unitToG((+ing.qty||0)*mult,ing.unit);
    if(g<=0)return;
    totalG+=g;
    
    const inv=im[ing.name];
    // 取得營養 (食材庫優先 → 內建資料庫 → null)
    var nut=window.getNutrition(ing.name,inv);
    if(!nut)return;
    
    withNutCount++;
    if(nut.source==='db')fromDbCount++;
    
    // 每 g 該食材的營養 × 用量 g
    var gFactor=g/100;
    kc+=gFactor*(nut.kcal||0);
    pr+=gFactor*(nut.prot||0);
    ft+=gFactor*(nut.fat||0);
    sft+=gFactor*(nut.satFat||0);
    tft+=gFactor*(nut.transFat||0);
    cb+=gFactor*(nut.carb||0);
    sg+=gFactor*(nut.sugar||0);
    so+=gFactor*(nut.sodium||0);
  });
  
  // 換算「每 100g 成品」
  // 修 bug: 之前假設每包=1000g 不準確
  // 改用配方總重 (totalG) 作為分母
  // 若 totalG=0 (全是計件類) 則回 0
  var per100Factor=totalG>0?100/totalG:0;
  
  return {
    // 每 100g 營養 (用於配方詳情/標籤)
    kcal:kc*per100Factor,
    prot:pr*per100Factor,
    fat:ft*per100Factor,
    satFat:sft*per100Factor,
    transFat:tft*per100Factor,
    carb:cb*per100Factor,
    sugar:sg*per100Factor,
    sodium:so*per100Factor,
    // 整批總量 (用於計算每份/本包裝)
    totalKcal:kc,totalProt:pr,totalFat:ft,totalSatFat:sft,totalTransFat:tft,totalCarb:cb,totalSugar:sg,totalSodium:so,
    totalWeight:totalG,
    // 完整度
    ingCount:ingCount,
    withNutCount:withNutCount,
    fromDbCount:fromDbCount,
    completeness:ingCount>0?(withNutCount/ingCount):0
  };
}
window.calcNut=calcNut;

window._overviewSort={key:'margin',asc:true};
window.showProductOverview=function(){
  var recs=state.recipes||[];
  if(recs.length===0){alert('尚無配方');return}
  
  var tgt=(state.meta&&state.meta.targetMargin?state.meta.targetMargin:0.65)*100;
  
  // 計算每個配方的數據
  var rows=recs.map(function(r){
    var cc=window.calcCost?window.calcCost(r):null;
    var cost=cc?(cc.opLossRate>0?cc.perFull:cc.per)||cc.perTotalCost||cc.perFood||0:0;
    if(!cost&&cc)cost=cc.perFood||0;
    var sp=+r.sellPrice||0;
    var profit=sp>0?sp-cost:0;
    var margin=sp>0?(profit/sp*100):null;
    var sugPrice=cost>0?cost/(1-tgt/100):0;
    var perBatch=+r.perBatch||1;
    var mult=+r.multiplier||1;
    return {
      id:r.id,code:r.code||'',name:r.name,cat:r.cat||'',
      perBatch:perBatch,mult:mult,batchOut:perBatch*mult,unit:r.unit||'包',
      cost:cost,sellPrice:sp,profit:profit,margin:margin,sugPrice:sugPrice,
      isOk:margin!=null&&margin>=tgt,
      isLoss:sp>0&&profit<0,
      noPrice:sp<=0
    };
  });
  
  // 排序
  var sk=window._overviewSort.key,asc=window._overviewSort.asc;
  rows.sort(function(a,b){
    var va,vb;
    if(sk==='name'){va=a.name;vb=b.name;return asc?va.localeCompare(vb):vb.localeCompare(va)}
    if(sk==='margin'){va=a.margin==null?-999:a.margin;vb=b.margin==null?-999:b.margin}
    else if(sk==='cost'){va=a.cost;vb=b.cost}
    else if(sk==='sellPrice'){va=a.sellPrice;vb=b.sellPrice}
    else if(sk==='batchOut'){va=a.batchOut;vb=b.batchOut}
    else{va=a.margin==null?-999:a.margin;vb=b.margin==null?-999:b.margin}
    return asc?va-vb:vb-va;
  });
  
  // 統計
  var withPrice=rows.filter(function(r){return !r.noPrice});
  var okCount=rows.filter(function(r){return r.isOk}).length;
  var lossCount=rows.filter(function(r){return r.isLoss}).length;
  var noPriceCount=rows.filter(function(r){return r.noPrice}).length;
  var avgMargin=withPrice.length>0?withPrice.reduce(function(s,r){return s+(r.margin||0)},0)/withPrice.length:0;
  
  var sortIcon=function(k){return sk===k?(asc?' ▲':' ▼'):''};
  
  var trs=rows.map(function(r){
    var marginCell;
    if(r.noPrice)marginCell='<span style="color:#999">未設售價</span>';
    else if(r.isLoss)marginCell='<span style="color:#B82525;font-weight:700">虧損 ('+r.margin.toFixed(1)+'%)</span>';
    else{var mc=r.isOk?'#0A5A46':(r.margin>=tgt-10?'#9A6210':'#B82525');var mi=r.isOk?'✅':(r.margin>=tgt-10?'⚠️':'❌');marginCell='<span style="color:'+mc+';font-weight:700">'+mi+' '+r.margin.toFixed(1)+'%</span>'}
    
    var sugCell=(r.noPrice||r.margin<tgt)&&r.cost>0?'<span style="color:#1455A0;font-weight:600">'+CUR()+fmt(r.sugPrice,0)+'</span>':'<span style="color:#999">—</span>';
    
    return '<tr style="cursor:pointer" onclick="closeModal();setTimeout(function(){showRecipeDetail(\''+r.id+'\')},150)">'+
      '<td style="font-family:monospace;font-size:0.78rem;color:#888">'+esc(r.code)+'</td>'+
      '<td style="font-weight:700">'+esc(r.name)+'</td>'+
      '<td><span class="badge badge-gray" style="font-size:0.7rem">'+esc(r.cat)+'</span></td>'+
      '<td style="text-align:center;font-size:0.82rem">'+r.perBatch+' '+esc(r.unit)+' ×'+fmt(r.mult,1)+'<br><span style="color:#888;font-size:0.74rem">= '+fmt(r.batchOut,0)+' '+esc(r.unit)+'</span></td>'+
      '<td style="text-align:right;font-weight:600">'+CUR()+fmt(r.cost,1)+'</td>'+
      '<td style="text-align:right;font-weight:600;color:#0A5A46">'+(r.noPrice?'<span style="color:#999">—</span>':CUR()+fmt(r.sellPrice,0))+'</td>'+
      '<td style="text-align:center">'+marginCell+'</td>'+
      '<td style="text-align:right">'+sugCell+'</td>'+
    '</tr>';
  }).join('');
  
  modal('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="margin:0;font-size:1.2rem">📊 產品總覽 ('+rows.length+' 項)</h2><button onclick="closeModal()" style="background:none;border:1px solid #ccc;border-radius:6px;padding:4px 12px;cursor:pointer">✕ 關閉</button></div>'+
    '<div class="grid4" style="margin-bottom:14px">'+
      '<div class="metric"><span class="metric-label">平均毛利率</span><div class="metric-val" style="font-size:1.2rem;color:'+(avgMargin>=tgt?'#0A5A46':'#9A6210')+'">'+avgMargin.toFixed(1)+'%</div></div>'+
      '<div class="metric"><span class="metric-label">✅ 達標 (≥'+tgt.toFixed(0)+'%)</span><div class="metric-val" style="font-size:1.2rem;color:#0A5A46">'+okCount+' 項</div></div>'+
      '<div class="metric"><span class="metric-label">❌ 虧損</span><div class="metric-val" style="font-size:1.2rem;color:#B82525">'+lossCount+' 項</div></div>'+

      '<button class="btn btn-sm '+(sk==='margin'?'btn-primary':'btn-outline')+'" onclick="setOverviewSort(\'margin\')">毛利率'+sortIcon('margin')+'</button>'+
      '<button class="btn btn-sm '+(sk==='cost'?'btn-primary':'btn-outline')+'" onclick="setOverviewSort(\'cost\')">成本'+sortIcon('cost')+'</button>'+

window.exportProductOverview=function(){
  var recs=state.recipes||[];
  var tgt=(state.meta&&state.meta.targetMargin?state.meta.targetMargin:0.65)*100;
  var lines=['代碼,配方名稱,分類,每批產出,批次倍數,單批總產出,單位,每單位成本,對外售價(未稅),淨利,實際毛利率(%),目標毛利率(%),建議售價'];
  recs.forEach(function(r){
    var cc=window.calcCost?window.calcCost(r):null;
    var cost=cc?(cc.opLossRate>0?cc.perFull:cc.per)||cc.perFood||0:0;
    var sp=+r.sellPrice||0;
    var profit=sp>0?sp-cost:0;
    var margin=sp>0?(profit/sp*100):0;
    var sug=cost>0?cost/(1-tgt/100):0;
    var pb=+r.perBatch||1,mt=+r.multiplier||1;
    lines.push([r.code||'',r.name,r.cat||'',pb,mt,pb*mt,r.unit||'包',cost.toFixed(2),sp,profit.toFixed(2),margin.toFixed(1),tgt.toFixed(0),sug.toFixed(0)].join(','));

// 🆕 一鍵修正真空袋用量 (掃描所有配方,真空袋用量 → 成品包數 perBatch)
// 規則 (Tim 確認):每個成品包用 1 張真空袋,所以真空袋張數 = 成品包數
// ══════════════════════════════════════════════════════
window.scanVacuumBagFix=function(previewOnly){
  var fixes=[];
  (state.recipes||[]).forEach(function(r){
    var perBatch=+r.perBatch||1;  // 每批成品包數
    (r.ings||[]).forEach(function(ing){
      // 找名稱含「真空袋」的包材
      if(!ing.name||ing.name.indexOf('真空袋')<0)return;
      
      // 取得真空袋食材的基本單位 (有 packageLevels 取 factor=1 的,否則「張」)
      var inv=(state.ings||[]).find(function(x){return x.name===ing.name});
      var baseUnit='張';
      if(inv&&inv.packageLevels&&inv.packageLevels.length>0){
        var base=inv.packageLevels.find(function(l){return l.factor===1});
        if(base)baseUnit=base.unit;
      }
      
      // 當前用量 ≠ perBatch (或單位不是基本單位) → 需修正
      var curQty=+ing.qty||0;
      if(curQty!==perBatch||ing.unit!==baseUnit){
        fixes.push({
          recipeId:r.id,
          recipeName:r.name,
          ingName:ing.name,
          oldQty:curQty,
          oldUnit:ing.unit||'',
          newQty:perBatch,
          newUnit:baseUnit,
          perBatch:perBatch
        });
      }
    });
  });
  return fixes;
};

window.showVacuumBagFix=function(){
  var fixes=window.scanVacuumBagFix(true);
  if(fixes.length===0){
    alert('✅ 沒有需要修正的配方\n\n所有配方的真空袋用量都已正確 (= 成品包數)');
    return;
  }
  
  var rows=fixes.map(function(fx){
    return '<tr><td style="font-weight:600">'+esc(fx.recipeName)+'</td>'+

      '<td style="text-align:center;font-size:0.78rem;color:#666">每批 '+fx.perBatch+' 包</td></tr>';
  }).join('');
  
  modal(mH('🔧 修正真空袋用量')+
    '<div style="background:#FCEFE5;border:1px solid #E8C098;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:0.86rem;color:#9A6210;line-height:1.6">'+

  );

window.execVacuumBagFix=function(){
  var fixes=window.scanVacuumBagFix(true);
  if(fixes.length===0){closeModal();return}
  
  var done=0;
  fixes.forEach(function(fx){
    var r=(state.recipes||[]).find(function(x){return x.id===fx.recipeId});
    if(!r)return;
    var ing=(r.ings||[]).find(function(x){return x.name===fx.ingName});
    if(ing){
      ing.qty=fx.newQty;
      ing.unit=fx.newUnit;
      done++;
    }
  });
  
  if(typeof addAudit==='function')addAudit('一鍵修正真空袋用量',done+' 個配方');
  saveState();
  closeModal();
  renderPage();
  toast('✅ 已修正 '+done+' 個配方的真空袋用量');
};

// 🆕 可食率校正工具:掃描設了可食率<100% 的食材
window.scanYieldRates=function(){
  var list=[];
  (state.ings||[]).forEach(function(i){
    var yr=+i.yieldRate;
    if(yr>0&&yr<1){
      // 找用到此食材的配方數
      var usedIn=(state.recipes||[]).filter(function(r){
        return (r.ings||[]).some(function(ri){
          var inv=(state.ings||[]).find(function(x){return x.name===ri.name||x.id===ri.id});
          return inv&&inv.id===i.id;
        });
      });
      list.push({id:i.id,name:i.name,unit:i.unit,price:i.price,yieldRate:yr,recipeCount:usedIn.length});
    }
  });
  return list;
};

window._riSearchInner=function(idx,query){
  var drop=document.getElementById('ri-drop-'+idx);
  if(!drop)return;
  query=(query||'').toLowerCase().trim();
  var matches=state.ings.filter(function(iv){
    if(!query)return true;
    return iv.name.toLowerCase().indexOf(query)>=0||(iv.cat||'').toLowerCase().indexOf(query)>=0;
  }).slice(0,30);
  
  var html='';
  if(matches.length===0){
    if(query){
      html='<div style="padding:14px;text-align:center;color:#B82525"><div style="font-size:0.86rem;font-weight:700;margin-bottom:8px">⚠️ 食材庫無「'+esc(query)+'」</div><button class="btn btn-sm" style="background:#0A5A46;color:#fff" onclick="riQuickAdd('+idx+',\''+esc(query).replace(/'/g,"\\'")+'\')">➕ 快速新增「'+esc(query)+'」到食材庫</button></div>';
    }else{
      html='<div style="padding:10px;color:#999;font-size:0.82rem">食材庫尚無資料,請先到「🥬 食材庫存」新增</div>';
    }
  }else{
    html=matches.map(function(iv){
      var hint='<span style="font-size:0.74rem;color:#706E68">'+esc(iv.cat||'')+' · '+CUR()+(iv.price||0)+'/'+esc(iv.unit)+'</span>';
      return '<div onmousedown="riPick('+idx+',\''+esc(iv.name).replace(/'/g,"\\'")+'\',\''+esc(iv.unit)+'\')" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0f0f0" onmouseover="this.style.background=\'#f5f9f7\'" onmouseout="this.style.background=\'#fff\'"><div style="font-weight:600">'+esc(iv.name)+'</div>'+hint+'</div>';
    }).join('');
    var exactMatch=matches.find(function(iv){return iv.name===query});
    if(query&&!exactMatch){
      html+='<div style="padding:10px;border-top:2px solid #f0f0f0;background:#fffaf0"><button class="btn btn-sm" style="background:#0A5A46;color:#fff;width:100%" onclick="riQuickAdd('+idx+',\''+esc(query).replace(/'/g,"\\'")+'\')">➕ 找不到? 新增「'+esc(query)+'」到食材庫</button></div>';
    }
  }
  drop.innerHTML=html;
  drop.style.display='block';
};

window._syncRIFromDOM=function(){
  if(!window._editR||!window._editR.ings)return;
  window._editR.ings.forEach(function(ing,i){
    var nameEl=document.getElementById('ri-search-'+i);
    if(nameEl)ing.name=nameEl.value;
    var row=document.getElementById('ring-'+i);
    if(row){
      var qtyEl=row.querySelector('input[type="number"]');
      if(qtyEl)ing.qty=+qtyEl.value||0;
      var sels=row.querySelectorAll('select');
      if(sels[0])ing.unit=sels[0].value;
      if(sels[1])ing.form=sels[1].value;
    }
  });
};
window._riDragStart=function(e,i){
  window._syncRIFromDOM();
  window._riDragIdx=i;
  if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(i))}catch(err){}}
  var row=document.getElementById('ring-'+i);
  if(row)row.style.opacity='0.4';
};
window._riDragOver=function(e){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='move'};
window._riDragEnd=function(e){
  // 還原所有列透明度
  document.querySelectorAll('.recipe-ing-row').forEach(function(r){r.style.opacity=''});
};
window._riDrop=function(e,targetIdx){
  e.preventDefault();
  var from=window._riDragIdx;
  window._riDragIdx=null;
  if(from==null||from===targetIdx||!window._editR||!window._editR.ings)return;
  var ings=window._editR.ings;
  if(from<0||from>=ings.length||targetIdx<0||targetIdx>=ings.length)return;
  var moved=ings.splice(from,1)[0];
  ings.splice(targetIdx,0,moved);
  if(window._rebuildRI)window._rebuildRI();
};

// 找出未被使用的食材
window.findUnusedIngs=function(){
  var usedNames=new Set();
  // 配方使用的食材
  (state.recipes||[]).forEach(function(r){
    (r.ings||[]).forEach(function(ing){usedNames.add(ing.name)});
  });
  // 菜單使用的食材
  (state.menu||[]).forEach(function(m){(m.components||[]).forEach(function(c){if(c.sourceType==='ing'&&c.name)usedNames.add(c.name)});if(m.ing1)usedNames.add(m.ing1)});
  // 還在庫存有量的食材也保留
  return state.ings.filter(function(i){
    return !usedNames.has(i.name)&&(+i.stock||0)===0;
  });
};

// 找出停用且無交易的客戶
window.findUnusedCustomers=function(){
  return (state.customers||[]).filter(function(c){
    if(c.status==='active')return false;
    var hasOrders=(state.custOrders||[]).some(function(o){return o.custId===c.id});
    return !hasOrders;
  });
};

// 找出已完成超過 N 天的訂單 (預設 90 天)
window.findOldOrders=function(days){
  days=days||90;
  var threshold=new Date();
  threshold.setDate(threshold.getDate()-days);
  return (state.custOrders||[]).filter(function(o){
    if(['completed','cancelled','refunded'].indexOf(o.status)<0)return false;
    var d=new Date(o.orderDate||o.createdAt||'');
    return d<threshold;
  });
};

// 找出已完成超過 6 個月的採購單
window.findOldPOs=function(){
  var threshold=new Date();
  threshold.setMonth(threshold.getMonth()-6);
  return (state.poList||[]).filter(function(p){
    if(p.status!=='已收貨'&&p.status!=='已驗收')return false;
    var d=new Date(p.date||'');
    return d<threshold;
  });
};

// 找出已用完/過期超過 30 天的批次
window.findOldBatches=function(){
  var threshold=new Date();
  threshold.setDate(threshold.getDate()-30);
  return (state.batchList||[]).filter(function(b){
    if(b.status!=='已用完')return false;
    var d=new Date(b.disposalDate||b.expiryDate||'');
    return d<threshold;
  });
};
